    de: "switch/valve-Zonen ohne Zeitlimit im Controller ermitteln"
  - pl: "Po starcie HA poczekaj, aż sekcje będą dostępne"
    en: "After an HA start wait until the sections are available"
    de: "Nach dem HA-Start warten, bis die Zonen verfügbar sind"
  - pl: "Wybierz sekcje do zamknięcia"
