# Translations of the Polish blueprint, one entry per source line with text.
# Edit the translations, then run: python tools/blueprint_i18n.py build <blueprint> <catalog>
segments:
  - pl: "Inteligentne podlewanie ogrodu - 1 do 12 sekcji"
    en: "Smart garden irrigation - 1 to 12 sections"
    de: "Intelligente Gartenbewässerung - 1 bis 12 Zonen"
  - pl: "Wersja 1.11.0. Uniwersalny blueprint podlewania od 1 do 12 sekcji. Obsługuje instalacje"
    en: "Version 1.11.0. Universal irrigation blueprint for 1 to 12 sections. Supports"
    de: "Version 1.11.0. Universeller Bewässerungs-Blueprint für 1 bis 12 Zonen. Unterstützt"
  - pl: "Rain Bird RC2 oraz układy mieszane z dodatkowymi zaworami lub przekaźnikami"
    en: "Rain Bird RC2 installations and mixed setups with additional valves or relays"
    de: "Rain Bird RC2 sowie gemischte Anlagen mit zusätzlichen Ventilen oder Relais"
  - pl: "Sonoff, Shelly i ESPHome. Pogoda pochodzi z prognozy Home Assistant, a stacja"
    en: "from Sonoff, Shelly and ESPHome. The weather comes from the Home Assistant forecast, and a"
    de: "von Sonoff, Shelly und ESPHome. Das Wetter stammt aus der Home-Assistant-Vorhersage, eine"
  - pl: "pogodowa jest opcjonalna. Dla każdej sekcji osobno ustawiasz nazwę, encję sekcji, rodzaj"
    en: "weather station is optional. For each section you set its name, section entity, soil"
    de: "Wetterstation ist optional. Für jede Zone legst du Namen, Zonen-Entität, Bodenart,"
  - pl: "gleby, co rośnie, typ zraszaczy Rain Bird/Hunter, korektę czasu oraz"
    en: "type, plants, Rain Bird/Hunter sprinkler type, runtime adjustment and"
    de: "Bepflanzung, Rain-Bird-/Hunter-Regnertyp, Laufzeitkorrektur sowie"
  - pl: "opcjonalne sensory online/baterii. Zamknięcie każdej sekcji jest potwierdzane"
    en: "optional online/battery sensors. Closing of every section is confirmed"
    de: "optionale Online-/Batteriesensoren fest. Das Schließen jeder Zone wird bestätigt"
  - pl: "i ponawiane, a po restarcie HA otwarte sekcje switch/valve są zamykane."
    en: "and retried, and open switch/valve sections are closed after an HA restart."
    de: "und wiederholt, und offene switch/valve-Zonen werden nach einem HA-Neustart geschlossen."
  - pl: "Zwykłe przekaźniki warto dodatkowo zabezpieczyć sprzętowym limitem czasu"
    en: "Ordinary relays should additionally be protected by a hardware time limit"
    de: "Normale Relais sollten zusätzlich mit einem Hardware-Zeitlimit abgesichert werden"
  - pl: "(Shelly \"Auto OFF\", Sonoff \"Inching\", ESPHome on_turn_on + delay)."
    en: "(Shelly \"Auto OFF\", Sonoff \"Inching\", ESPHome on_turn_on + delay)."
    de: "(Shelly \"Auto OFF\", Sonoff \"Inching\", ESPHome on_turn_on + delay)."
  - pl: "Wspólne encje pogody i sensory"
    en: "Shared weather entities and sensors"
    de: "Gemeinsame Wetter-Entitäten und Sensoren"
  - pl: "Encja pogody do prognozy"
    en: "Forecast weather entity"
    de: "Wetter-Entität für die Vorhersage"
  - pl: "Encja pogody z Home Assistant z prognozą dzienną (np. Met.no, OpenWeatherMap). Daje prognozę opadu, szansę deszczu i warunki pogodowe, a bez stacji pogodowej także aktualną temperaturę, wiatr i UV."
    en: "Home Assistant weather entity with a daily forecast (e.g. Met.no, OpenWeatherMap). It provides the rain forecast, chance of rain and weather conditions, and without a weather station also the current temperature, wind and UV."
    de: "Home-Assistant-Wetter-Entität mit Tagesvorhersage (z. B. Met.no, OpenWeatherMap). Sie liefert die Niederschlagsvorhersage, die Regenwahrscheinlichkeit und die Wetterlage, ohne Wetterstation auch die aktuelle Temperatur, den Wind und den UV-Index."
  - pl: "Stacja pogodowa i czujniki (opcjonalnie)"
    en: "Weather station and sensors (optional)"
    de: "Wetterstation und Sensoren (optional)"
  - pl: "Lokalna encja pogody"
    en: "Local weather entity"
    de: "Lokale Wetter-Entität"
  - pl: "Opcjonalne nadpisanie aktualnego stanu pogody. Puste = użyj głównej encji prognozy."
    en: "Optional override for the current weather condition. Empty = use the main forecast entity."
    de: "Optionale Überschreibung der aktuellen Wetterlage. Leer = Haupt-Vorhersage-Entität verwenden."
  - pl: "Czujnik deszczu"
    en: "Rain sensor"
    de: "Regensensor"
  - pl: "Opcjonalny czujnik fizycznego deszczu. Gdy ma stan on, podlewanie nie wystartuje albo zostanie przerwane. Gdy jest niedostępny, podlewanie jest wstrzymane dla bezpieczeństwa."
    en: "Optional physical rain sensor. When it is on, watering does not start or is interrupted. When it is unavailable, watering is held for safety."
    de: "Optionaler physischer Regensensor. Ist er an, startet die Bewässerung nicht oder wird unterbrochen. Ist er nicht verfügbar, wird die Bewässerung zur Sicherheit angehalten."
  - pl: "Opad zmierzony - najlepiej ostatnie 24 h"
    en: "Measured rain - preferably the last 24 h"
    de: "Gemessener Niederschlag - am besten die letzten 24 h"
  - pl: "Sensor opadu w mm. Najlepszy jest opad kroczący z ostatnich 24 h albo suma trwającego zdarzenia deszczowego; sensor tylko dzienny może pominąć deszcz po północy. Wartość jest odejmowana od bilansu. Bez tego sensora opad do bilansu jest szacowany z prognozy dziennej encji pogody (raz na dobę, oznaczony w powiadomieniach jako szacunek z prognozy). Gdy sensor jest chwilowo niedostępny, bilans nie zmienia zapamiętanego opadu."
    en: "Rain sensor in mm. A rolling 24-hour total or the total of the current rain event is best; a daily-only sensor may miss rain after midnight. The value is subtracted from the balance. Without this sensor the rain for the balance is estimated from the daily forecast of the weather entity (once per day, marked in notifications as an estimate from the forecast). When the sensor is temporarily unavailable, the balance keeps the stored rain."
    de: "Niederschlagssensor in mm. Am besten ist eine gleitende 24-Stunden-Summe oder die Summe des laufenden Regenereignisses; ein nur täglicher Sensor kann Regen nach Mitternacht verpassen. Der Wert wird von der Bilanz abgezogen. Ohne diesen Sensor wird der Niederschlag für die Bilanz aus der Tagesvorhersage der Wetter-Entität geschätzt (einmal pro Tag, in Benachrichtigungen als Schätzung aus der Vorhersage gekennzeichnet). Ist der Sensor vorübergehend nicht verfügbar, behält die Bilanz den gespeicherten Niederschlag."
  - pl: "Temperatura ogrodu"
    en: "Garden temperature"
    de: "Gartentemperatur"
  - pl: "Opcjonalny sensor temperatury w ogrodzie albo encja weather. Puste = użyj głównej encji pogody. Niska temperatura blokuje podlewanie, upał zwiększa dawkę. Gdy wybrany sensor jest niedostępny, używana jest aktualna temperatura z encji pogody; bez żadnej aktualnej temperatury podlewanie jest wstrzymane. Temperatura w °F jest automatycznie przeliczana na °C."
    en: "Optional garden temperature sensor or weather entity. Empty = use the main weather entity. Low temperature blocks watering, heat increases the dose. When the selected sensor is unavailable, the current temperature of the weather entity is used; without any current temperature watering is held. Temperatures in °F are converted to °C automatically."
    de: "Optionaler Temperatursensor im Garten oder Wetter-Entität. Leer = Haupt-Wetter-Entität verwenden. Niedrige Temperatur sperrt die Bewässerung, Hitze erhöht die Menge. Ist der gewählte Sensor nicht verfügbar, wird die aktuelle Temperatur der Wetter-Entität verwendet; ohne aktuelle Temperatur wird die Bewässerung angehalten. Temperaturen in °F werden automatisch in °C umgerechnet."
  - pl: "Wiatr"
    en: "Wind"
    de: "Wind"
  - pl: "Opcjonalny sensor wiatru albo encja weather. Puste = użyj głównej encji pogody. Zbyt mocny wiatr blokuje podlewanie, bo zraszacze traciłyby równomierność. Gdy wybrany sensor jest niedostępny, używany jest wiatr z encji pogody; jeśli i tam go brakuje, podlewanie jest wstrzymane."
    en: "Optional wind sensor or weather entity. Empty = use the main weather entity. Too strong wind blocks watering because the sprinklers would lose uniformity. When the selected sensor is unavailable, the wind of the weather entity is used; if it is missing there as well, watering is held."
    de: "Optionaler Windsensor oder Wetter-Entität. Leer = Haupt-Wetter-Entität verwenden. Zu starker Wind sperrt die Bewässerung, weil die Regner ungleichmäßig verteilen würden. Ist der gewählte Sensor nicht verfügbar, wird der Wind der Wetter-Entität verwendet; fehlt er auch dort, wird die Bewässerung angehalten."
  - pl: "UV / słońce"
    en: "UV / sun"
    de: "UV / Sonne"
  - pl: "Opcjonalny sensor UV/słońca albo weather z uv_index. Puste = użyj głównej encji weather. Używany do awaryjnego szacowania ewapotranspiracji, gdy ET0 nie jest dostępne."
    en: "Optional UV/sun sensor or weather entity with uv_index. Empty = use the main weather entity. Used for the fallback evapotranspiration estimate when ET0 is not available."
    de: "Optionaler UV-/Sonnensensor oder Wetter-Entität mit uv_index. Leer = Haupt-Wetter-Entität verwenden. Wird für die Ersatzschätzung der Evapotranspiration genutzt, wenn ET0 nicht verfügbar ist."
  - pl: "Dzienne ET0 / ewapotranspiracja"
    en: "Daily ET0 / evapotranspiration"
    de: "Tägliche ET0 / Evapotranspiration"
  - pl: "Opcjonalny sensor dziennej referencyjnej ewapotranspiracji w mm. Puste = ET0 jest szacowane z temperatury, UV i wiatru."
    en: "Optional sensor of daily reference evapotranspiration in mm. Empty = ET0 is estimated from temperature, UV and wind."
    de: "Optionaler Sensor der täglichen Referenz-Evapotranspiration in mm. Leer = ET0 wird aus Temperatur, UV und Wind geschätzt."
  - pl: "Promieniowanie słoneczne - średnia 24 h"
    en: "Solar radiation - 24 h mean"
    de: "Sonneneinstrahlung - 24-h-Mittel"
  - pl: "Opcjonalne. Średnie promieniowanie słoneczne z ostatnich 24 godzin w W/m², liczone"
    en: "Optional. Mean solar radiation of the last 24 hours in W/m², calculated"
    de: "Optional. Mittlere Sonneneinstrahlung der letzten 24 Stunden in W/m², berechnet"
  - pl: "z czujnika stacji pogodowej. Gdy je wybierzesz, ET0 jest liczone metodą Hargreavesa"
    en: "from the weather station sensor. When selected, ET0 is calculated with the Hargreaves"
    de: "aus dem Sensor der Wetterstation. Wenn gewählt, wird ET0 mit der Hargreaves-Methode"
  - pl: "z promieniowaniem, która jest dokładniejsza niż szacowanie z temperatury, UV i wiatru."
    en: "radiation method, which is more accurate than the estimate from temperature, UV and wind."
    de: "mit Strahlung berechnet, die genauer ist als die Schätzung aus Temperatur, UV und Wind."
  - pl: "Jak utworzyć - 1) Ustawienia, Urządzenia i usługi, Pomocnicy, Utwórz pomocnika,"
    en: "How to create it - 1) Settings, Devices & services, Helpers, Create helper,"
    de: "So legst du ihn an - 1) Einstellungen, Geräte & Dienste, Helfer, Helfer erstellen,"
  - pl: "Statystyka. 2) Wybierz czujnik promieniowania słonecznego stacji w W/m². 3) Cecha -"
    en: "Statistics. 2) Select the solar radiation sensor of the station in W/m². 3) Characteristic -"
    de: "Statistik. 2) Wähle den Sonneneinstrahlungssensor der Station in W/m². 3) Merkmal -"
  - pl: "średnia liniowa ważona czasem (average_linear), a nie zwykła średnia, bo w nocy"
    en: "time-weighted linear average (average_linear), not the plain mean, because at night"
    de: "zeitgewichteter linearer Mittelwert (average_linear), nicht der einfache Mittelwert, weil"
  - pl: "czujnik rzadko zmienia stan. 4) Maksymalny wiek 24 godziny, liczbę próbek zostaw"
    en: "the sensor rarely changes state. 4) Max age 24 hours, leave the sampling size"
    de: "der Sensor nachts selten den Zustand ändert. 4) Maximales Alter 24 Stunden, Stichprobengröße"
  - pl: "pustą. 5) Wybierz tutaj utworzony czujnik. Czujnik dziennego ET0 powyżej ma"
    en: "empty. 5) Select the created sensor here. The daily ET0 sensor above has"
    de: "leer lassen. 5) Wähle hier den erstellten Sensor. Der Sensor für die tägliche ET0 oben hat"
  - pl: "pierwszeństwo. Gdy ten czujnik jest niedostępny, używane jest szacowanie zastępcze."
    en: "priority. When this sensor is unavailable, the fallback estimate is used."
    de: "Vorrang. Ist dieser Sensor nicht verfügbar, wird die Ersatzschätzung verwendet."
  - pl: "Wilgotność gleby"
    en: "Soil moisture"
    de: "Bodenfeuchte"
  - pl: "Opcjonalny, reprezentatywny sensor wilgotności gleby w procentach. Działa jako bezpośrednia blokada podlewania po osiągnięciu progu ustawionego w sekcji blokad pogodowych."
    en: "Optional representative soil moisture sensor in percent. It blocks watering directly once the threshold set in the weather blocks section is reached."
    de: "Optionaler repräsentativer Bodenfeuchtesensor in Prozent. Er sperrt die Bewässerung direkt, sobald die im Abschnitt Wettersperren eingestellte Schwelle erreicht ist."
  - pl: "Ustawienia ogólne"
    en: "General settings"
    de: "Allgemeine Einstellungen"
  - pl: "Liczba sekcji"
    en: "Number of sections"
    de: "Anzahl der Zonen"
  - pl: "Ile sekcji ma obsługiwać ta automatyzacja. Sekcje powyżej tej liczby zostają w konfiguracji, ale są ignorowane."
    en: "How many sections this automation controls. Sections above this number stay in the configuration but are ignored."
    de: "Wie viele Zonen diese Automatisierung steuert. Zonen über dieser Anzahl bleiben in der Konfiguration, werden aber ignoriert."
  - pl: "Przekazuj wyliczony czas do sterownika Rain Bird"
    en: "Send the calculated runtime to the Rain Bird controller"
    de: "Berechnete Laufzeit an den Rain-Bird-Controller senden"
  - pl: "Dla Rain Bird RC2 automatyzacja zawsze używa rainbird_rc2.start_zone. To ustawienie włącza przekazywanie czasu do starszej integracji Rain Bird przez rainbird.start_irrigation. Nie zmienia obsługi Sonoff, Shelly, ESPHome ani innych zwykłych encji switch/valve."
    en: "For Rain Bird RC2 the automation always uses rainbird_rc2.start_zone. This setting sends the runtime to the older Rain Bird integration through rainbird.start_irrigation. It does not change how Sonoff, Shelly, ESPHome or other ordinary switch/valve entities are handled."
    de: "Für Rain Bird RC2 verwendet die Automatisierung immer rainbird_rc2.start_zone. Diese Einstellung übergibt die Laufzeit an die ältere Rain-Bird-Integration über rainbird.start_irrigation. Sie ändert nichts an Sonoff, Shelly, ESPHome oder anderen normalen switch/valve-Entitäten."
  - pl: "Nadzór czasu pracy sekcji"
    en: "Section runtime watchdog"
    de: "Laufzeitüberwachung der Zonen"
  - pl: "Zalecane. Zamyka sekcję switch/valve tej automatyzacji (poza Rain Bird RC2 i Rain Bird, które mają własny limit czasu w sterowniku), jeśli jest włączona dłużej niż maksymalny czas sekcji + 5 min, niezależnie od tego, kto ją włączył. Chroni przed zalaniem po przerwanym przebiegu. Wyłącz tylko wtedy, gdy celowo podlewasz ręcznie dłużej niż ten limit."
    en: "Recommended. Closes a switch/valve section of this automation (except Rain Bird RC2 and Rain Bird, which have their own time limit in the controller) when it stays on longer than the maximum section runtime + 5 min, no matter who turned it on. Protects against flooding after an interrupted run. Disable it only if you deliberately water manually for longer than this limit."
    de: "Empfohlen. Schließt eine switch/valve-Zone dieser Automatisierung (außer Rain Bird RC2 und Rain Bird, die ein eigenes Zeitlimit im Controller haben), wenn sie länger als die maximale Zonenlaufzeit + 5 min an ist, egal wer sie eingeschaltet hat. Schützt vor Überschwemmung nach einem unterbrochenen Lauf. Nur deaktivieren, wenn du absichtlich länger als dieses Limit manuell bewässerst."
  - pl: "Sekcja 1"
    en: "Section 1"
    de: "Zone 1"
  - pl: "Sekcja 1 - encja"
    en: "Section 1 - entity"
    de: "Zone 1 - Entität"
  - pl: "\"Encja sekcji Rain Bird RC2 albo dowolna encja valve/switch, np. Sonoff, Shelly lub ESPHome. Automatyzacja uruchomi sekcję na wyliczony czas i zatrzyma ją po zakończeniu.\""
    en: "\"Rain Bird RC2 section entity or any valve/switch entity, e.g. Sonoff, Shelly or ESPHome. The automation runs the section for the calculated time and stops it afterwards.\""
    de: "\"Rain-Bird-RC2-Zonen-Entität oder beliebige valve/switch-Entität, z. B. Sonoff, Shelly oder ESPHome. Die Automatisierung startet die Zone für die berechnete Zeit und stoppt sie danach.\""
  - pl: "Sekcja 1 - nazwa"
    en: "Section 1 - name"
    de: "Zone 1 - Name"
  - pl: "Czytelna nazwa sekcji widoczna w śladach automatyzacji i ułatwiająca rozpoznanie obszaru podlewania."
    en: "Readable section name shown in automation traces that helps to recognise the watered area."
    de: "Lesbarer Zonenname, der in den Automatisierungs-Traces erscheint und die Bewässerungsfläche erkennbar macht."
  - pl: "Sekcja 1 - rodzaj gleby"
    en: "Section 1 - soil type"
    de: "Zone 1 - Bodenart"
  - pl: "Wybierz najbliższy opis ziemi w ogrodzie. Lekkie gleby szybciej tracą wodę, a humus i czarnoziem dłużej ją magazynują."
    en: "Choose the closest description of the garden soil. Light soils lose water faster, humus and black soil store it longer."
    de: "Wähle die passendste Beschreibung des Gartenbodens. Leichte Böden verlieren Wasser schneller, Humus und Schwarzerde speichern es länger."
  - pl: "Piaszczysta / bardzo lekka"
    en: "Sandy / very light"
    de: "Sandig / sehr leicht"
  - pl: "Lekka ogrodowa"
    en: "Light garden soil"
    de: "Leichter Gartenboden"
  - pl: "Zwykła ziemia ogrodowa"
    en: "Normal garden soil"
    de: "Normaler Gartenboden"
  - pl: "Humusowa / próchniczna"
    en: "Humus-rich / compost-rich"
    de: "Humusreich / kompostreich"
  - pl: "Czarnoziem / czarna ziemia"
    en: "Black soil / chernozem"
    de: "Schwarzerde / Tschernosem"
  - pl: "Gliniasta / ciężka"
    en: "Clay loam / heavy"
    de: "Lehmig / schwer"
  - pl: "Bardzo ciężka / zbita glina"
    en: "Very heavy / compacted clay"
    de: "Sehr schwer / verdichteter Ton"
  - pl: "Sekcja 1 - co rośnie"
    en: "Section 1 - plants"
    de: "Zone 1 - Bepflanzung"
  - pl: "Określa bazowe zapotrzebowanie na wodę. Warzywa najwięcej, trawa średnio, krzewy zwykle mniej."
    en: "Sets the base water demand. Vegetables need the most, grass is average, shrubs usually need less."
    de: "Legt den Grundwasserbedarf fest. Gemüse braucht am meisten, Rasen mittel, Sträucher meist weniger."
  - pl: "Trawa"
    en: "Grass"
    de: "Rasen"
  - pl: "Kwiaty"
    en: "Flowers"
    de: "Blumen"
  - pl: "Warzywa"
    en: "Vegetables"
    de: "Gemüse"
  - pl: "Krzewy"
    en: "Shrubs"
    de: "Sträucher"
  - pl: "Sekcja 1 - zraszacze"
    en: "Section 1 - sprinklers"
    de: "Zone 1 - Regner"
  - pl: "Profil ustawia opad instalacji w mm/h. Im większy opad zraszaczy, tym krótszy wyliczony czas podlewania."
    en: "The profile sets the precipitation rate of the installation in mm/h. The higher the sprinkler rate, the shorter the calculated runtime."
    de: "Das Profil legt die Niederschlagsrate der Anlage in mm/h fest. Je höher die Rate der Regner, desto kürzer die berechnete Laufzeit."
  - pl: "Rain Bird 5000/3500 - rotory"
    en: "Rain Bird 5000/3500 - rotors"
    de: "Rain Bird 5000/3500 - Getrieberegner"
  - pl: "Rain Bird 1800 - spray/statyczne"
    en: "Rain Bird 1800 - spray/fixed"
    de: "Rain Bird 1800 - Sprühregner"
  - pl: "Rain Bird R-VAN - dysze rotacyjne"
    en: "Rain Bird R-VAN - rotary nozzles"
    de: "Rain Bird R-VAN - Rotordüsen"
  - pl: "Rain Bird XF - linia kroplująca"
    en: "Rain Bird XF - dripline"
    de: "Rain Bird XF - Tropfrohr"
  - pl: "Rain Bird - rotory ogólne"
    en: "Rain Bird - generic rotors"
    de: "Rain Bird - Getrieberegner allgemein"
  - pl: "Rain Bird - spray ogólny"
    en: "Rain Bird - generic spray"
    de: "Rain Bird - Sprühregner allgemein"
  - pl: "Rain Bird - linia kroplująca ogólna"
    en: "Rain Bird - generic dripline"
    de: "Rain Bird - Tropfrohr allgemein"
  - pl: "Hunter - rotory"
    en: "Hunter - rotors"
    de: "Hunter - Getrieberegner"
  - pl: "Hunter - MP Rotator"
    en: "Hunter - MP Rotator"
    de: "Hunter - MP Rotator"
  - pl: "Hunter - spray/statyczne"
    en: "Hunter - spray/fixed"
    de: "Hunter - Sprühregner"
  - pl: "Hunter - linia kroplująca"
    en: "Hunter - dripline"
    de: "Hunter - Tropfrohr"
  - pl: "Własny opad zraszaczy"
    en: "Custom sprinkler rate"
    de: "Eigene Niederschlagsrate"
  - pl: "Sekcja 1 - własny opad zraszaczy"
    en: "Section 1 - custom sprinkler rate"
    de: "Zone 1 - eigene Niederschlagsrate"
  - pl: "Używane tylko przy profilu \"Własny opad zraszaczy\". Wpisz rzeczywisty opad sekcji w mm/h, jeżeli znasz go z testu kubeczkowego albo dokumentacji."
    en: "Used only with the \"Custom sprinkler rate\" profile. Enter the real precipitation rate of the section in mm/h if you know it from a catch-cup test or the documentation."
    de: "Nur mit dem Profil \"Eigene Niederschlagsrate\". Trage die tatsächliche Niederschlagsrate der Zone in mm/h ein, wenn du sie aus einem Bechertest oder der Dokumentation kennst."
  - pl: "Sekcja 1 - korekta czasu"
    en: "Section 1 - runtime adjustment"
    de: "Zone 1 - Laufzeitkorrektur"
  - pl: "Ręczna korekta czasu pracy tej sekcji. 100% = bez zmian, więcej wydłuża podlewanie, mniej skraca. Bilans wody odejmuje wodę faktycznie podaną, więc korekta zmienia ilość wody w jednym podlewaniu, a nie łączną ilość wody - krótsze podlewanie będzie częstsze, dłuższe rzadsze."
    en: "Manual runtime adjustment for this section. 100% = no change, more makes watering longer, less makes it shorter. The water balance subtracts the water actually applied, so the adjustment changes the amount per watering, not the total amount of water - shorter runs will be more frequent, longer runs less frequent."
    de: "Manuelle Laufzeitkorrektur dieser Zone. 100% = keine Änderung, mehr verlängert die Bewässerung, weniger verkürzt sie. Die Wasserbilanz zieht das tatsächlich ausgebrachte Wasser ab, daher ändert die Korrektur die Menge pro Bewässerung, nicht die Gesamtmenge - kürzere Läufe kommen häufiger, längere seltener."
  - pl: "Sekcja 1 - online"
    en: "Section 1 - online"
    de: "Zone 1 - online"
