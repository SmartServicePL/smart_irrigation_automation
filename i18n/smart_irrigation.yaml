  - pl: "Harmonogram, sezon i progi"
    en: "Schedule, season and thresholds"
    de: "Zeitplan, Saison und Schwellen"
  - pl: "Start podlewania"
    en: "Watering start"
    de: "Bewässerungsstart"
  - pl: "Stała godzina używa godzin poniżej. Tryb słońca startuje podlewanie względem wschodu albo zachodu."
    en: "Fixed time uses the times below. Sun mode starts watering relative to sunrise or sunset."
    de: "Feste Uhrzeit verwendet die Zeiten unten. Der Sonnenmodus startet die Bewässerung relativ zu Sonnenaufgang oder -untergang."
  - pl: "Stała godzina"
    en: "Fixed time"
    de: "Feste Uhrzeit"
  - pl: "Względem wschodu słońca"
    en: "Relative to sunrise"
    de: "Relativ zum Sonnenaufgang"
  - pl: "Względem zachodu słońca"
    en: "Relative to sunset"
    de: "Relativ zum Sonnenuntergang"
  - pl: "Przesunięcie względem słońca"
    en: "Sun offset"
    de: "Versatz zur Sonne"
  - pl: "Minuty względem wschodu/zachodu. Wartość ujemna = przed, dodatnia = po."
    en: "Minutes relative to sunrise/sunset. Negative = before, positive = after."
    de: "Minuten relativ zu Sonnenaufgang/-untergang. Negativ = vorher, positiv = nachher."
  - pl: "Główna godzina podlewania"
    en: "Main watering time"
    de: "Hauptbewässerungszeit"
  - pl: "Używana tylko przy trybie \"Stała godzina\"."
    en: "Used only with the \"Fixed time\" mode."
    de: "Nur im Modus \"Feste Uhrzeit\"."
  - pl: "Awaryjny start po pominiętej godzinie"
    en: "Recovery start after a missed main time"
    de: "Ersatzstart nach verpasster Hauptzeit"
  - pl: "Używany tylko przy stałej godzinie, gdy HA nie wykonał głównego startu. Wymaga helpera następnego podlewania. Nie wykonuje drugiej decyzji po prawidłowej głównej próbie."
    en: "Used only with a fixed time when HA missed the main start. Requires the next watering helper. It does not make a second decision after a successful main run."
    de: "Nur bei fester Uhrzeit, wenn HA den Hauptstart verpasst hat. Benötigt den Helfer für die nächste Bewässerung. Nach einem erfolgreichen Hauptlauf wird keine zweite Entscheidung getroffen."
  - pl: "Włącz awaryjny start"
    en: "Enable recovery start"
    de: "Ersatzstart aktivieren"
  - pl: "Dotyczy tylko stałej godziny i wymaga helpera następnego podlewania. Zapobiega utracie cyklu po restarcie HA, ale nie tworzy drugiego komunikatu tego samego dnia."
    en: "Applies only to a fixed time and requires the next watering helper. Prevents losing a cycle after an HA restart but does not create a second message on the same day."
    de: "Gilt nur für feste Uhrzeit und benötigt den Helfer für die nächste Bewässerung. Verhindert den Verlust eines Zyklus nach einem HA-Neustart, erzeugt aber keine zweite Meldung am selben Tag."
  - pl: "Włącz dodatkowe przeliczenia"
    en: "Enable additional recalculations"
    de: "Zusätzliche Neuberechnungen aktivieren"
  - pl: "O tych godzinach automatyzacja realnie pobiera pogodę i przelicza potrzebę podlewania, ale nie otwiera sekcji. Aktualizuje helper następnego podlewania i opcjonalnie Logbook, bez powiadomień HA."
    en: "At these times the automation fetches the weather and recalculates the watering need but does not open any section. It updates the next watering helper and optionally the Logbook, without HA notifications."
    de: "Zu diesen Zeiten ruft die Automatisierung das Wetter ab und berechnet den Bewässerungsbedarf neu, öffnet aber keine Zone. Sie aktualisiert den Helfer für die nächste Bewässerung und optional das Logbuch, ohne HA-Benachrichtigungen."
  - pl: "Sprawdzenie 1"
    en: "Check 1"
    de: "Prüfung 1"
  - pl: "Godzina kontrolnego przeliczenia bez uruchamiania podlewania."
    en: "Time of a check recalculation without starting watering."
    de: "Uhrzeit einer Kontrollberechnung ohne Bewässerungsstart."
  - pl: "Sprawdzenie 2"
    en: "Check 2"
    de: "Prüfung 2"
  - pl: "Sprawdzenie 3"
    en: "Check 3"
    de: "Prüfung 3"
  - pl: "Sprawdzenie 4"
    en: "Check 4"
    de: "Prüfung 4"
  - pl: "Miesiąc startu sezonu"
    en: "Season start month"
    de: "Startmonat der Saison"
  - pl: "Pierwszy miesiąc, w którym automatyzacja może podlewać. Poza sezonem sekcje nie są uruchamiane."
    en: "First month in which the automation may water. Outside the season no section is started."
    de: "Erster Monat, in dem die Automatisierung bewässern darf. Außerhalb der Saison werden keine Zonen gestartet."
  - pl: "Miesiąc końca sezonu"
    en: "Season end month"
    de: "Endmonat der Saison"
  - pl: "Ostatni miesiąc sezonu podlewania. Przykład 4-10 oznacza podlewanie od kwietnia do października."
    en: "Last month of the watering season. Example 4-10 means watering from April to October."
    de: "Letzter Monat der Bewässerungssaison. Beispiel 4-10 bedeutet Bewässerung von April bis Oktober."
  - pl: "Minimalna dawka do startu"
    en: "Minimum dose to start"
    de: "Mindestmenge für den Start"
  - pl: "Jeśli wyliczona dawka dla sekcji jest mniejsza, sekcja zostanie pominięta. Chroni przed bezsensownymi, bardzo krótkimi cyklami."
    en: "If the calculated dose of a section is smaller, the section is skipped. Protects against pointless, very short cycles."
    de: "Ist die berechnete Menge einer Zone kleiner, wird die Zone übersprungen. Schützt vor sinnlosen, sehr kurzen Zyklen."
  - pl: "Maksymalna dawka jednego podlewania"
    en: "Maximum dose per watering"
    de: "Höchstmenge pro Bewässerung"
  - pl: "Górny limit wody na jedno podlewanie sekcji. Chroni przed przelaniem i zbyt długą pracą po kilku suchych dniach."
    en: "Upper limit of water for one watering of a section. Protects against overwatering and overly long runs after several dry days."
    de: "Obergrenze an Wasser für eine Bewässerung einer Zone. Schützt vor Überwässerung und zu langen Läufen nach mehreren trockenen Tagen."
  - pl: "Minimalny czas sekcji"
    en: "Minimum section runtime"
    de: "Minimale Zonenlaufzeit"
  - pl: "Najkrótszy czas pracy sekcji, jeśli podlewanie już wystartuje. Pomaga utrzymać stabilną pracę sekcji i instalacji."
    en: "Shortest runtime of a section once watering starts. Helps to keep the section and the installation running steadily."
    de: "Kürzeste Laufzeit einer Zone, wenn die Bewässerung startet. Hilft, Zone und Anlage stabil zu betreiben."
  - pl: "Maksymalny czas sekcji"
    en: "Maximum section runtime"
    de: "Maximale Zonenlaufzeit"
  - pl: "Najdłuższy dopuszczalny czas pracy jednej sekcji w jednym cyklu. Ogranicza ryzyko zbyt długiego podlewania."
    en: "Longest allowed runtime of one section in one cycle. Limits the risk of watering for too long."
    de: "Längste zulässige Laufzeit einer Zone in einem Zyklus. Begrenzt das Risiko zu langer Bewässerung."
  - pl: "Przerwa między sekcjami"
    en: "Pause between sections"
    de: "Pause zwischen den Zonen"
  - pl: "Odstęp po zamknięciu jednej sekcji przed startem kolejnej. Daje instalacji czas na ustabilizowanie ciśnienia."
    en: "Gap after closing one section before the next one starts. Gives the installation time to stabilise the pressure."
    de: "Abstand nach dem Schließen einer Zone vor dem Start der nächsten. Gibt der Anlage Zeit, den Druck zu stabilisieren."
  - pl: "Blokady pogodowe"
    en: "Weather blocks"
    de: "Wettersperren"
  - pl: "Prognozowany deszcz blokujący"
    en: "Forecast rain that blocks watering"
    de: "Vorhergesagter Regen, der die Bewässerung sperrt"
  - pl: "Jeśli prognoza pokazuje co najmniej tyle mm deszczu, podlewanie zostanie pominięte."
    en: "If the forecast shows at least this many mm of rain, watering is skipped."
    de: "Zeigt die Vorhersage mindestens so viele mm Regen, wird die Bewässerung übersprungen."
  - pl: "Prawdopodobieństwo deszczu blokujące"
    en: "Rain probability that blocks watering"
    de: "Regenwahrscheinlichkeit, die die Bewässerung sperrt"
  - pl: "Podlewanie zostanie zablokowane, gdy szansa deszczu przekroczy ten próg i prognoza pokazuje co najmniej 1 mm opadu."
    en: "Watering is blocked when the chance of rain exceeds this threshold and the forecast shows at least 1 mm of rain."
    de: "Die Bewässerung wird gesperrt, wenn die Regenwahrscheinlichkeit diese Schwelle überschreitet und die Vorhersage mindestens 1 mm Niederschlag zeigt."
  - pl: "Ile deszczu odjąć od dawki"
    en: "Share of rain credited"
    de: "Anrechenbarer Regenanteil"
  - pl: "Ile procent nowego deszczu zapisać jako wodę dostarczoną glebie - zmierzonego przez stację albo, bez stacji, szacowanego z prognozy na miniony dzień. Prognoza na dziś i jutro tylko odkłada start. 80% uwzględnia typowe straty."
    en: "Percentage of new rain booked as water delivered to the soil - measured by the station or, without a station, estimated from the forecast for the past day. The forecast for today and tomorrow only delays the start. 80% accounts for typical losses."
    de: "Prozentsatz des neuen Regens, der als dem Boden zugeführtes Wasser gebucht wird - von der Station gemessen oder, ohne Station, aus der Vorhersage für den vergangenen Tag geschätzt. Die Vorhersage für heute und morgen verschiebt nur den Start. 80% berücksichtigen typische Verluste."
  - pl: "Minimalna temperatura"
    en: "Minimum temperature"
    de: "Mindesttemperatur"
  - pl: "Poniżej tej temperatury podlewanie nie wystartuje. Chroni rośliny i instalacje przy zimnych porankach."
    en: "Below this temperature watering does not start. Protects plants and the installation on cold mornings."
    de: "Unter dieser Temperatur startet die Bewässerung nicht. Schützt Pflanzen und Anlage an kalten Morgen."
  - pl: "Temperatura upału"
    en: "Hot-weather temperature"
    de: "Hitzetemperatur"
  - pl: "Od tej temperatury automatyzacja lekko zwiększa dawkę wody, bo parowanie jest większe."
    en: "From this temperature the automation slightly increases the water dose because evaporation is higher."
    de: "Ab dieser Temperatur erhöht die Automatisierung die Wassermenge leicht, weil die Verdunstung höher ist."
  - pl: "Maksymalny wiatr"
    en: "Maximum wind"
    de: "Maximaler Wind"
  - pl: "Limit w km/h. Prędkość z encji w m/s, mph lub węzłach jest automatycznie przeliczana. Powyżej limitu podlewanie zostanie pominięte, żeby woda nie była znoszona poza sekcje."
    en: "Limit in km/h. Speeds reported in m/s, mph or knots are converted automatically. Above the limit watering is skipped so that the water is not blown outside the sections."
    de: "Grenze in km/h. Geschwindigkeiten in m/s, mph oder Knoten werden automatisch umgerechnet. Oberhalb der Grenze wird die Bewässerung übersprungen, damit das Wasser nicht aus den Zonen geweht wird."
  - pl: "Minimalna bateria sekcji"
    en: "Minimum section battery"
    de: "Minimale Zonenbatterie"
  - pl: "Jeśli sekcja ma sensor baterii i bateria jest poniżej tego progu, sekcja zostanie pominięta."
    en: "If a section has a battery sensor and the battery is below this threshold, the section is skipped."
    de: "Hat eine Zone einen Batteriesensor und liegt die Batterie unter dieser Schwelle, wird die Zone übersprungen."
  - pl: "Wilgotność gleby blokująca podlewanie"
    en: "Soil moisture that blocks watering"
    de: "Bodenfeuchte, die die Bewässerung sperrt"
  - pl: "Używane tylko po wybraniu sensora wilgotności gleby. Po osiągnięciu tego progu czujnik bezpośrednio blokuje cykl, tak jak profesjonalny sterownik oparty na wilgotności. Próg ustaw zgodnie z kalibracją swojego sensora."
    en: "Used only when a soil moisture sensor is selected. Once this threshold is reached the sensor blocks the cycle directly, like a professional moisture-based controller. Set the threshold according to the calibration of your sensor."
    de: "Nur mit gewähltem Bodenfeuchtesensor. Ab dieser Schwelle sperrt der Sensor den Zyklus direkt, wie ein professioneller feuchtebasierter Controller. Stelle die Schwelle passend zur Kalibrierung deines Sensors ein."
  - pl: "Sprawność instalacji"
    en: "Irrigation efficiency"
    de: "Bewässerungseffizienz"
  - pl: "Uwzględnia straty instalacji, nierówny opad i parowanie. Niższa wartość wydłuża podlewanie; 70-85% jest typowe."
    en: "Accounts for installation losses, uneven distribution and evaporation. A lower value makes watering longer; 70-85% is typical."
    de: "Berücksichtigt Anlagenverluste, ungleichmäßige Verteilung und Verdunstung. Ein niedrigerer Wert verlängert die Bewässerung; 70-85% sind üblich."
  - pl: "Logi podlewania"
    en: "Irrigation logs"
    de: "Bewässerungsprotokolle"
  - pl: "Włącz logbook.log"
    en: "Enable logbook.log"
    de: "logbook.log aktivieren"
  - pl: "Dodaje wpisy do Logbooka HA. Obejmuje start cyklu, pomijanie z powodem, start/koniec sekcji oraz przerwanie przez deszcz."
    en: "Adds entries to the HA Logbook for the cycle start, skips with a reason, section start/end and interruption by rain."
    de: "Fügt Einträge zum HA-Logbuch hinzu, und zwar für Zyklusstart, Überspringen mit Grund, Zonenstart/-ende und Unterbrechung durch Regen."
  - pl: "Twórz powiadomienie persistent_notification"
    en: "Create persistent_notification"
    de: "persistent_notification erstellen"
  - pl: "Pokazuje powiadomienia tylko przy starcie podlewania, końcu z czasem sekcji, pominięciu albo przerwaniu z krótkim powodem."
    en: "Shows notifications only when watering starts, when it ends with the section times, or when it is skipped or interrupted, with a short reason."
    de: "Zeigt Benachrichtigungen nur beim Bewässerungsstart, am Ende mit den Zonenzeiten sowie beim Überspringen oder Unterbrechen mit kurzem Grund."
  - pl: "Helper - następne podlewanie"
    en: "Helper - next watering"
    de: "Helfer - nächste Bewässerung"
  - pl: "Opcjonalny input_datetime z datą i godziną. Automatyzacja zapisze w nim szacowany termin następnego podlewania po każdym sprawdzeniu cyklu."
    en: "Optional input_datetime with date and time. After every cycle check the automation stores the estimated next watering time in it."
    de: "Optionaler input_datetime mit Datum und Uhrzeit. Nach jeder Zyklusprüfung speichert die Automatisierung darin den geschätzten nächsten Bewässerungstermin."
  - pl: "Helper - trwały bilans wody"
    en: "Helper - persistent water balance"
    de: "Helfer - dauerhafte Wasserbilanz"
  - pl: "Zalecany input_text zapisujący bilans ET, deszczu (ze stacji albo szacunku z prognozy) i wykonanego podlewania osobno dla wszystkich sekcji. Utwórz helper Tekst z maksymalną długością 255 znaków. Gdy zapis nie mieściłby się w limicie helpera, podlewanie jest wstrzymane z czytelnym powodem. Bez helpera działa tryb zgodności oparty na historii pracy sekcji, która raportuje tylko Rain Bird RC2; przy sekcjach switch/valve helper jest wymagany."
    en: "Recommended input_text that stores the balance of ET, rain (from the station or the forecast estimate) and applied watering separately for every section. Create a Text helper with a maximum length of 255 characters. If the stored value would not fit the helper limit, watering is held with a readable reason. Without the helper a compatibility mode based on the section run history is used, which only Rain Bird RC2 reports; with switch/valve sections the helper is required."
    de: "Empfohlener input_text, der die Bilanz aus ET, Regen (von der Station oder aus der Vorhersageschätzung) und ausgebrachter Bewässerung für jede Zone getrennt speichert. Lege einen Text-Helfer mit einer maximalen Länge von 255 Zeichen an. Passt der gespeicherte Wert nicht in das Limit des Helfers, wird die Bewässerung mit verständlichem Grund angehalten. Ohne Helfer läuft ein Kompatibilitätsmodus auf Basis der Zonenlaufhistorie, die nur Rain Bird RC2 meldet; bei switch/valve-Zonen ist der Helfer erforderlich."
  - pl: "Kontrola bezpieczeństwa zaworów"
    en: "Valve safety check"
    de: "Ventil-Sicherheitsprüfung"
  - pl: "Wyznacz sekcje switch/valve bez własnego limitu czasu w sterowniku"
