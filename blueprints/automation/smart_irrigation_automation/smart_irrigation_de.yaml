blueprint:
  name: Intelligente Gartenbewässerung - 1 bis 12 Zonen
  description: >
    Version 1.11.0. Universeller Bewässerungs-Blueprint für 1 bis 12 Zonen. Unterstützt
    Rain Bird RC2 sowie gemischte Anlagen mit zusätzlichen Ventilen oder Relais
    von Sonoff, Shelly und ESPHome. Das Wetter stammt aus der Home-Assistant-Vorhersage, eine
    Wetterstation ist optional. Für jede Zone legst du Namen, Zonen-Entität, Bodenart,
    Bepflanzung, Rain-Bird-/Hunter-Regnertyp, Laufzeitkorrektur sowie
    optionale Online-/Batteriesensoren fest. Das Schließen jeder Zone wird bestätigt
    und wiederholt, und offene switch/valve-Zonen werden nach einem HA-Neustart geschlossen.
    Normale Relais sollten zusätzlich mit einem Hardware-Zeitlimit abgesichert werden
    (Shelly "Auto OFF", Sonoff "Inching", ESPHome on_turn_on + delay).
  domain: automation
  author: Smart Service
  homeassistant:
    min_version: 2025.4.0
  source_url: https://github.com/SmartServicePL/smart_irrigation_automation/blob/main/blueprints/automation/smart_irrigation_automation/smart_irrigation_de.yaml
  input:
    weather_section:
      name: Gemeinsame Wetter-Entitäten und Sensoren
      icon: mdi:weather-partly-rainy
      input:
        forecast_weather_entity:
          name: Wetter-Entität für die Vorhersage
          description: Home-Assistant-Wetter-Entität mit Tagesvorhersage (z. B. Met.no, OpenWeatherMap). Sie liefert die Niederschlagsvorhersage, die Regenwahrscheinlichkeit und die Wetterlage, ohne Wetterstation auch die aktuelle Temperatur, den Wind und den UV-Index.
          selector:
            entity:
              filter:
                - domain: weather

    local_weather_overrides_section:
      name: Wetterstation und Sensoren (optional)
      icon: mdi:weather-partly-rainy
      input:
        current_weather_entity:
          name: Lokale Wetter-Entität
          description: Optionale Überschreibung der aktuellen Wetterlage. Leer = Haupt-Vorhersage-Entität verwenden.
          default: ""
          selector:
            entity:
              filter:
                - domain: weather
        rain_binary_sensor:
          name: Regensensor
          description: Optionaler physischer Regensensor. Ist er an, startet die Bewässerung nicht oder wird unterbrochen. Ist er nicht verfügbar, wird die Bewässerung zur Sicherheit angehalten.
          default: ""
          selector:
            entity:
              filter:
                - domain: binary_sensor
        rain_amount_sensor:
          name: Gemessener Niederschlag - am besten die letzten 24 h
          description: Niederschlagssensor in mm. Am besten ist eine gleitende 24-Stunden-Summe oder die Summe des laufenden Regenereignisses; ein nur täglicher Sensor kann Regen nach Mitternacht verpassen. Der Wert wird von der Bilanz abgezogen. Ohne diesen Sensor wird der Niederschlag für die Bilanz aus der Tagesvorhersage der Wetter-Entität geschätzt (einmal pro Tag, in Benachrichtigungen als Schätzung aus der Vorhersage gekennzeichnet). Ist der Sensor vorübergehend nicht verfügbar, behält die Bilanz den gespeicherten Niederschlag.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        temperature_source_entity:
          name: Gartentemperatur
          description: Optionaler Temperatursensor im Garten oder Wetter-Entität. Leer = Haupt-Wetter-Entität verwenden. Niedrige Temperatur sperrt die Bewässerung, Hitze erhöht die Menge. Ist der gewählte Sensor nicht verfügbar, wird die aktuelle Temperatur der Wetter-Entität verwendet; ohne aktuelle Temperatur wird die Bewässerung angehalten. Temperaturen in °F werden automatisch in °C umgerechnet.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        wind_source_entity:
          name: Wind
          description: Optionaler Windsensor oder Wetter-Entität. Leer = Haupt-Wetter-Entität verwenden. Zu starker Wind sperrt die Bewässerung, weil die Regner ungleichmäßig verteilen würden. Ist der gewählte Sensor nicht verfügbar, wird der Wind der Wetter-Entität verwendet; fehlt er auch dort, wird die Bewässerung angehalten.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        sunlight_source_entity:
          name: UV / Sonne
          description: Optionaler UV-/Sonnensensor oder Wetter-Entität mit uv_index. Leer = Haupt-Wetter-Entität verwenden. Wird für die Ersatzschätzung der Evapotranspiration genutzt, wenn ET0 nicht verfügbar ist.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        reference_et_sensor:
          name: Tägliche ET0 / Evapotranspiration
          description: Optionaler Sensor der täglichen Referenz-Evapotranspiration in mm. Leer = ET0 wird aus Temperatur, UV und Wind geschätzt.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        solar_radiation_mean_sensor:
          name: Sonneneinstrahlung - 24-h-Mittel
          description: >-
            Optional. Mittlere Sonneneinstrahlung der letzten 24 Stunden in W/m², berechnet
            aus dem Sensor der Wetterstation. Wenn gewählt, wird ET0 mit der Hargreaves-Methode
            mit Strahlung berechnet, die genauer ist als die Schätzung aus Temperatur, UV und Wind.
            So legst du ihn an - 1) Einstellungen, Geräte & Dienste, Helfer, Helfer erstellen,
            Statistik. 2) Wähle den Sonneneinstrahlungssensor der Station in W/m². 3) Merkmal -
            zeitgewichteter linearer Mittelwert (average_linear), nicht der einfache Mittelwert, weil
            der Sensor nachts selten den Zustand ändert. 4) Maximales Alter 24 Stunden, Stichprobengröße
            leer lassen. 5) Wähle hier den erstellten Sensor. Der Sensor für die tägliche ET0 oben hat
            Vorrang. Ist dieser Sensor nicht verfügbar, wird die Ersatzschätzung verwendet.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        soil_moisture_sensor:
          name: Bodenfeuchte
          description: Optionaler repräsentativer Bodenfeuchtesensor in Prozent. Er sperrt die Bewässerung direkt, sobald die im Abschnitt Wettersperren eingestellte Schwelle erreicht ist.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    general_section:
      name: Allgemeine Einstellungen
      icon: mdi:tune
      input:
        zone_count:
          name: Anzahl der Zonen
          description: Wie viele Zonen diese Automatisierung steuert. Zonen über dieser Anzahl bleiben in der Konfiguration, werden aber ignoriert.
          default: 1
          selector:
            number:
              min: 1
              max: 12
              step: 1
              mode: slider
        send_runtime_to_switch:
          name: Berechnete Laufzeit an den Rain-Bird-Controller senden
          description: Für Rain Bird RC2 verwendet die Automatisierung immer rainbird_rc2.start_zone. Diese Einstellung übergibt die Laufzeit an die ältere Rain-Bird-Integration über rainbird.start_irrigation. Sie ändert nichts an Sonoff, Shelly, ESPHome oder anderen normalen switch/valve-Entitäten.
          default: true
          selector:
            boolean:
        valve_runtime_watchdog:
          name: Laufzeitüberwachung der Zonen
          description: Empfohlen. Schließt eine switch/valve-Zone dieser Automatisierung (außer Rain Bird RC2 und Rain Bird, die ein eigenes Zeitlimit im Controller haben), wenn sie länger als die maximale Zonenlaufzeit + 5 min an ist, egal wer sie eingeschaltet hat. Schützt vor Überschwemmung nach einem unterbrochenen Lauf. Nur deaktivieren, wenn du absichtlich länger als dieses Limit manuell bewässerst.
          default: true
          selector:
            boolean:

    zone_1_section:
      name: Zone 1
      icon: mdi:sprinkler-variant
      input:
        zone_1_valve:
          name: Zone 1 - Entität
          description: "Rain-Bird-RC2-Zonen-Entität oder beliebige valve/switch-Entität, z. B. Sonoff, Shelly oder ESPHome. Die Automatisierung startet die Zone für die berechnete Zeit und stoppt sie danach."
          selector:
            entity:
              filter:
                - domain: valve
                - domain: switch
        zone_1_name:
          name: Zone 1 - Name
          description: Lesbarer Zonenname, der in den Automatisierungs-Traces erscheint und die Bewässerungsfläche erkennbar macht.
          default: Zone 1
          selector:
            text:
        zone_1_soil_type:
          name: Zone 1 - Bodenart
          description: Wähle die passendste Beschreibung des Gartenbodens. Leichte Böden verlieren Wasser schneller, Humus und Schwarzerde speichern es länger.
          default: loam
          selector:
            select:
              mode: dropdown
              options:
                - label: Sandig / sehr leicht
                  value: sand
                - label: Leichter Gartenboden
                  value: sandy_loam
                - label: Normaler Gartenboden
                  value: loam
                - label: Humusreich / kompostreich
                  value: humus
                - label: Schwarzerde / Tschernosem
                  value: chernozem
                - label: Lehmig / schwer
                  value: clay_loam
                - label: Sehr schwer / verdichteter Ton
                  value: clay
        zone_1_plant_type:
          name: Zone 1 - Bepflanzung
          description: Legt den Grundwasserbedarf fest. Gemüse braucht am meisten, Rasen mittel, Sträucher meist weniger.
          default: grass
          selector:
            select:
              mode: dropdown
              options:
                - label: Rasen
                  value: grass
                - label: Blumen
                  value: flowers
                - label: Gemüse
                  value: vegetables
                - label: Sträucher
                  value: shrubs
        zone_1_sprinkler_profile:
          name: Zone 1 - Regner
          description: Das Profil legt die Niederschlagsrate der Anlage in mm/h fest. Je höher die Rate der Regner, desto kürzer die berechnete Laufzeit.
          default: rainbird_rotor
          selector:
            select:
              mode: dropdown
              options:
                - label: Rain Bird 5000/3500 - Getrieberegner
                  value: rainbird_5000_rotor
                - label: Rain Bird 1800 - Sprühregner
                  value: rainbird_1800_spray
                - label: Rain Bird R-VAN - Rotordüsen
                  value: rainbird_rvan
                - label: Rain Bird XF - Tropfrohr
                  value: rainbird_xf_drip
                - label: Rain Bird - Getrieberegner allgemein
                  value: rainbird_rotor
                - label: Rain Bird - Sprühregner allgemein
                  value: rainbird_spray
                - label: Rain Bird - Tropfrohr allgemein
                  value: rainbird_drip
                - label: Hunter - Getrieberegner
                  value: hunter_rotor
                - label: Hunter - MP Rotator
                  value: hunter_mp_rotator
                - label: Hunter - Sprühregner
                  value: hunter_spray
                - label: Hunter - Tropfrohr
                  value: hunter_drip
                - label: Eigene Niederschlagsrate
                  value: custom
        zone_1_custom_rate_mm_h:
          name: Zone 1 - eigene Niederschlagsrate
          description: Nur mit dem Profil "Eigene Niederschlagsrate". Trage die tatsächliche Niederschlagsrate der Zone in mm/h ein, wenn du sie aus einem Bechertest oder der Dokumentation kennst.
          default: 12
          selector:
            number:
              min: 1
              max: 80
              step: 0.5
              unit_of_measurement: mm/h
              mode: box
        zone_1_runtime_adjustment_percent:
          name: Zone 1 - Laufzeitkorrektur
          description: Manuelle Laufzeitkorrektur dieser Zone. 100% = keine Änderung, mehr verlängert die Bewässerung, weniger verkürzt sie. Die Wasserbilanz zieht das tatsächlich ausgebrachte Wasser ab, daher ändert die Korrektur die Menge pro Bewässerung, nicht die Gesamtmenge - kürzere Läufe kommen häufiger, längere seltener.
          default: 100
          selector:
            number:
              min: 50
              max: 180
              step: 5
              unit_of_measurement: "%"
              mode: slider
        zone_1_online_sensor:
          name: Zone 1 - online
          description: Optionaler Online-binary_sensor. Ist er gesetzt und aus, wird die Zone übersprungen.
          default: ""
          selector:
            entity:
              filter:
                - domain: binary_sensor
        zone_1_battery_sensor:
          name: Zone 1 - Batterie
          description: Optionaler Batteriesensor der Zone. Die Zone wird übersprungen, wenn die Batterie unter die Schwelle aus den Wettersperren fällt.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

