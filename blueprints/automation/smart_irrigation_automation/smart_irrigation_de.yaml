    schedule_section:
      name: Zeitplan, Saison und Schwellen
      icon: mdi:calendar-clock
      input:
        schedule_mode:
          name: Bewässerungsstart
          description: Feste Uhrzeit verwendet die Zeiten unten. Der Sonnenmodus startet die Bewässerung relativ zu Sonnenaufgang oder -untergang.
          default: fixed_time
          selector:
            select:
              mode: dropdown
              options:
                - label: Feste Uhrzeit
                  value: fixed_time
                - label: Relativ zum Sonnenaufgang
                  value: sunrise
                - label: Relativ zum Sonnenuntergang
                  value: sunset
        sun_event_offset_minutes:
          name: Versatz zur Sonne
          description: Minuten relativ zu Sonnenaufgang/-untergang. Negativ = vorher, positiv = nachher.
          default: -30
          selector:
            number:
              min: -180
              max: 180
              step: 5
              unit_of_measurement: min
              mode: slider
        primary_start_time:
          name: Hauptbewässerungszeit
          description: Nur im Modus "Feste Uhrzeit".
          default: "04:30:00"
          selector:
            time:
        backup_start_time:
          name: Ersatzstart nach verpasster Hauptzeit
          description: Nur bei fester Uhrzeit, wenn HA den Hauptstart verpasst hat. Benötigt den Helfer für die nächste Bewässerung. Nach einem erfolgreichen Hauptlauf wird keine zweite Entscheidung getroffen.
          default: "05:30:00"
          selector:
            time:
        enable_backup_time:
          name: Ersatzstart aktivieren
          description: Gilt nur für feste Uhrzeit und benötigt den Helfer für die nächste Bewässerung. Verhindert den Verlust eines Zyklus nach einem HA-Neustart, erzeugt aber keine zweite Meldung am selben Tag.
          default: false
          selector:
            boolean:
        enable_condition_checks:
          name: Zusätzliche Neuberechnungen aktivieren
          description: Zu diesen Zeiten ruft die Automatisierung das Wetter ab und berechnet den Bewässerungsbedarf neu, öffnet aber keine Zone. Sie aktualisiert den Helfer für die nächste Bewässerung und optional das Logbuch, ohne HA-Benachrichtigungen.
          default: true
          selector:
            boolean:
        condition_check_time_1:
          name: Prüfung 1
          description: Uhrzeit einer Kontrollberechnung ohne Bewässerungsstart.
          default: "12:00:00"
          selector:
            time:
        condition_check_time_2:
          name: Prüfung 2
          description: Uhrzeit einer Kontrollberechnung ohne Bewässerungsstart.
          default: "18:00:00"
          selector:
            time:
        condition_check_time_3:
          name: Prüfung 3
          description: Uhrzeit einer Kontrollberechnung ohne Bewässerungsstart.
          default: "00:00:00"
          selector:
            time:
        condition_check_time_4:
          name: Prüfung 4
          description: Uhrzeit einer Kontrollberechnung ohne Bewässerungsstart.
          default: "03:00:00"
          selector:
            time:
        season_start_month:
          name: Startmonat der Saison
          description: Erster Monat, in dem die Automatisierung bewässern darf. Außerhalb der Saison werden keine Zonen gestartet.
          default: 4
          selector:
            number:
              min: 1
              max: 12
              step: 1
              mode: slider
        season_end_month:
          name: Endmonat der Saison
          description: Letzter Monat der Bewässerungssaison. Beispiel 4-10 bedeutet Bewässerung von April bis Oktober.
          default: 10
          selector:
            number:
              min: 1
              max: 12
              step: 1
              mode: slider
        min_dose_mm:
          name: Mindestmenge für den Start
          description: Ist die berechnete Menge einer Zone kleiner, wird die Zone übersprungen. Schützt vor sinnlosen, sehr kurzen Zyklen.
          default: 3
          selector:
            number:
              min: 0.5
              max: 15
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        max_dose_mm:
          name: Höchstmenge pro Bewässerung
          description: Obergrenze an Wasser für eine Bewässerung einer Zone. Schützt vor Überwässerung und zu langen Läufen nach mehreren trockenen Tagen.
          default: 10
          selector:
            number:
              min: 3
              max: 30
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        min_runtime_minutes:
          name: Minimale Zonenlaufzeit
          description: Kürzeste Laufzeit einer Zone, wenn die Bewässerung startet. Hilft, Zone und Anlage stabil zu betreiben.
          default: 8
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
              mode: slider
        max_runtime_minutes:
          name: Maximale Zonenlaufzeit
          description: Längste zulässige Laufzeit einer Zone in einem Zyklus. Begrenzt das Risiko zu langer Bewässerung.
          default: 45
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
              mode: slider
        zone_pause_seconds:
          name: Pause zwischen den Zonen
          description: Abstand nach dem Schließen einer Zone vor dem Start der nächsten. Gibt der Anlage Zeit, den Druck zu stabilisieren.
          default: 15
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: s
              mode: slider

    safety_section:
      name: Wettersperren
      icon: mdi:shield-check
      collapsed: true
      input:
        max_forecast_rain_mm:
          name: Vorhergesagter Regen, der die Bewässerung sperrt
          description: Zeigt die Vorhersage mindestens so viele mm Regen, wird die Bewässerung übersprungen.
          default: 4
          selector:
            number:
              min: 0
              max: 30
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        max_rain_probability_percent:
          name: Regenwahrscheinlichkeit, die die Bewässerung sperrt
          description: Die Bewässerung wird gesperrt, wenn die Regenwahrscheinlichkeit diese Schwelle überschreitet und die Vorhersage mindestens 1 mm Niederschlag zeigt.
          default: 80
          selector:
            number:
              min: 30
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        rain_credit_percent:
          name: Anrechenbarer Regenanteil
          description: Prozentsatz des neuen Regens, der als dem Boden zugeführtes Wasser gebucht wird - von der Station gemessen oder, ohne Station, aus der Vorhersage für den vergangenen Tag geschätzt. Die Vorhersage für heute und morgen verschiebt nur den Start. 80% berücksichtigen typische Verluste.
          default: 80
          selector:
            number:
              min: 0
              max: 120
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_temperature_c:
          name: Mindesttemperatur
          description: Unter dieser Temperatur startet die Bewässerung nicht. Schützt Pflanzen und Anlage an kalten Morgen.
          default: 8
          selector:
            number:
              min: -5
              max: 20
              step: 0.5
              unit_of_measurement: C
              mode: slider
        hot_temperature_c:
          name: Hitzetemperatur
          description: Ab dieser Temperatur erhöht die Automatisierung die Wassermenge leicht, weil die Verdunstung höher ist.
          default: 28
          selector:
            number:
              min: 20
              max: 40
              step: 0.5
              unit_of_measurement: C
              mode: slider
        max_wind:
          name: Maximaler Wind
          description: Grenze in km/h. Geschwindigkeiten in m/s, mph oder Knoten werden automatisch umgerechnet. Oberhalb der Grenze wird die Bewässerung übersprungen, damit das Wasser nicht aus den Zonen geweht wird.
          default: 35
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: km/h
              mode: slider
        min_battery_percent:
          name: Minimale Zonenbatterie
          description: Hat eine Zone einen Batteriesensor und liegt die Batterie unter dieser Schwelle, wird die Zone übersprungen.
          default: 20
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        soil_moisture_block_percent:
          name: Bodenfeuchte, die die Bewässerung sperrt
          description: Nur mit gewähltem Bodenfeuchtesensor. Ab dieser Schwelle sperrt der Sensor den Zyklus direkt, wie ein professioneller feuchtebasierter Controller. Stelle die Schwelle passend zur Kalibrierung deines Sensors ein.
          default: 70
          selector:
            number:
              min: 20
              max: 95
              step: 1
              unit_of_measurement: "%"
              mode: slider
        irrigation_efficiency_percent:
          name: Bewässerungseffizienz
          description: Berücksichtigt Anlagenverluste, ungleichmäßige Verteilung und Verdunstung. Ein niedrigerer Wert verlängert die Bewässerung; 70-85% sind üblich.
          default: 75
          selector:
            number:
              min: 40
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

    log_section:
      name: Bewässerungsprotokolle
      icon: mdi:text-box-search
      collapsed: true
      input:
        enable_irrigation_logs:
          name: logbook.log aktivieren
          description: Fügt Einträge zum HA-Logbuch hinzu, und zwar für Zyklusstart, Überspringen mit Grund, Zonenstart/-ende und Unterbrechung durch Regen.
          default: false
          selector:
            boolean:
        create_persistent_notification:
          name: persistent_notification erstellen
          description: Zeigt Benachrichtigungen nur beim Bewässerungsstart, am Ende mit den Zonenzeiten sowie beim Überspringen oder Unterbrechen mit kurzem Grund.
          default: false
          selector:
            boolean:
        next_watering_datetime:
          name: Helfer - nächste Bewässerung
          description: Optionaler input_datetime mit Datum und Uhrzeit. Nach jeder Zyklusprüfung speichert die Automatisierung darin den geschätzten nächsten Bewässerungstermin.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_datetime
        water_balance_helper:
          name: Helfer - dauerhafte Wasserbilanz
          description: Empfohlener input_text, der die Bilanz aus ET, Regen (von der Station oder aus der Vorhersageschätzung) und ausgebrachter Bewässerung für jede Zone getrennt speichert. Lege einen Text-Helfer mit einer maximalen Länge von 255 Zeichen an. Passt der gespeicherte Wert nicht in das Limit des Helfers, wird die Bewässerung mit verständlichem Grund angehalten. Ohne Helfer läuft ein Kompatibilitätsmodus auf Basis der Zonenlaufhistorie, die nur Rain Bird RC2 meldet; bei switch/valve-Zonen ist der Helfer erforderlich.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_text

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  trigger_schedule_mode: !input schedule_mode
  trigger_sun_offset_minutes: !input sun_event_offset_minutes
  trigger_zone_count: !input zone_count
  trigger_max_runtime_minutes: !input max_runtime_minutes
  trigger_valve_watchdog: !input valve_runtime_watchdog
  trigger_valves:
    - !input zone_1_valve
    - !input zone_2_valve
    - !input zone_3_valve
    - !input zone_4_valve
    - !input zone_5_valve
    - !input zone_6_valve
    - !input zone_7_valve
    - !input zone_8_valve
    - !input zone_9_valve
    - !input zone_10_valve
    - !input zone_11_valve
    - !input zone_12_valve

triggers:
  - trigger: time
    id: primary
    at: !input primary_start_time
  - trigger: time
    id: backup
    at: !input backup_start_time
  - trigger: template
    id: sun_check
    value_template: >-
      {% if trigger_schedule_mode in ['sunrise', 'sunset'] %}
        {% set attr = 'next_rising' if trigger_schedule_mode == 'sunrise' else 'next_setting' %}
        {% set next_event = state_attr('sun.sun', attr) %}
        {% set next_ts = as_timestamp(next_event) if next_event is not none else 0 %}
        {% set now_ts = as_timestamp(now()) %}
        {% set offset = (trigger_sun_offset_minutes | int(0)) * 60 %}
        {% set window = 300 %}
        {% set target_next = next_ts + offset %}
        {% set target_previous = next_ts - 86400 + offset %}
        {{ next_ts > 0
           and ((now_ts >= target_next and now_ts < target_next + window)
                or (now_ts >= target_previous and now_ts < target_previous + window)) }}
      {% else %}
        false
      {% endif %}
  - trigger: time
    id: condition_check_1
    at: !input condition_check_time_1
  - trigger: time
    id: condition_check_2
    at: !input condition_check_time_2
  - trigger: time
    id: condition_check_3
    at: !input condition_check_time_3
  - trigger: time
    id: condition_check_4
    at: !input condition_check_time_4
  - trigger: homeassistant
    id: ha_start
    event: start
  - trigger: template
    id: valve_watchdog
    value_template: >-
      {% if trigger_valve_watchdog | bool %}
        {% set controller_timed = integration_entities('rainbird_rc2') + integration_entities('rainbird') %}
        {% set limit = ((trigger_max_runtime_minutes | int(45)) + 5) * 60 %}
        {% set watched = trigger_valves[:(trigger_zone_count | int(1))]
             | select('string') | reject('eq', '') | reject('in', controller_timed) | list %}
        {{ expand(watched)
           | selectattr('state', 'in', ['on', 'open', 'opening'])
           | selectattr('last_changed', 'lt', now() - timedelta(seconds=limit))
           | list | count > 0 }}
      {% else %}
        false
      {% endif %}

