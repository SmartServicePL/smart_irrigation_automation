          {% set raw = state_attr(current_weather_entity, 'precipitation') | float(0) %}
          {% set unit = state_attr(current_weather_entity, 'precipitation_unit') | default('mm', true) | lower %}
          {{ (raw * 25.4) | round(2) if unit in ['in', 'inch', 'inches'] else raw }}
        {% endif %}
      temp_c: >-
        {% set e = temperature_source_entity | default('', true) %}
        {% set fahrenheit = ['°f', 'f'] %}
        {% set w_raw = state_attr(current_weather_entity, 'temperature') | float(none) %}
        {% set w_unit = state_attr(current_weather_entity, 'temperature_unit') | default('°C', true) | lower %}
        {% set weather_now = -99 if w_raw is none else ((w_raw - 32) * 5 / 9) | round(1) if w_unit in fahrenheit else w_raw %}
        {% if e | length == 0 %}
          {{ weather_now }}
        {% else %}
          {% set is_weather = e.split('.')[0] == 'weather' %}
          {% set raw = (state_attr(e, 'temperature') if is_weather else states(e)) | float(none) %}
          {% set unit = (state_attr(e, 'temperature_unit') if is_weather else state_attr(e, 'unit_of_measurement')) | default('°C', true) | lower %}
          {{ weather_now if raw is none else ((raw - 32) * 5 / 9) | round(1) if unit in fahrenheit else raw }}
        {% endif %}
      temp_available: "{{ (temp_c | float(-99)) > -99 }}"
      wind_value: >-
        {% set e = wind_source_entity | default('', true) %}
        {% set w_raw = state_attr(current_weather_entity, 'wind_speed') %}
        {% set w_unit = state_attr(current_weather_entity, 'wind_speed_unit') | default('km/h', true) | lower %}
        {% if w_raw | is_number %}
          {% set raw = w_raw | float(0) %}
          {% set weather_now = (raw * 3.6) | round(2) if w_unit in ['m/s', 'mps'] else (raw * 1.609344) | round(2) if w_unit in ['mph', 'mi/h'] else (raw * 1.852) | round(2) if w_unit in ['kn', 'kt', 'knot', 'knots'] else raw %}
        {% else %}
          {% set weather_now = none %}
        {% endif %}
        {% if e | length == 0 %}
          {{ weather_now if weather_now is not none else 0 }}
        {% elif e.split('.')[0] == 'weather' and state_attr(e, 'wind_speed') | is_number %}
          {% set raw = state_attr(e, 'wind_speed') | float(0) %}
          {% set unit = state_attr(e, 'wind_speed_unit') | default('km/h', true) | lower %}
          {{ (raw * 3.6) | round(2) if unit in ['m/s', 'mps'] else (raw * 1.609344) | round(2) if unit in ['mph', 'mi/h'] else (raw * 1.852) | round(2) if unit in ['kn', 'kt', 'knot', 'knots'] else raw }}
        {% elif e.split('.')[0] != 'weather' and states(e) | is_number %}
          {% set raw = states(e) | float(0) %}
          {% set unit = state_attr(e, 'unit_of_measurement') | default('km/h', true) | lower %}
          {{ (raw * 3.6) | round(2) if unit in ['m/s', 'mps'] else (raw * 1.609344) | round(2) if unit in ['mph', 'mi/h'] else (raw * 1.852) | round(2) if unit in ['kn', 'kt', 'knot', 'knots'] else raw }}
        {% else %}
          {{ weather_now if weather_now is not none else 999 }}
        {% endif %}
      wind_available: "{{ (wind_value | float(999)) < 999 }}"
      sunlight_index: >-
        {% set e = sunlight_source_entity | default('', true) %}
        {% if e | length == 0 %}
          {{ state_attr(current_weather_entity, 'uv_index') | float(5) }}
        {% elif e.split('.')[0] == 'weather' %}
          {{ state_attr(e, 'uv_index') | float(5) }}
        {% else %}
          {{ states(e) | float(5) }}
        {% endif %}
      soil_moisture_percent: >-
        {% set e = soil_moisture_sensor | default('', true) %}
        {% if e | length > 0 and states(e) | is_number %}
          {{ states(e) | float(0) }}
        {% else %}
          -1
        {% endif %}
      soil_moisture_factor: >-
        1
      soil_moisture_ok: >-
        {% set m = soil_moisture_percent | float(-1) %}
        {{ m < 0 or m < (soil_moisture_block_percent | float(70)) }}
      season_ok: >-
        {% set start = season_start_month | int(4) %}
        {% set end = season_end_month | int(10) %}
        {% set month = now().month %}
        {% if start <= end %}
          {{ month >= start and month <= end }}
        {% else %}
          {{ month >= start or month <= end }}
        {% endif %}
      weather_ok: >-
        {{ states(current_weather_entity) not in bad_weather_states
           and forecast_condition not in severe_forecast_states }}
      weather_data_ok: >-
        {{ states(current_weather_entity) | trim not in ['unknown', 'unavailable', 'none', '']
           and forecast_condition | trim not in ['unknown', 'unavailable', 'none', ''] }}
      rain_sensor_ok: >-
        {{ rain_binary_sensor | default('', true) | length == 0
           or is_state(rain_binary_sensor, 'off') }}
      forecast_rain_ok: >-
        {{ (forecast_precipitation | float(0) | round(1)) < (max_forecast_rain_mm | float(4))
           and not ((forecast_precipitation_probability | int(0)) >= (max_rain_probability_percent | int(80))
                     and (forecast_precipitation | float(0)) >= 1) }}
      temp_ok: "{{ (temp_c | float(0)) >= (min_temperature_c | float(8)) }}"
      wind_ok: "{{ (wind_value | float(0)) <= (max_wind | float(35)) }}"
      temp_factor: >-
        {% set t = temp_c | float(0) %}
        {% if t < 12 %}0.6
        {% elif t < 20 %}0.85
        {% elif t < (hot_temperature_c | float(28)) %}1
        {% else %}1.25
        {% endif %}
      sun_factor: >-
        {% set u = sunlight_index | float(5) %}
        {% if u < 2 %}0.9{% elif u <= 7 %}1{% else %}1.1{% endif %}
      solar_radiation_mean_w_m2: >-
        {% set e = solar_radiation_mean_sensor | default('', true) %}
        {% set unit = (state_attr(e, 'unit_of_measurement') | default('W/m²', true) | string | lower | replace(' ', '')) if e | length > 0 else '' %}
        {% if e | length == 0 or not (states(e) | is_number) %}
          -1
        {% elif unit in ['w/m²', 'w/m2'] %}
          {{ states(e) | float(0) }}
        {% elif unit in ['kw/m²', 'kw/m2'] %}
          {{ states(e) | float(0) * 1000 }}
        {% else %}
          -1
        {% endif %}
      reference_et_method: >-
        {% set e = reference_et_sensor | default('', true) %}
        {% if e | length > 0 and states(e) | is_number %}
          ET0-Sensor
        {% elif (solar_radiation_mean_w_m2 | float(-1)) >= 0 %}
          aus Strahlung
        {% else %}
          Ersatzschätzung
        {% endif %}
      reference_et_mm: >-
        {% set e = reference_et_sensor | default('', true) %}
        {% if e | length > 0 and states(e) | is_number %}
          {{ states(e) | float(0) }}
        {% elif (solar_radiation_mean_w_m2 | float(-1)) >= 0 %}
          {% set rs = (solar_radiation_mean_w_m2 | float(0)) * 0.0864 %}
          {% set et0 = 0.0135 * ((temp_c | float(0)) + 17.8) * rs / 2.45 %}
          {{ 0 if et0 < 0 else 10 if et0 > 10 else et0 | round(2) }}
        {% else %}
          {% set t = temp_c | float(0) %}
          {% set u = sunlight_index | float(5) %}
          {% set w = wind_value | float(0) %}
          {% set hot = hot_temperature_c | float(28) %}
          {% set base = 1.2 + ([t - 8, 0] | max) * 0.13 + u * 0.28 + w * 0.015 %}
          {% set adjusted = base * (0.85 if t < 15 else 1.15 if t >= hot else 1) %}
          {{ 0.5 if adjusted < 0.5 else 7.5 if adjusted > 7.5 else adjusted | round(2) }}
        {% endif %}
      weather_source_summary: >-
        {{ state_attr(forecast_weather_entity, 'friendly_name') | default(forecast_weather_entity, true) }}, ET0 {{ reference_et_mm | float(0) | round(2) }} mm/d ({{ reference_et_method | trim }})
      rain_credit_mm: >-
        {% set raw_credit = rain_credit_percent | float(80) / 100 %}
        {% set credit = 0 if raw_credit < 0 else 1 if raw_credit > 1 else raw_credit %}
        {{ ((current_rain_mm | float(0)) * credit) | round(1) }}

  - alias: Dauerhafte Wasserbilanz aktualisieren
    variables:
      water_balance_enabled: >-
        {{ water_balance_helper | default('', true) | length > 0 }}
      water_balance_saved: >-
        {% set raw = states(water_balance_helper) if (water_balance_enabled | bool) else '' %}
        {{ raw if raw.startswith('{') else '{}' }}
      water_balance_saved_valid: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {{ (water_balance_enabled | bool)
           and saved is mapping
           and saved.get('v', 0) | int(0) == 1
           and saved.get('t', 0) | float(0) > 0
           and saved.get('z', []) is list
           and saved.get('z', []) | count >= 12 }}
      water_balance_raw_elapsed_days: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {% set elapsed = (as_timestamp(now()) - (saved.get('t', 0) | float(0))) / 86400 if (water_balance_saved_valid | bool) else 0 %}
        {{ 0 if elapsed < 0 else elapsed | round(5) }}
      water_balance_season_start_ts: >-
        {% set start = season_start_month | int(4) %}
        {% set end = season_end_month | int(10) %}
        {% set n = now() %}
        {% set year = n.year if (start <= end or n.month >= start) else n.year - 1 %}
        {{ as_timestamp(n.replace(year=year, month=start, day=1, hour=0, minute=0, second=0, microsecond=0)) | int }}
      water_balance_new_season: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {{ (water_balance_saved_valid | bool) and (season_ok | bool)
           and (saved.get('t', 0) | float(0)) < (water_balance_season_start_ts | float(0)) }}
      water_balance_elapsed_days: >-
        {% if not (season_ok | bool) %}
          0
        {% else %}
          {% set since_season = (as_timestamp(now()) - (water_balance_season_start_ts | float(0))) / 86400 %}
          {% set elapsed = since_season if (water_balance_new_season | bool) else water_balance_raw_elapsed_days | float(0) %}
          {{ 0 if elapsed < 0 else 7 if elapsed > 7 else elapsed | round(5) }}
        {% endif %}
      water_balance_rain_from_forecast: >-
        {{ (water_balance_enabled | bool) and rain_amount_sensor | default('', true) | length == 0 }}
      water_balance_day: "{{ now().strftime('%j') | int }}"
      water_balance_saved_day: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {{ (saved.get('t', 0) | float(0) | timestamp_custom('%j')) | int if (water_balance_saved_valid | bool) else 0 }}
      water_balance_forecast_today_mm: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {% set fc = daily_forecast.get(forecast_weather_entity, {}).get('forecast', []) %}
        {% set today = now().strftime('%Y-%m-%d') %}
        {% set ns = namespace(value=none) %}
        {% for item in fc %}
          {% if ns.value is none and (as_timestamp(item.get('datetime'), 0) | timestamp_custom('%Y-%m-%d')) == today %}
            {% set ns.value = item.get('precipitation', 0) | float(0) %}
          {% endif %}
        {% endfor %}
        {% set unit = state_attr(forecast_weather_entity, 'precipitation_unit') | default('mm', true) | lower %}
        {% if ns.value is not none %}
          {{ (ns.value * 25.4) | round(1) if unit in ['in', 'inch', 'inches'] else ns.value | round(1) }}
        {% elif (water_balance_saved_valid | bool) and water_balance_saved_day | int(0) == water_balance_day | int(0) %}
          {{ saved.get('p', 0) | float(0) | round(1) }}
        {% else %}
          0
        {% endif %}
      water_balance_rain_source_ok: >-
        {% set e = rain_amount_sensor | default('', true) %}
        {% if e | length > 0 %}
          {{ states(e) | is_number }}
        {% else %}
          {{ water_balance_rain_from_forecast | bool }}
        {% endif %}
      water_balance_rain_total_mm: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {% set previous = saved.get('r', 0) | float(0) if (water_balance_saved_valid | bool) else 0 %}
        {% if (water_balance_rain_source_ok | bool) and not (water_balance_rain_from_forecast | bool) %}
          {{ current_rain_mm | float(0) | round(1) }}
        {% else %}
          {{ previous | round(1) }}
        {% endif %}
      water_balance_rain_increment_mm: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {% if water_balance_rain_from_forecast | bool %}
          {% set stored_day = water_balance_saved_day | int(0) %}
          {{ saved.get('p', 0) | float(0) | round(2) if stored_day > 0 and stored_day != water_balance_day | int(0) else 0 }}
        {% else %}
          {% set current = water_balance_rain_total_mm | float(0) %}
          {% set previous = saved.get('r', current) | float(current) if (water_balance_saved_valid | bool) else current %}
          {% set delta = current - previous %}
          {{ delta | round(2) if delta > 0 and (water_balance_rain_source_ok | bool) else 0 }}
        {% endif %}
      effective_rain_increment_mm: >-
        {% set raw_credit = rain_credit_percent | float(80) / 100 %}
        {% set credit = 0 if raw_credit < 0 else 1 if raw_credit > 1 else raw_credit %}
        {{ ((water_balance_rain_increment_mm | float(0)) * credit) | round(2) }}
      water_balance_deficits_json: |-
        {%- set zones = [
          {'soil': zone_1_soil_type, 'plant': zone_1_plant_type},
          {'soil': zone_2_soil_type, 'plant': zone_2_plant_type},
          {'soil': zone_3_soil_type, 'plant': zone_3_plant_type},
          {'soil': zone_4_soil_type, 'plant': zone_4_plant_type},
          {'soil': zone_5_soil_type, 'plant': zone_5_plant_type},
          {'soil': zone_6_soil_type, 'plant': zone_6_plant_type},
          {'soil': zone_7_soil_type, 'plant': zone_7_plant_type},
          {'soil': zone_8_soil_type, 'plant': zone_8_plant_type},
          {'soil': zone_9_soil_type, 'plant': zone_9_plant_type},
          {'soil': zone_10_soil_type, 'plant': zone_10_plant_type},
          {'soil': zone_11_soil_type, 'plant': zone_11_plant_type},
          {'soil': zone_12_soil_type, 'plant': zone_12_plant_type}
        ] -%}
        {%- set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) -%}
        {%- set previous = saved.get('z', []) if (water_balance_saved_valid | bool) else [] -%}
        {%- set ns = namespace(values=[]) -%}
        {%- for zone in zones -%}
          {%- set soil = zone.soil -%}
          {%- set available = 55 if soil == 'sand' else 115 if soil == 'sandy_loam' else 170 if soil == 'humus' else 180 if soil == 'chernozem' else 155 if soil == 'clay_loam' else 120 if soil == 'clay' else 150 -%}
          {%- set plant = zone.plant -%}
          {%- set kc = 0.8 if plant == 'flowers' else 1.0 if plant == 'vegetables' else 0.55 if plant == 'shrubs' else 0.75 -%}
          {%- set root = 0.25 if plant == 'flowers' else 0.35 if plant == 'vegetables' else 0.5 if plant == 'shrubs' else 0.2 -%}
          {%- set cap = available * root -%}
          {%- set old = previous[loop.index0] | float(0) if previous | count > loop.index0 and not (water_balance_new_season | bool) else 0 -%}
          {%- set raw = old + (reference_et_mm | float(3.5)) * kc * (water_balance_elapsed_days | float(0)) - (effective_rain_increment_mm | float(0)) if (water_balance_saved_valid | bool) and (season_ok | bool) else 0 -%}
          {%- set value = 0 if raw < 0 else cap if raw > cap else raw -%}
          {%- set ns.values = ns.values + [value | round(1)] -%}
        {%- endfor -%}
        {{ ns.values | to_json }}
      water_balance_deficits: >-
        {{ water_balance_deficits_json if water_balance_deficits_json is list else water_balance_deficits_json | from_json([]) }}
      water_balance_payload: >-
        {"v":1,"t":{{ as_timestamp(now()) | int }},{% if water_balance_rain_from_forecast | bool %}"p":{{ water_balance_forecast_today_mm | float(0) | round(1) }}{% else %}"r":{{ water_balance_rain_total_mm | float(0) | round(1) }}{% endif %},"z":{{ water_balance_deficits_json }}{{ "}" }}
      water_balance_payload_length: "{{ water_balance_payload | string | trim | length }}"
      water_balance_helper_max: >-
        {{ state_attr(water_balance_helper, 'max') | int(0) if (water_balance_enabled | bool) else 0 }}
      water_balance_helper_ok: >-
        {{ not (water_balance_enabled | bool)
           or (states[water_balance_helper] is not none
               and states(water_balance_helper) != 'unavailable'
               and (water_balance_payload_length | int(0)) <= (water_balance_helper_max | int(0))) }}

  - alias: Dauerhafte Bilanz im Helfer speichern
    choose:
      - conditions:
          - condition: template
            value_template: "{{ (water_balance_enabled | bool) and (water_balance_helper_ok | bool) }}"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: "{{ water_balance_helper }}"
            data:
              value: "{{ water_balance_payload | trim }}"

  - alias: Lücke in der Bilanzaktualisierung protokollieren
    if:
      - condition: template
        value_template: >-
          {{ (enable_irrigation_logs | bool) and (water_balance_enabled | bool)
             and (season_ok | bool)
             and ((water_balance_new_season | bool) or (water_balance_raw_elapsed_days | float(0)) > 7) }}
    then:
      - action: logbook.log
        data:
          name: Intelligente Bewässerung
          message: >-
            {% if water_balance_new_season | bool %}
              Neue Bewässerungssaison: Die Wasserbilanz beginnt zu Saisonbeginn bei null (Monat {{ season_start_month }}).
            {% else %}
              Die Wasserbilanz wurde {{ water_balance_raw_elapsed_days | float(0) | round(1) }} Tage lang nicht aktualisiert
              (Automatisierung deaktiviert oder Home Assistant lief nicht). Die Evapotranspiration wurde nur für 7 Tage angerechnet.
            {% endif %}

  - alias: Niederschlagsbeschreibung und Warnung zur Niederschlagsquelle berechnen
    variables:
      rain_measurement_warning: >-
        {% if rain_amount_sensor | default('', true) | length > 0 and (water_balance_enabled | bool)
              and not (water_balance_rain_source_ok | bool) %}
          Die Niederschlagsquelle ist derzeit nicht verfügbar - die Bilanz hat den bisherigen Niederschlag behalten und keinen neuen Regen abgezogen.
        {% endif %}
      rain_summary_line: >-
        {% if (water_balance_rain_from_forecast | bool) %}
          Niederschlag für die Bilanz: Schätzung aus der Vorhersage (heute {{ water_balance_forecast_today_mm | float(0) | round(1) }} mm, einmal pro Tag angerechnet)
        {% else %}
          Gemessener Niederschlag: {{ current_rain_mm | float(0) | round(1) }} mm
        {% endif %}

  - alias: Entscheidung für den gesamten Bewässerungszyklus treffen
    variables:
      irrigation_cycle_needed: |-
        {%- set zones = [
          {'number': 1, 'valve': zone_1_valve, 'name': zone_1_name, 'soil_type': zone_1_soil_type, 'plant_type': zone_1_plant_type, 'profile': zone_1_sprinkler_profile, 'custom_rate': zone_1_custom_rate_mm_h},
          {'number': 2, 'valve': zone_2_valve, 'name': zone_2_name, 'soil_type': zone_2_soil_type, 'plant_type': zone_2_plant_type, 'profile': zone_2_sprinkler_profile, 'custom_rate': zone_2_custom_rate_mm_h},
          {'number': 3, 'valve': zone_3_valve, 'name': zone_3_name, 'soil_type': zone_3_soil_type, 'plant_type': zone_3_plant_type, 'profile': zone_3_sprinkler_profile, 'custom_rate': zone_3_custom_rate_mm_h},
          {'number': 4, 'valve': zone_4_valve, 'name': zone_4_name, 'soil_type': zone_4_soil_type, 'plant_type': zone_4_plant_type, 'profile': zone_4_sprinkler_profile, 'custom_rate': zone_4_custom_rate_mm_h},
          {'number': 5, 'valve': zone_5_valve, 'name': zone_5_name, 'soil_type': zone_5_soil_type, 'plant_type': zone_5_plant_type, 'profile': zone_5_sprinkler_profile, 'custom_rate': zone_5_custom_rate_mm_h},
          {'number': 6, 'valve': zone_6_valve, 'name': zone_6_name, 'soil_type': zone_6_soil_type, 'plant_type': zone_6_plant_type, 'profile': zone_6_sprinkler_profile, 'custom_rate': zone_6_custom_rate_mm_h},
