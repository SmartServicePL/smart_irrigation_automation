          {%- set candidate = as_timestamp(now()) -%}
        {%- else -%}
          {%- set candidate = as_timestamp(now()) + (ns.days | float(1)) * 86400 -%}
        {%- endif -%}
        {%- if schedule_mode == 'fixed_time' -%}
          {%- set scheduled = as_timestamp(today_at(primary_start_time)) -%}
        {%- else -%}
          {%- set attr = 'next_rising' if schedule_mode == 'sunrise' else 'next_setting' -%}
          {%- set scheduled = as_timestamp(state_attr('sun.sun', attr), as_timestamp(now())) + (sun_event_offset_minutes | int(0)) * 60 -%}
        {%- endif -%}
        {%- set ns_day = namespace(offset=0) -%}
        {%- if scheduled <= as_timestamp(now()) -%}
          {%- set ns_day.offset = 1 -%}
          {%- set scheduled = scheduled + 86400 -%}
        {%- endif -%}
        {%- if scheduled < candidate -%}
          {%- set add_days = ((candidate - scheduled) / 86400) | round(0, 'ceil') | int -%}
          {%- set ns_day.offset = ns_day.offset + add_days -%}
          {%- set scheduled = scheduled + add_days * 86400 -%}
        {%- endif -%}
        {%- if schedule_mode == 'fixed_time' -%}
          {%- set scheduled = as_timestamp(today_at(primary_start_time) + timedelta(days=ns_day.offset)) -%}
        {%- endif -%}
        {{ scheduled | int }}

  - alias: Grund für das Überspringen der Bewässerung ermitteln
    variables:
      zones_non_rc2: >-
        {{ [zone_1_valve, zone_2_valve, zone_3_valve, zone_4_valve, zone_5_valve, zone_6_valve,
            zone_7_valve, zone_8_valve, zone_9_valve, zone_10_valve, zone_11_valve, zone_12_valve][:(zone_count | int(1))]
           | select('string') | reject('eq', '') | reject('in', integration_entities('rainbird_rc2')) | list }}
      rain_sensor_unavailable: >-
        {{ rain_binary_sensor | default('', true) | length > 0
           and states(rain_binary_sensor) in ['unknown', 'unavailable'] }}
      irrigation_config_block_reason: >-
        {% if not (season_ok | bool) %}
          Außerhalb der Bewässerungssaison. Die aktive Saison umfasst die Monate {{ season_start_month }}-{{ season_end_month }}.
        {% elif (min_dose_mm | float(3)) > (max_dose_mm | float(10)) %}
          Die Mindestmenge für den Start ({{ min_dose_mm }} mm) ist größer als die Höchstmenge pro Bewässerung ({{ max_dose_mm }} mm). Korrigiere die Schwellen unter "Zeitplan, Saison und Schwellen".
        {% elif (water_balance_enabled | bool) and (states[water_balance_helper] is none or states(water_balance_helper) == 'unavailable') %}
          Der Wasserbilanz-Helfer {{ water_balance_helper }} existiert nicht oder ist nicht verfügbar. Lege einen Text-Helfer mit einer maximalen Länge von 255 Zeichen an oder wähle einen vorhandenen.
        {% elif (water_balance_enabled | bool) and not (water_balance_helper_ok | bool) %}
          Der Wasserbilanz-Helfer {{ water_balance_helper }} hat ein Limit von {{ water_balance_helper_max }} Zeichen, die Bilanz benötigt aber {{ water_balance_payload_length }}. Setze die maximale Länge des Helfers auf 255 Zeichen.
        {% elif not (water_balance_enabled | bool) and zones_non_rc2 | count > 0 %}
          Wähle "Helfer - dauerhafte Wasserbilanz". Die Zonen {{ zones_non_rc2 | join(', ') }} melden keine Laufhistorie, daher lässt sich ihr Wasserbedarf ohne den Helfer nicht berechnen.
        {% elif not (daily_forecast_available | bool) %}
          Die Entität {{ forecast_weather_entity }} hat keine Tagesvorhersage geliefert (weather.get_forecasts, type daily). Wähle eine Wetter-Entität mit Tagesvorhersage.
        {% elif not (weather_data_ok | bool) %}
          Keine verlässlichen Wetterdaten. Aktuelle Lage: {{ current_weather_condition_pl }}, Vorhersage: {{ forecast_condition_pl }}.
        {% endif %}
      irrigation_weather_block_reason: >-
        {% if not (weather_ok | bool) %}
          Das Wetter sperrt die Bewässerung. Aktuelle Lage: {{ current_weather_condition_pl }}, Vorhersage: {{ forecast_condition_pl }}.
        {% elif rain_sensor_unavailable | bool %}
          Der Regensensor {{ rain_binary_sensor }} ist nicht verfügbar (Zustand {{ states(rain_binary_sensor) }}), die Bewässerung wird zur Sicherheit angehalten. Prüfe den Sensor oder entferne ihn aus der Konfiguration.
        {% elif not (rain_sensor_ok | bool) %}
          Der Regensensor ist aktiv: {{ rain_binary_sensor }} hat den Zustand {{ states(rain_binary_sensor) }}.
        {% elif not (soil_moisture_ok | bool) %}
          Der Boden ist feucht genug: {{ soil_moisture_percent | float(0) | round(1) }}%, Sperrschwelle {{ soil_moisture_block_percent | float(70) | round(0) }}%.
        {% elif not (forecast_rain_ok | bool) %}
          Die Regenvorhersage ({{ forecast_window_label }}) sperrt die Bewässerung: {{ forecast_precipitation | float(0) }} mm und {{ forecast_precipitation_probability | int(0) }}% Wahrscheinlichkeit.
        {% elif not (temp_available | bool) %}
          Keine aktuelle Temperatur: {{ temperature_source_entity if temperature_source_entity | default('', true) | length > 0 else current_weather_entity }} liefert keinen Wert und die Entität {{ current_weather_entity }} hat kein Attribut temperature. Die Bewässerung wird zum Frostschutz angehalten.
        {% elif not (temp_ok | bool) %}
          Die Temperatur ist zu niedrig: {{ temp_c | float(0) | round(1) }} C, das Minimum ist {{ min_temperature_c }} C.
        {% elif not (wind_available | bool) %}
          Keine Windmessung: {{ wind_source_entity }} liefert keinen Wert und die Entität {{ current_weather_entity }} hat kein Attribut wind_speed. Die Bewässerung wird angehalten.
        {% elif not (wind_ok | bool) %}
          Der Wind ist zu stark: {{ wind_value | float(0) | round(1) }}, die Grenze ist {{ max_wind }}.
        {% endif %}
      irrigation_skip_reason: >-
        {% if irrigation_config_block_reason | trim | length > 0 %}
          {{ irrigation_config_block_reason | trim }}
        {% elif (irrigation_cycle_needed | bool) %}
          {{ irrigation_weather_block_reason | trim }}
        {% endif %}
      next_watering_blocked_timestamp: >-
        {% set estimate = next_watering_estimated_timestamp | int(0) %}
        {% set check = next_schedule_timestamp | int(0) %}
        {{ estimate if estimate > check else check }}

  - alias: Nächsten Prüftermin bei Sperre speichern
    choose:
      - conditions:
          - condition: template
            value_template: "{{ irrigation_skip_reason | trim | length > 0 and next_watering_datetime | default('', true) | length > 0 }}"
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ next_watering_datetime }}"
            data:
              timestamp: "{{ next_watering_blocked_timestamp | int }}"

  - alias: Übersprungene Bewässerung protokollieren
    choose:
      - conditions:
          - condition: template
            value_template: "{{ irrigation_skip_reason | trim | length > 0 and not (trigger_is_condition_check | bool) and (enable_irrigation_logs | bool) }}"
        sequence:
          - action: logbook.log
            data:
              name: Intelligente Bewässerung
              message: "Bewässerung übersprungen. {{ irrigation_skip_reason | trim }}"

  - alias: Über die übersprungene Bewässerung benachrichtigen
    choose:
      - conditions:
          - condition: template
            value_template: "{{ irrigation_skip_reason | trim | length > 0 and not (trigger_is_condition_check | bool) and (create_persistent_notification | bool) }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: Intelligente Bewässerung
              message: |-
                **Status:** Bewässerung übersprungen

                **Grund**
                {{ irrigation_skip_reason | trim }}

                **Wetter**
                - Quelle: {{ weather_source_summary | trim }}
                - Aktuell: {{ current_weather_condition_pl }}
                - Vorhersage: {{ forecast_condition_pl }}
                - {{ rain_summary_line | trim }}
                {% if rain_measurement_warning | trim | length > 0 %}- Hinweis: {{ rain_measurement_warning | trim }}{% endif %}
                - Niederschlag ({{ forecast_window_label }}): {{ forecast_precipitation | float(0) | round(1) }} mm
                - Regenwahrscheinlichkeit: {{ forecast_precipitation_probability | int(0) }}%
                - Temperatur: {{ temp_c | float(0) | round(1) }} C
                - Wind: {{ wind_value | float(0) | round(1) }}

                **Nächster Termin**
                {{ (next_watering_blocked_timestamp | int) | timestamp_custom('%Y-%m-%d %H:%M', true) }}
              notification_id: smart_irrigation_last_event

  - alias: Anhalten, wenn die Bewässerung übersprungen wird
    choose:
      - conditions:
          - condition: template
            value_template: "{{ irrigation_skip_reason | trim | length > 0 }}"
        sequence:
          - stop: "Bewässerung übersprungen: {{ irrigation_skip_reason | trim }}"

  - alias: Helfer für die nächste Bewässerung speichern
    choose:
      - conditions:
          - condition: template
            value_template: "{{ next_watering_datetime | default('', true) | length > 0 }}"
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ next_watering_datetime }}"
            data:
              timestamp: "{{ next_watering_estimated_timestamp | int }}"

  - alias: Kontrollberechnung protokollieren
    choose:
      - conditions:
          - condition: template
            value_template: "{{ (trigger_is_condition_check | bool) and (enable_irrigation_logs | bool) }}"
        sequence:
          - action: logbook.log
            data:
              name: Intelligente Bewässerung
              message: >-
                {% set reason = irrigation_cycle_decision_reason | trim | replace('. Alle aktivierten und bereiten Zonen werden bewässert.', '') %}
                Kontrolle der Bedingungen.
                {% if irrigation_cycle_needed | bool %}
                  Bewässerung ist nötig. {{ reason }}. Es wurde keine Zone gestartet, weil dies nur eine Kontrolle ist.
                {% else %}
                  Bewässerung ist noch nicht nötig. {{ reason }}
                {% endif %}
                Nächster voraussichtlicher Termin: {{ (next_watering_estimated_timestamp | int) | timestamp_custom('%Y-%m-%d %H:%M', true) }}.

  - alias: Nach der Kontrollberechnung anhalten
    choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger_is_condition_check | bool }}"
        sequence:
          - stop: "Kontrollberechnung ohne Start von Zonen."

  - alias: Übersprungenen Zyklus ohne Bewässerungsbedarf protokollieren
    choose:
      - conditions:
          - condition: template
            value_template: "{{ not (irrigation_cycle_needed | bool) and (enable_irrigation_logs | bool) }}"
        sequence:
          - action: logbook.log
            data:
              name: Intelligente Bewässerung
              message: "Bewässerung übersprungen. {{ irrigation_cycle_decision_reason | trim }}"

  - alias: Über einen übersprungenen Zyklus ohne Bewässerungsbedarf benachrichtigen
    choose:
      - conditions:
          - condition: template
            value_template: "{{ not (irrigation_cycle_needed | bool) and (create_persistent_notification | bool) }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: Intelligente Bewässerung
              message: |-
                **Status:** Bewässerung übersprungen

                **Grund**
                {{ irrigation_cycle_decision_reason | trim }}

                **Wetter**
                - Quelle: {{ weather_source_summary | trim }}
                - Aktuell: {{ current_weather_condition_pl }}
                - Vorhersage: {{ forecast_condition_pl }}
                - {{ rain_summary_line | trim }}
                {% if rain_measurement_warning | trim | length > 0 %}- Hinweis: {{ rain_measurement_warning | trim }}{% endif %}
                - Niederschlag ({{ forecast_window_label }}): {{ forecast_precipitation | float(0) | round(1) }} mm
                - Regenwahrscheinlichkeit: {{ forecast_precipitation_probability | int(0) }}%
                - Temperatur: {{ temp_c | float(0) | round(1) }} C
                - Wind: {{ wind_value | float(0) | round(1) }}

                **Nächster Termin**
                {{ (next_watering_estimated_timestamp | int) | timestamp_custom('%Y-%m-%d %H:%M', true) }}
              notification_id: smart_irrigation_last_event

  - alias: Anhalten, wenn kein Bewässerungszyklus nötig ist
    choose:
      - conditions:
          - condition: template
            value_template: "{{ not (irrigation_cycle_needed | bool) }}"
        sequence:
          - stop: "Bewässerung übersprungen: {{ irrigation_cycle_decision_reason | trim }}"

  - alias: Bewässerungsstart protokollieren
    choose:
      - conditions:
          - condition: template
            value_template: "{{ enable_irrigation_logs | bool }}"
        sequence:
          - action: logbook.log
            data:
              name: Intelligente Bewässerung
              message: >-
                Bewässerungszyklus für die aktivierten Zonen geplant. {{ irrigation_cycle_decision_reason | trim }}
                Größte Menge des Zyklus {{ irrigation_cycle_depth_mm | float(0) | round(1) }} mm.
                Wetterquelle: {{ weather_source_summary | trim }}.
                {{ rain_measurement_warning | trim }}
                Niederschlagsvorhersage ({{ forecast_window_label }}) {{ forecast_precipitation | float(0) | round(1) }} mm,
                Regenwahrscheinlichkeit {{ forecast_precipitation_probability | int(0) }}%,
                Temperatur {{ temp_c | float(0) | round(1) }} C,
                wiatr {{ wind_value | float(0) | round(1) }}.

  - alias: Zyklusbeginn merken
    variables:
      irrigation_cycle_started_at: "{{ now().isoformat() }}"
      start_notification_sent: false
      watered_sections: []
      cycle_aborted: false
      cycle_abort_section: 0
      cycle_abort_note: ""

  - alias: Aktive Zonen bewässern
    repeat:
      for_each:
