    {% elif trigger_id == 'sun_check' and schedule_mode in ['sunrise', 'sunset'] %}
      true
    {% else %}
      false
    {% endif %}
  schedule_trigger_ok: >-
    {{ (irrigation_start_trigger_ok | bool)
       or ((trigger_is_condition_check | bool) and (enable_condition_checks | bool)) }}

actions:
  - alias: Ventil-Sicherheitsprüfung
    if:
      - condition: template
        value_template: "{{ trigger_id in safety_trigger_ids }}"
    then:
      - alias: switch/valve-Zonen ohne Zeitlimit im Controller ermitteln
        variables:
          safety_sections: >-
            {% set controller_timed = integration_entities('rainbird_rc2') + integration_entities('rainbird') %}
            {{ [zone_1_valve, zone_2_valve, zone_3_valve, zone_4_valve, zone_5_valve, zone_6_valve,
                zone_7_valve, zone_8_valve, zone_9_valve, zone_10_valve, zone_11_valve, zone_12_valve][:(zone_count | int(1))]
               | select('string') | reject('eq', '') | reject('in', controller_timed) | list }}
      - alias: Nach dem HA-Start warten, bis die Zonen verfügbar sind
        if:
          - condition: template
            value_template: "{{ trigger_id == 'ha_start' and safety_sections | count > 0 }}"
        then:
          - wait_template: "{{ safety_sections | select('is_state', 'unavailable') | list | count == 0 }}"
            timeout: "00:03:00"
            continue_on_timeout: true
      - alias: Zu schließende Zonen auswählen
        variables:
          safety_watchdog_limit_minutes: "{{ (max_runtime_minutes | int(45)) + 5 }}"
          safety_close_now: >-
            {% if trigger_id == 'valve_watchdog' %}
              {{ expand(safety_sections)
                 | selectattr('state', 'in', valve_active_states)
                 | selectattr('last_changed', 'lt', now() - timedelta(minutes=safety_watchdog_limit_minutes | int(50)))
                 | map(attribute='entity_id') | list }}
            {% else %}
              {{ expand(safety_sections) | selectattr('state', 'in', valve_active_states) | map(attribute='entity_id') | list }}
            {% endif %}
          safety_unknown: >-
            {% if trigger_id == 'ha_start' %}
              {{ safety_sections | select('is_state', 'unknown') | list }}
            {% else %}
              []
            {% endif %}
          safety_unavailable: "{{ safety_sections | select('is_state', 'unavailable') | list }}"
      - alias: Zonen schließen und Schließen bestätigen
        if:
          - condition: template
            value_template: "{{ (safety_close_now | count) + (safety_unknown | count) > 0 }}"
        then:
          - repeat:
              sequence:
                - variables:
                    safety_targets: >-
                      {{ (safety_close_now | reject('is_state', valve_closed_states) | list)
                         + (safety_unknown if repeat.index == 1 else []) }}
                - if:
                    - condition: template
                      value_template: "{{ safety_targets | select('match', 'switch\\.') | list | count > 0 }}"
                  then:
                    - action: switch.turn_off
                      continue_on_error: true
                      target:
                        entity_id: "{{ safety_targets | select('match', 'switch\\.') | list }}"
                - if:
                    - condition: template
                      value_template: "{{ safety_targets | select('match', 'valve\\.') | list | count > 0 }}"
                  then:
                    - action: valve.close_valve
                      continue_on_error: true
                      target:
                        entity_id: "{{ safety_targets | select('match', 'valve\\.') | list }}"
                - wait_template: >-
                    {{ safety_close_now | reject('is_state', valve_closed_states) | list | count == 0 }}
                  timeout: "00:00:30"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: >-
                    {{ safety_close_now | reject('is_state', valve_closed_states) | list | count == 0
                       or repeat.index >= 3 }}
          - variables:
              safety_not_closed: "{{ safety_close_now | reject('is_state', valve_closed_states) | list }}"
              safety_closed: "{{ safety_close_now | select('is_state', valve_closed_states) | list }}"
              safety_event_text: >-
                {% if trigger_id == 'ha_start' %}
                  Nach dem Start von Home Assistant
                {% else %}
                  Laufzeitüberwachung: Die Zone war länger als {{ safety_watchdog_limit_minutes }} min an (maximale Zonenlaufzeit + 5 min), daher
                {% endif %}
          - alias: Über geschlossene Zonen benachrichtigen
            if:
              - condition: template
                value_template: "{{ (safety_closed | count) + (safety_not_closed | count) > 0 }}"
            then:
              - action: persistent_notification.create
                data:
                  title: >-
                    {{ 'Intelligente Bewässerung - ALARM' if safety_not_closed | count > 0 else 'Intelligente Bewässerung - Zonen geschlossen' }}
                  message: |-
                    {%- if safety_not_closed | count > 0 %}
                    **Status:** Zonen haben das Schließen nicht bestätigt

                    {{ safety_event_text | trim }} hat die Automatisierung dreimal versucht, die offenen Zonen zu schließen, aber keine Bestätigung erhalten.

                    **Manuell prüfen**
                    {%- for e in safety_not_closed %}
                    - {{ e }}: Zustand {{ states(e) }}
                    {%- endfor %}
                    {%- else %}
                    **Status:** offene Zonen geschlossen

                    {{ safety_event_text | trim }} hat die Automatisierung die offen gebliebenen Zonen geschlossen.
                    {%- endif %}
                    {%- if safety_closed | count > 0 %}

                    **Geschlossen**
                    {%- for e in safety_closed %}
                    - {{ e }}
                    {%- endfor %}
                    {%- endif %}
                    {%- if safety_unavailable | count > 0 %}

                    **Nicht verfügbar - keine Prüfung möglich**
                    {%- for e in safety_unavailable %}
                    - {{ e }}
                    {%- endfor %}
                    {%- endif %}

                    Wurde ein laufender Zyklus unterbrochen, wurde die Wasserbilanz dieser Zone nicht verringert; die Bewässerung folgt mit dem nächsten geplanten Zyklus.
                  notification_id: smart_irrigation_valve_alarm
          - alias: Ventilprüfung protokollieren
            if:
              - condition: template
                value_template: "{{ enable_irrigation_logs | bool }}"
            then:
              - action: logbook.log
                data:
                  name: Intelligente Bewässerung
                  message: >-
                    Ventilprüfung ({{ trigger_id }}).
                    Geschlossen: {{ safety_closed | join(', ') if safety_closed | count > 0 else 'keine Zone' }}.
                    Ohne Schließbestätigung: {{ safety_not_closed | join(', ') if safety_not_closed | count > 0 else 'keine Zone' }}.
                    OFF an Zonen im Zustand unknown gesendet: {{ safety_unknown | join(', ') if safety_unknown | count > 0 else 'keine Zone' }}.
                    Nicht verfügbar: {{ safety_unavailable | join(', ') if safety_unavailable | count > 0 else 'keine Zone' }}.
      - stop: "Ventil-Sicherheitsprüfung abgeschlossen."

  - alias: Startzeitplan passt
    condition: template
    value_template: "{{ schedule_trigger_ok | bool }}"

  - alias: Tagesvorhersage abrufen
    action: weather.get_forecasts
    continue_on_error: true
    target:
      entity_id: !input forecast_weather_entity
    data:
      type: daily
    response_variable: daily_forecast

  - alias: Fehlende Vorhersageantwort absichern
    variables:
      daily_forecast: "{{ daily_forecast if daily_forecast is defined and daily_forecast is mapping else {} }}"
      daily_forecast_available: >-
        {% set fc = daily_forecast if daily_forecast is defined and daily_forecast is mapping else {} %}
        {{ fc.get(forecast_weather_entity, {}).get('forecast', []) | count > 0 }}

  - alias: Wetter und gemeinsame Bedingungen berechnen
    variables:
      forecast_condition: >-
        {% set fc = daily_forecast.get(forecast_weather_entity, {}).get('forecast', []) %}
        {{ fc[0].condition | default(states(forecast_weather_entity), true) if fc | count > 0 else states(forecast_weather_entity) }}
      current_weather_condition_pl: >-
        {% set condition = states(current_weather_entity) | trim %}
        {% set names = {
          'clear-night': 'klare Nacht',
          'cloudy': 'bewölkt',
          'exceptional': 'außergewöhnliche Bedingungen',
          'fog': 'Nebel',
          'hail': 'Hagel',
          'lightning': 'Gewitter',
          'lightning-rainy': 'Gewitter mit Regen',
          'partlycloudy': 'teilweise bewölkt',
          'pouring': 'Starkregen',
          'rainy': 'Regen',
          'snowy': 'Schnee',
          'snowy-rainy': 'Schneeregen',
          'sunny': 'sonnig',
          'windy': 'windig',
          'windy-variant': 'windig und bewölkt',
          'unknown': 'unbekannt',
          'unavailable': 'nicht verfügbar'
        } %}
        {{ names.get(condition, condition) }}
      forecast_condition_pl: >-
        {% set condition = forecast_condition | trim %}
        {% set names = {
          'clear-night': 'klare Nacht',
          'cloudy': 'bewölkt',
          'exceptional': 'außergewöhnliche Bedingungen',
