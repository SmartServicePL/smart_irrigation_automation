        ] -%}
        {%- set ns = namespace(days=999, has_zone=false) -%}
        {%- for zone in zones if (zone.number | int) <= (zone_count | int(1)) and (zone.valve | default('', true) | length > 0) -%}
          {%- set soil = zone.soil_type -%}
          {%- set available_water_mm_m = 55 if soil == 'sand' else 115 if soil == 'sandy_loam' else 170 if soil == 'humus' else 180 if soil == 'chernozem' else 155 if soil == 'clay_loam' else 120 if soil == 'clay' else 150 -%}
          {%- set plant = zone.plant_type -%}
          {%- set crop_coefficient = 0.8 if plant == 'flowers' else 1.0 if plant == 'vegetables' else 0.55 if plant == 'shrubs' else 0.75 -%}
          {%- set root_depth_m = 0.25 if plant == 'flowers' else 0.35 if plant == 'vegetables' else 0.5 if plant == 'shrubs' else 0.2 -%}
          {%- set allowed_depletion = 0.4 if plant == 'flowers' else 0.35 if plant == 'vegetables' else 0.55 if plant == 'shrubs' else 0.45 -%}
          {%- set last_ts = as_timestamp(state_attr(zone.valve, 'last_run_completed') | default('', true), 0) -%}
          {%- set elapsed_days = ((as_timestamp(now()) - last_ts) / 86400) if last_ts > 0 else 0 -%}
          {%- set daily_gain = (reference_et_mm | float(3.5)) * crop_coefficient * (soil_moisture_factor | float(1)) -%}
          {%- set target_raw = available_water_mm_m * root_depth_m * allowed_depletion -%}
          {%- set target = (min_dose_mm | float(3)) if target_raw < (min_dose_mm | float(3)) else target_raw -%}
          {%- set profile = zone.profile -%}
          {%- set rate = 12 if profile in ['rainbird_rotor', 'rainbird_5000_rotor'] else 38 if profile in ['rainbird_spray', 'rainbird_1800_spray'] else 15 if profile == 'rainbird_rvan' else 8 if profile in ['rainbird_drip', 'rainbird_xf_drip'] else 11 if profile == 'hunter_rotor' else 10 if profile == 'hunter_mp_rotator' else 40 if profile == 'hunter_spray' else 8 if profile == 'hunter_drip' else (zone.custom_rate | float(12)) -%}
          {%- set effective_rate = rate * (irrigation_efficiency_percent | float(75)) / 100 -%}
          {%- set last_duration = state_attr(zone.valve, 'last_duration_minutes') -%}
          {%- set delivered = (last_duration | float(0)) * effective_rate / 60 if last_ts > 0 and last_duration | is_number else target -%}
          {%- set carryover = target - delivered if last_ts > 0 and delivered < target else 0 -%}
          {%- set fallback_raw = carryover + daily_gain * elapsed_days - (rain_credit_mm | float(0)) -%}
          {%- set fallback_deficit = 0 if fallback_raw < 0 else fallback_raw -%}
          {%- set deficit = (water_balance_deficits[zone.number - 1] | float(0)) if (water_balance_enabled | bool) else fallback_deficit -%}
          {%- if daily_gain > 0 -%}
            {%- set missing = target - deficit -%}
            {%- set days_until = 0 if missing <= 0 else missing / daily_gain -%}
            {%- if days_until < ns.days -%}
              {%- set ns.days = days_until -%}
            {%- endif -%}
            {%- set ns.has_zone = true -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if not ns.has_zone -%}
          {%- set candidate = next_schedule_timestamp | float(as_timestamp(now()) + 86400) -%}
        {%- elif (irrigation_cycle_needed | bool) and not (irrigation_start_trigger_ok | bool) -%}
          {%- set candidate = next_schedule_timestamp | float(as_timestamp(now()) + 86400) -%}
        {%- elif irrigation_cycle_needed | bool -%}
          {%- set candidate = as_timestamp(now()) -%}
        {%- else -%}
          {%- set candidate = as_timestamp(now()) + (ns.days | float(1)) * 86400 -%}
        {%- endif -%}
        {%- if schedule_mode == 'fixed_time' -%}
          {%- set scheduled = as_timestamp(today_at(primary_start_time)) -%}
        {%- else -%}
          {%- set attr = 'next_rising' if schedule_mode == 'sunrise' else 'next_setting' -%}
          {%- set scheduled = as_timestamp(state_attr('sun.sun', attr), as_timestamp(now())) + (sun_event_offset_minutes | int(0)) * 60 -%}
        {%- endif -%}
        {%- set ns_day = namespace(offset=0) -%}
        {%- if scheduled <= as_timestamp(now()) -%}
          {%- set ns_day.offset = 1 -%}
          {%- set scheduled = scheduled + 86400 -%}
        {%- endif -%}
        {%- if scheduled < candidate -%}
          {%- set add_days = ((candidate - scheduled) / 86400) | round(0, 'ceil') | int -%}
          {%- set ns_day.offset = ns_day.offset + add_days -%}
          {%- set scheduled = scheduled + add_days * 86400 -%}
        {%- endif -%}
        {%- if schedule_mode == 'fixed_time' -%}
          {%- set scheduled = as_timestamp(today_at(primary_start_time) + timedelta(days=ns_day.offset)) -%}
        {%- endif -%}
        {{ scheduled | int }}

  - alias: Wylicz powód pominięcia podlewania
    variables:
      zones_non_rc2: >-
        {{ [zone_1_valve, zone_2_valve, zone_3_valve, zone_4_valve, zone_5_valve, zone_6_valve,
            zone_7_valve, zone_8_valve, zone_9_valve, zone_10_valve, zone_11_valve, zone_12_valve][:(zone_count | int(1))]
           | select('string') | reject('eq', '') | reject('in', integration_entities('rainbird_rc2')) | list }}
      rain_sensor_unavailable: >-
        {{ rain_binary_sensor | default('', true) | length > 0
           and states(rain_binary_sensor) in ['unknown', 'unavailable'] }}
      irrigation_config_block_reason: >-
        {% if not (season_ok | bool) %}
          Poza sezonem podlewania. Aktywny sezon to miesiące {{ season_start_month }}-{{ season_end_month }}.
        {% elif (min_dose_mm | float(3)) > (max_dose_mm | float(10)) %}
          Minimalna dawka do startu ({{ min_dose_mm }} mm) jest większa od maksymalnej dawki jednego podlewania ({{ max_dose_mm }} mm). Popraw progi w sekcji "Harmonogram, sezon i progi".
        {% elif (water_balance_enabled | bool) and (states[water_balance_helper] is none or states(water_balance_helper) == 'unavailable') %}
          Helper bilansu wody {{ water_balance_helper }} nie istnieje albo jest niedostępny. Utwórz helper Tekst o maksymalnej długości 255 znaków albo wybierz istniejący.
        {% elif (water_balance_enabled | bool) and not (water_balance_helper_ok | bool) %}
          Helper bilansu wody {{ water_balance_helper }} ma limit {{ water_balance_helper_max }} znaków, a zapis bilansu wymaga {{ water_balance_payload_length }}. Ustaw maksymalną długość helpera na 255 znaków.
        {% elif not (water_balance_enabled | bool) and zones_non_rc2 | count > 0 %}
          Wybierz "Helper - trwały bilans wody". Sekcje {{ zones_non_rc2 | join(', ') }} nie raportują historii pracy, więc bez helpera nie da się policzyć ich zapotrzebowania na wodę.
        {% elif not (daily_forecast_available | bool) %}
          Encja {{ forecast_weather_entity }} nie udostępniła prognozy dziennej (weather.get_forecasts, type daily). Wybierz encję pogody z prognozą dzienną.
        {% elif not (weather_data_ok | bool) %}
          Brak wiarygodnych danych pogodowych. Aktualny stan: {{ current_weather_condition_pl }}, prognoza: {{ forecast_condition_pl }}.
        {% endif %}
      irrigation_weather_block_reason: >-
        {% if not (weather_ok | bool) %}
          Pogoda blokuje podlewanie. Aktualny stan: {{ current_weather_condition_pl }}, prognoza: {{ forecast_condition_pl }}.
        {% elif rain_sensor_unavailable | bool %}
          Czujnik deszczu {{ rain_binary_sensor }} jest niedostępny (stan {{ states(rain_binary_sensor) }}), podlewanie wstrzymane dla bezpieczeństwa. Sprawdź czujnik albo usuń go z konfiguracji.
        {% elif not (rain_sensor_ok | bool) %}
          Czujnik deszczu jest aktywny: {{ rain_binary_sensor }} ma stan {{ states(rain_binary_sensor) }}.
        {% elif not (soil_moisture_ok | bool) %}
          Gleba jest wystarczająco wilgotna: {{ soil_moisture_percent | float(0) | round(1) }}%, próg blokady {{ soil_moisture_block_percent | float(70) | round(0) }}%.
        {% elif not (forecast_rain_ok | bool) %}
          Prognoza deszczu ({{ forecast_window_label }}) blokuje podlewanie: {{ forecast_precipitation | float(0) }} mm i {{ forecast_precipitation_probability | int(0) }}% prawdopodobieństwa.
        {% elif not (temp_available | bool) %}
          Brak aktualnej temperatury: {{ temperature_source_entity if temperature_source_entity | default('', true) | length > 0 else current_weather_entity }} nie podaje wartości, a encja {{ current_weather_entity }} nie ma atrybutu temperature. Podlewanie wstrzymane dla bezpieczeństwa przed przymrozkiem.
        {% elif not (temp_ok | bool) %}
          Temperatura jest za niska: {{ temp_c | float(0) | round(1) }} C, minimum to {{ min_temperature_c }} C.
        {% elif not (wind_available | bool) %}
          Brak pomiaru wiatru: {{ wind_source_entity }} nie podaje wartości, a encja {{ current_weather_entity }} nie ma atrybutu wind_speed. Podlewanie wstrzymane.
        {% elif not (wind_ok | bool) %}
          Wiatr jest za mocny: {{ wind_value | float(0) | round(1) }}, limit to {{ max_wind }}.
        {% endif %}
      irrigation_skip_reason: >-
        {% if irrigation_config_block_reason | trim | length > 0 %}
          {{ irrigation_config_block_reason | trim }}
        {% elif (irrigation_cycle_needed | bool) %}
          {{ irrigation_weather_block_reason | trim }}
        {% endif %}
      next_watering_blocked_timestamp: >-
        {% set estimate = next_watering_estimated_timestamp | int(0) %}
        {% set check = next_schedule_timestamp | int(0) %}
        {{ estimate if estimate > check else check }}

  - alias: Zapisz termin kolejnego sprawdzenia przy blokadzie
    choose:
      - conditions:
          - condition: template
            value_template: "{{ irrigation_skip_reason | trim | length > 0 and next_watering_datetime | default('', true) | length > 0 }}"
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ next_watering_datetime }}"
            data:
              timestamp: "{{ next_watering_blocked_timestamp | int }}"

  - alias: Zaloguj pominięcie całego podlewania
    choose:
      - conditions:
          - condition: template
            value_template: "{{ irrigation_skip_reason | trim | length > 0 and not (trigger_is_condition_check | bool) and (enable_irrigation_logs | bool) }}"
        sequence:
          - action: logbook.log
            data:
              name: Inteligentne podlewanie
              message: "Pominięto podlewanie. {{ irrigation_skip_reason | trim }}"

  - alias: Powiadom o pominięciu całego podlewania
    choose:
      - conditions:
          - condition: template
            value_template: "{{ irrigation_skip_reason | trim | length > 0 and not (trigger_is_condition_check | bool) and (create_persistent_notification | bool) }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: Inteligentne podlewanie
              message: |-
                **Status:** pominięto podlewanie

                **Powód**
                {{ irrigation_skip_reason | trim }}

                **Pogoda**
                - Źródło: {{ weather_source_summary | trim }}
                - Aktualnie: {{ current_weather_condition_pl }}
                - Prognoza: {{ forecast_condition_pl }}
                - {{ rain_summary_line | trim }}
                {% if rain_measurement_warning | trim | length > 0 %}- Uwaga: {{ rain_measurement_warning | trim }}{% endif %}
                - Opad ({{ forecast_window_label }}): {{ forecast_precipitation | float(0) | round(1) }} mm
                - Szansa deszczu: {{ forecast_precipitation_probability | int(0) }}%
                - Temperatura: {{ temp_c | float(0) | round(1) }} C
                - Wiatr: {{ wind_value | float(0) | round(1) }}

                **Następny termin**
                {{ (next_watering_blocked_timestamp | int) | timestamp_custom('%Y-%m-%d %H:%M', true) }}
              notification_id: smart_irrigation_last_event

  - alias: Zatrzymaj gdy podlewanie pominięte
    choose:
      - conditions:
          - condition: template
            value_template: "{{ irrigation_skip_reason | trim | length > 0 }}"
        sequence:
          - stop: "Pominięto podlewanie: {{ irrigation_skip_reason | trim }}"

  - alias: Zapisz helper następnego podlewania
    choose:
      - conditions:
          - condition: template
            value_template: "{{ next_watering_datetime | default('', true) | length > 0 }}"
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ next_watering_datetime }}"
            data:
              timestamp: "{{ next_watering_estimated_timestamp | int }}"

  - alias: Zaloguj kontrolne przeliczenie
    choose:
      - conditions:
          - condition: template
            value_template: "{{ (trigger_is_condition_check | bool) and (enable_irrigation_logs | bool) }}"
        sequence:
          - action: logbook.log
            data:
              name: Inteligentne podlewanie
              message: >-
                {% set reason = irrigation_cycle_decision_reason | trim | replace('. Podlewane będą wszystkie włączone i gotowe sekcje.', '') %}
                Kontrolne sprawdzenie warunków.
                {% if irrigation_cycle_needed | bool %}
                  Podlewanie jest potrzebne. {{ reason }}. Sekcje nie zostały uruchomione, bo to tylko sprawdzenie kontrolne.
                {% else %}
                  Podlewanie nie jest jeszcze potrzebne. {{ reason }}
                {% endif %}
                Następny przewidywany termin: {{ (next_watering_estimated_timestamp | int) | timestamp_custom('%Y-%m-%d %H:%M', true) }}.

  - alias: Zatrzymaj po kontrolnym przeliczeniu
    choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger_is_condition_check | bool }}"
        sequence:
          - stop: "Kontrolne przeliczenie bez uruchamiania sekcji."

  - alias: Zaloguj pominięcie cyklu bez potrzeby podlewania
    choose:
      - conditions:
          - condition: template
            value_template: "{{ not (irrigation_cycle_needed | bool) and (enable_irrigation_logs | bool) }}"
        sequence:
          - action: logbook.log
            data:
              name: Inteligentne podlewanie
              message: "Pominięto podlewanie. {{ irrigation_cycle_decision_reason | trim }}"

  - alias: Powiadom o pominięciu cyklu bez potrzeby podlewania
    choose:
      - conditions:
          - condition: template
            value_template: "{{ not (irrigation_cycle_needed | bool) and (create_persistent_notification | bool) }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: Inteligentne podlewanie
              message: |-
                **Status:** pominięto podlewanie

                **Powód**
                {{ irrigation_cycle_decision_reason | trim }}

                **Pogoda**
                - Źródło: {{ weather_source_summary | trim }}
                - Aktualnie: {{ current_weather_condition_pl }}
                - Prognoza: {{ forecast_condition_pl }}
                - {{ rain_summary_line | trim }}
                {% if rain_measurement_warning | trim | length > 0 %}- Uwaga: {{ rain_measurement_warning | trim }}{% endif %}
                - Opad ({{ forecast_window_label }}): {{ forecast_precipitation | float(0) | round(1) }} mm
                - Szansa deszczu: {{ forecast_precipitation_probability | int(0) }}%
                - Temperatura: {{ temp_c | float(0) | round(1) }} C
                - Wiatr: {{ wind_value | float(0) | round(1) }}

                **Następny termin**
                {{ (next_watering_estimated_timestamp | int) | timestamp_custom('%Y-%m-%d %H:%M', true) }}
              notification_id: smart_irrigation_last_event

  - alias: Zatrzymaj gdy cykl podlewania nie jest potrzebny
    choose:
      - conditions:
          - condition: template
            value_template: "{{ not (irrigation_cycle_needed | bool) }}"
        sequence:
          - stop: "Pominięto podlewanie: {{ irrigation_cycle_decision_reason | trim }}"

  - alias: Zaloguj start podlewania
    choose:
      - conditions:
          - condition: template
            value_template: "{{ enable_irrigation_logs | bool }}"
        sequence:
          - action: logbook.log
            data:
              name: Inteligentne podlewanie
              message: >-
                Zaplanowano cykl podlewania dla włączonych sekcji. {{ irrigation_cycle_decision_reason | trim }}
                Największa dawka cyklu {{ irrigation_cycle_depth_mm | float(0) | round(1) }} mm.
                Źródło pogody: {{ weather_source_summary | trim }}.
                {{ rain_measurement_warning | trim }}
                Prognoza opadu ({{ forecast_window_label }}) {{ forecast_precipitation | float(0) | round(1) }} mm,
                szansa deszczu {{ forecast_precipitation_probability | int(0) }}%,
                temperatura {{ temp_c | float(0) | round(1) }} C,
                wiatr {{ wind_value | float(0) | round(1) }}.

  - alias: Zapamiętaj początek cyklu
    variables:
      irrigation_cycle_started_at: "{{ now().isoformat() }}"
      start_notification_sent: false
      watered_sections: []
      cycle_aborted: false
      cycle_abort_section: 0
      cycle_abort_note: ""

  - alias: Podlej aktywne sekcje
    repeat:
      for_each:
      - number: 1
        valve: !input zone_1_valve
        name: !input zone_1_name
        soil_type: !input zone_1_soil_type
        plant_type: !input zone_1_plant_type
        sprinkler_profile: !input zone_1_sprinkler_profile
        custom_rate_mm_h: !input zone_1_custom_rate_mm_h
        runtime_adjustment_percent: !input zone_1_runtime_adjustment_percent
        online_sensor: !input zone_1_online_sensor
        battery_sensor: !input zone_1_battery_sensor
      - number: 2
        valve: !input zone_2_valve
        name: !input zone_2_name
        soil_type: !input zone_2_soil_type
        plant_type: !input zone_2_plant_type
        sprinkler_profile: !input zone_2_sprinkler_profile
        custom_rate_mm_h: !input zone_2_custom_rate_mm_h
        runtime_adjustment_percent: !input zone_2_runtime_adjustment_percent
        online_sensor: !input zone_2_online_sensor
        battery_sensor: !input zone_2_battery_sensor
      - number: 3
        valve: !input zone_3_valve
        name: !input zone_3_name
        soil_type: !input zone_3_soil_type
        plant_type: !input zone_3_plant_type
        sprinkler_profile: !input zone_3_sprinkler_profile
        custom_rate_mm_h: !input zone_3_custom_rate_mm_h
        runtime_adjustment_percent: !input zone_3_runtime_adjustment_percent
        online_sensor: !input zone_3_online_sensor
        battery_sensor: !input zone_3_battery_sensor
      - number: 4
        valve: !input zone_4_valve
        name: !input zone_4_name
        soil_type: !input zone_4_soil_type
        plant_type: !input zone_4_plant_type
        sprinkler_profile: !input zone_4_sprinkler_profile
        custom_rate_mm_h: !input zone_4_custom_rate_mm_h
        runtime_adjustment_percent: !input zone_4_runtime_adjustment_percent
        online_sensor: !input zone_4_online_sensor
        battery_sensor: !input zone_4_battery_sensor
      - number: 5
        valve: !input zone_5_valve
        name: !input zone_5_name
        soil_type: !input zone_5_soil_type
        plant_type: !input zone_5_plant_type
        sprinkler_profile: !input zone_5_sprinkler_profile
        custom_rate_mm_h: !input zone_5_custom_rate_mm_h
        runtime_adjustment_percent: !input zone_5_runtime_adjustment_percent
        online_sensor: !input zone_5_online_sensor
        battery_sensor: !input zone_5_battery_sensor
      - number: 6
        valve: !input zone_6_valve
        name: !input zone_6_name
        soil_type: !input zone_6_soil_type
        plant_type: !input zone_6_plant_type
        sprinkler_profile: !input zone_6_sprinkler_profile
        custom_rate_mm_h: !input zone_6_custom_rate_mm_h
        runtime_adjustment_percent: !input zone_6_runtime_adjustment_percent
        online_sensor: !input zone_6_online_sensor
        battery_sensor: !input zone_6_battery_sensor
      - number: 7
        valve: !input zone_7_valve
        name: !input zone_7_name
        soil_type: !input zone_7_soil_type
        plant_type: !input zone_7_plant_type
        sprinkler_profile: !input zone_7_sprinkler_profile
        custom_rate_mm_h: !input zone_7_custom_rate_mm_h
        runtime_adjustment_percent: !input zone_7_runtime_adjustment_percent
        online_sensor: !input zone_7_online_sensor
        battery_sensor: !input zone_7_battery_sensor
      - number: 8
        valve: !input zone_8_valve
        name: !input zone_8_name
        soil_type: !input zone_8_soil_type
        plant_type: !input zone_8_plant_type
        sprinkler_profile: !input zone_8_sprinkler_profile
        custom_rate_mm_h: !input zone_8_custom_rate_mm_h
        runtime_adjustment_percent: !input zone_8_runtime_adjustment_percent
        online_sensor: !input zone_8_online_sensor
        battery_sensor: !input zone_8_battery_sensor
      - number: 9
        valve: !input zone_9_valve
        name: !input zone_9_name
        soil_type: !input zone_9_soil_type
        plant_type: !input zone_9_plant_type
        sprinkler_profile: !input zone_9_sprinkler_profile
        custom_rate_mm_h: !input zone_9_custom_rate_mm_h
        runtime_adjustment_percent: !input zone_9_runtime_adjustment_percent
        online_sensor: !input zone_9_online_sensor
        battery_sensor: !input zone_9_battery_sensor
      - number: 10
        valve: !input zone_10_valve
        name: !input zone_10_name
        soil_type: !input zone_10_soil_type
        plant_type: !input zone_10_plant_type
        sprinkler_profile: !input zone_10_sprinkler_profile
        custom_rate_mm_h: !input zone_10_custom_rate_mm_h
        runtime_adjustment_percent: !input zone_10_runtime_adjustment_percent
        online_sensor: !input zone_10_online_sensor
        battery_sensor: !input zone_10_battery_sensor
      - number: 11
        valve: !input zone_11_valve
        name: !input zone_11_name
        soil_type: !input zone_11_soil_type
        plant_type: !input zone_11_plant_type
        sprinkler_profile: !input zone_11_sprinkler_profile
        custom_rate_mm_h: !input zone_11_custom_rate_mm_h
        runtime_adjustment_percent: !input zone_11_runtime_adjustment_percent
        online_sensor: !input zone_11_online_sensor
        battery_sensor: !input zone_11_battery_sensor
      - number: 12
        valve: !input zone_12_valve
        name: !input zone_12_name
        soil_type: !input zone_12_soil_type
        plant_type: !input zone_12_plant_type
        sprinkler_profile: !input zone_12_sprinkler_profile
        custom_rate_mm_h: !input zone_12_custom_rate_mm_h
        runtime_adjustment_percent: !input zone_12_runtime_adjustment_percent
        online_sensor: !input zone_12_online_sensor
        battery_sensor: !input zone_12_battery_sensor
      sequence:
        - alias: Wylicz parametry tej sekcji
          variables:
            section_number: "{{ repeat.item.number | int }}"
            section_enabled: "{{ (repeat.item.number | int) <= (zone_count | int(1)) }}"
            section_valve: "{{ repeat.item.valve }}"
            section_name: "{{ repeat.item.name }}"
            section_is_rc2: "{{ section_valve in integration_entities('rainbird_rc2') }}"
            section_rc2_connection_entity: >-
              {% if section_valve in integration_entities('rainbird_rc2') %}
                {% set entry_id = config_entry_id(section_valve) %}
                {% set ns = namespace(entity='') %}
                {% for entity in integration_entities('rainbird_rc2') %}
                  {% if entity.startswith('binary_sensor.')
                        and config_entry_id(entity) == entry_id
                        and state_attr(entity, 'device_class') == 'connectivity' %}
                    {% set ns.entity = entity %}
                  {% endif %}
                {% endfor %}
                {{ ns.entity }}
              {% else %}{% endif %}
            section_controller_ready: >-
              {{ section_rc2_connection_entity | trim | length == 0
                 or is_state(section_rc2_connection_entity, 'on') }}
            section_controller_status: >-
              {% if section_rc2_connection_entity | trim | length > 0 %}
                {{ section_rc2_connection_entity }} ma stan {{ states(section_rc2_connection_entity) }}
                {% if state_attr(section_rc2_connection_entity, 'is_shutdown') is not none %}, shutdown={{ state_attr(section_rc2_connection_entity, 'is_shutdown') }}{% endif %}
                {% if state_attr(section_rc2_connection_entity, 'connection_state') is not none %}, connection_state={{ state_attr(section_rc2_connection_entity, 'connection_state') }}{% endif %}
              {% else %}
                brak sensora połączenia RC2
              {% endif %}
            section_soil_factor: >-
              {% set soil = repeat.item.soil_type %}
              {% if soil == 'sand' %}55
              {% elif soil == 'sandy_loam' %}115
              {% elif soil == 'humus' %}170
              {% elif soil == 'chernozem' %}180
              {% elif soil == 'clay_loam' %}155
              {% elif soil == 'clay' %}120
              {% else %}150
              {% endif %}
            section_crop_coefficient: >-
              {% set plant = repeat.item.plant_type %}
              {% if plant == 'flowers' %}0.8
              {% elif plant == 'vegetables' %}1.0
              {% elif plant == 'shrubs' %}0.55
              {% else %}0.75
              {% endif %}
            section_root_depth_m: >-
              {% set plant = repeat.item.plant_type %}
              {% if plant == 'flowers' %}0.25
              {% elif plant == 'vegetables' %}0.35
              {% elif plant == 'shrubs' %}0.5
              {% else %}0.2
              {% endif %}
            section_allowed_depletion: >-
              {% set plant = repeat.item.plant_type %}
              {% if plant == 'flowers' %}0.4
              {% elif plant == 'vegetables' %}0.35
              {% elif plant == 'shrubs' %}0.55
              {% else %}0.45
              {% endif %}
            section_rate_mm_h: >-
              {% set profile = repeat.item.sprinkler_profile %}
              {% if profile in ['rainbird_rotor', 'rainbird_5000_rotor'] %}12
              {% elif profile in ['rainbird_spray', 'rainbird_1800_spray'] %}38
              {% elif profile == 'rainbird_rvan' %}15
              {% elif profile in ['rainbird_drip', 'rainbird_xf_drip'] %}8
              {% elif profile == 'hunter_rotor' %}11
              {% elif profile == 'hunter_mp_rotator' %}10
              {% elif profile == 'hunter_spray' %}40
              {% elif profile == 'hunter_drip' %}8
              {% else %}{{ repeat.item.custom_rate_mm_h | float(12) }}
              {% endif %}
            section_last_completed: >-
              {{ state_attr(section_valve, 'last_run_completed') | default('', true) }}
            section_last_duration_minutes: >-
              {{ state_attr(section_valve, 'last_duration_minutes') | default('', true) }}
            section_elapsed_days: >-
              {% set last_ts = as_timestamp(section_last_completed, 0) %}
              {% if last_ts > 0 %}
                {% set elapsed = (as_timestamp(now()) - last_ts) / 86400 %}
                {{ 0 if elapsed < 0 else elapsed | round(3) }}
              {% else %}
                0
              {% endif %}
            section_target_depth_mm: >-
              {% set raw = (section_soil_factor | float(150)) * (section_root_depth_m | float(0.2)) * (section_allowed_depletion | float(0.45)) %}
              {% set minimum = min_dose_mm | float(3) %}
              {% if raw < minimum %}{{ minimum }}
              {% else %}{{ raw | round(1) }}
              {% endif %}
            section_water_deficit_mm: >-
              {% set daily = (reference_et_mm | float(3.5)) * (section_crop_coefficient | float(0.75)) %}
              {% set target = section_target_depth_mm | float(3) %}
              {% set effective_rate = (section_rate_mm_h | float(12)) * (irrigation_efficiency_percent | float(75)) / 100 %}
              {% set last_duration = section_last_duration_minutes %}
              {% set delivered = (last_duration | float(0)) * effective_rate / 60 if last_duration | is_number else target %}
              {% set carryover = target - delivered if section_last_completed | length > 0 and delivered < target else 0 %}
              {% set fallback_raw = carryover + daily * (section_elapsed_days | float(0)) - (rain_credit_mm | float(0)) %}
              {% set fallback = 0 if fallback_raw < 0 else fallback_raw %}
              {{ (water_balance_deficits[section_number - 1] | float(0)) | round(1) if (water_balance_enabled | bool) else fallback | round(1) }}
            section_depth_mm: >-
              {% set deficit = section_water_deficit_mm | float(0) %}
              {% set threshold = section_target_depth_mm | float(3) %}
              {% set planned = deficit if deficit > threshold else threshold %}
              {% set maximum = max_dose_mm | float(10) %}
              {% if not (irrigation_cycle_needed | bool) %}0
              {% elif planned > maximum %}{{ maximum }}
              {% else %}{{ planned | round(1) }}
              {% endif %}
            section_minutes: >-
              {% set depth = section_depth_mm | float(0) %}
              {% set rate = (section_rate_mm_h | float(12)) * (irrigation_efficiency_percent | float(75)) / 100 %}
              {% set raw = (depth / (rate if rate > 0 else 1)) * 60 * (repeat.item.runtime_adjustment_percent | float(100)) / 100 %}
              {% set rounded = raw | round(0) | int %}
              {% if depth < (min_dose_mm | float(3)) %}0
              {% elif rounded < (min_runtime_minutes | int(8)) %}{{ min_runtime_minutes | int(8) }}
              {% elif rounded > (max_runtime_minutes | int(45)) %}{{ max_runtime_minutes | int(45) }}
              {% else %}{{ rounded }}
              {% endif %}
            section_applied_depth_mm: >-
              {% set effective_rate = (section_rate_mm_h | float(12)) * (irrigation_efficiency_percent | float(75)) / 100 %}
              {{ ((section_minutes | float(0)) * effective_rate / 60) | round(1) }}
            section_live_rain: >-
              {{ (rain_binary_sensor | default('', true) | length > 0) and not is_state(rain_binary_sensor, 'off') }}
            section_ready: >-
              {{ section_enabled | bool
                 and not (cycle_aborted | bool)
                 and section_valve | default('', true) | length > 0
                 and (section_controller_ready | bool)
                 and not (section_live_rain | bool)
                 and states(current_weather_entity) not in bad_weather_states
                 and states(current_weather_entity) not in ['unknown', 'unavailable']
                 and states(section_valve) in ['closed', 'off', 'idle']
                 and (repeat.item.online_sensor | default('', true) | length == 0 or is_state(repeat.item.online_sensor, 'on'))
                 and (repeat.item.battery_sensor | default('', true) | length == 0 or (states(repeat.item.battery_sensor) | float(0)) >= (min_battery_percent | float(20))) }}
            section_skip_reason: >-
              {% if not (section_enabled | bool) %}
                Sekcja poza wybraną liczbą sekcji.
              {% elif cycle_aborted | bool %}
                Cykl przerwany: {{ cycle_abort_note }}
              {% elif section_valve | default('', true) | length == 0 %}
                Brak encji sekcji.
              {% elif not (section_controller_ready | bool) %}
                Sterownik Rain Bird RC2 jest offline albo w stanie shutdown. {{ section_controller_status | trim }}.
              {% elif (rain_binary_sensor | default('', true) | length > 0) and is_state(rain_binary_sensor, 'on') %}
                Czujnik deszczu jest aktywny: {{ rain_binary_sensor }} ma stan {{ states(rain_binary_sensor) }}.
              {% elif (rain_binary_sensor | default('', true) | length > 0) and not is_state(rain_binary_sensor, 'off') %}
                Czujnik deszczu {{ rain_binary_sensor }} jest niedostępny (stan {{ states(rain_binary_sensor) }}), sekcja wstrzymana dla bezpieczeństwa.
              {% elif states(current_weather_entity) in bad_weather_states %}
                Pogoda blokuje podlewanie. Aktualny stan: {{ current_weather_condition_pl }}.
              {% elif states(current_weather_entity) in ['unknown', 'unavailable'] %}
                Dane pogodowe są niedostępne. Aktualny stan: {{ states(current_weather_entity) }}.
              {% elif states(section_valve) not in ['closed', 'off', 'idle'] %}
                Sekcja nie jest gotowa do startu. Aktualny stan: {{ states(section_valve) }}.
              {% elif repeat.item.online_sensor | default('', true) | length > 0 and not is_state(repeat.item.online_sensor, 'on') %}
                Sensor online sekcji nie jest aktywny: {{ states(repeat.item.online_sensor) }}.
              {% elif repeat.item.battery_sensor | default('', true) | length > 0 and (states(repeat.item.battery_sensor) | float(0)) < (min_battery_percent | float(20)) %}
                Bateria sekcji za niska: {{ states(repeat.item.battery_sensor) }}%, minimum to {{ min_battery_percent }}%.
              {% elif (section_minutes | int(0)) <= 0 %}
                Sekcja nie ma wyliczonego czasu pracy mimo zaplanowanego cyklu. Sprawdź opad zraszaczy i limity czasu.
              {% else %}{% endif %}
        - choose:
            - conditions:
                - condition: template
                  value_template: "{{ section_ready | bool and (section_minutes | int(0)) > 0 }}"
              sequence:
                - alias: Wyślij polecenie otwarcia sekcji
                  choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ section_valve in integration_entities('rainbird_rc2') }}"
                      sequence:
                        - action: rainbird_rc2.start_zone
                          continue_on_error: true
                          data:
                            station_entity: "{{ section_valve }}"
                            duration: "{{ section_minutes | int(1) }}"
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ section_valve.split('.')[0] == 'switch'
                               and (send_runtime_to_switch | bool)
                               and section_valve in integration_entities('rainbird') }}
                      sequence:
                        - action: rainbird.start_irrigation
                          continue_on_error: true
                          target:
                            entity_id: "{{ section_valve }}"
                          data:
                            duration: "{{ section_minutes | int(1) }}"
                    - conditions:
                        - condition: template
                          value_template: "{{ section_valve.split('.')[0] == 'switch' }}"
                      sequence:
                        - action: switch.turn_on
                          continue_on_error: true
                          target:
                            entity_id: "{{ section_valve }}"
                  default:
                    - action: valve.open_valve
                      continue_on_error: true
                      target:
                        entity_id: "{{ section_valve }}"
                - alias: Poczekaj na potwierdzenie otwarcia sekcji
                  wait_template: "{{ states(section_valve) in valve_active_states }}"
                  timeout: "00:01:00"
                  continue_on_timeout: true
                - alias: Zapamiętaj wynik otwarcia sekcji
                  variables:
                    section_started: "{{ states(section_valve) in valve_active_states }}"
                    section_started_at: "{{ as_timestamp(now()) }}"
                    section_interrupted: false
                    section_interruption_reason: ""
                - alias: Prowadź sekcję po potwierdzeniu otwarcia
                  if:
                    - condition: template
                      value_template: "{{ section_started | bool }}"
                  then:
                    - alias: Powiadom po potwierdzeniu pierwszej uruchomionej sekcji
                      choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ not (start_notification_sent | bool) }}"
                          sequence:
                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: "{{ create_persistent_notification | bool }}"
                                  sequence:
                                    - action: persistent_notification.create
                                      data:
                                        title: Inteligentne podlewanie
                                        message: |-
                                          **Status:** rozpoczęto podlewanie

                                          **Pierwsza sekcja**
                                          - Numer: {{ section_number }}
                                          - Nazwa: {{ section_name }}
                                          - Czas: {{ section_minutes | int(0) }} min
                                          - Stan sterownika: {{ states(section_valve) }}

                                          **Plan cyklu**
                                          {{ irrigation_cycle_decision_reason | trim }}

                                          **Pogoda**
                                          - Źródło: {{ weather_source_summary | trim }}
                                          - Aktualnie: {{ current_weather_condition_pl }}
                                          - Prognoza: {{ forecast_condition_pl }}
                                          - {{ rain_summary_line | trim }}
                                          {% if rain_measurement_warning | trim | length > 0 %}- Uwaga: {{ rain_measurement_warning | trim }}{% endif %}
                                          - Opad prognozowany ({{ forecast_window_label }}): {{ forecast_precipitation | float(0) | round(1) }} mm
                                        notification_id: smart_irrigation_last_event
                            - variables:
                                start_notification_sent: true
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ enable_irrigation_logs | bool }}"
                          sequence:
                            - action: logbook.log
                              data:
                                name: "Podlewanie - {{ section_name }}"
                                message: >-
                                  Uruchomiono sekcję {{ section_number }} na {{ section_minutes | int(0) }} min.
                                  Sterownik potwierdził stan {{ states(section_valve) }}.
                                  Dawka {{ section_depth_mm | float(0) | round(1) }} mm,
                                  przewidywana dawka dostarczona przy limicie czasu {{ section_applied_depth_mm | float(0) | round(1) }} mm,
                                  deficyt sekcji {{ section_water_deficit_mm | float(0) | round(1) }} mm,
                                  próg sekcji {{ section_target_depth_mm | float(0) | round(1) }} mm,
                                  opad zraszaczy {{ section_rate_mm_h | float(0) | round(1) }} mm/h.
                    - alias: Monitoruj pogodę i stabilność pracy sekcji
                      repeat:
                        while:
                          - condition: template
                            value_template: >-
                              {% set elapsed = as_timestamp(now()) - (section_started_at | float(as_timestamp(now()))) %}
                              {% set planned = (section_minutes | int(1)) * 60 %}
                              {% set rain_active =
                                 (rain_binary_sensor | default('', true) | length > 0) and is_state(rain_binary_sensor, 'on') %}
                              {% set w = states[current_weather_entity] %}
                              {% set weather_lost = w is none
                                 or (w.state in ['unknown', 'unavailable'] and (now() - w.last_changed).total_seconds() > 300) %}
                              {% set weather_bad = states(current_weather_entity) in bad_weather_states or weather_lost %}
                              {% set valve_running = states(section_valve) in valve_active_states %}
                              {{ elapsed < planned and not rain_active and not weather_bad and valve_running }}
                        sequence:
                          - delay:
                              seconds: 15
                    - alias: Sprawdź czy sekcja została przerwana
                      variables:
                        section_interrupted: >-
                          {% set w = states[current_weather_entity] %}
                          {% set weather_lost = w is none
                             or (w.state in ['unknown', 'unavailable'] and (now() - w.last_changed).total_seconds() > 300) %}
                          {% set weather_interrupted =
                             ((rain_binary_sensor | default('', true) | length > 0) and is_state(rain_binary_sensor, 'on'))
                             or states(current_weather_entity) in bad_weather_states
                             or weather_lost %}
                          {% set elapsed = as_timestamp(now()) - (section_started_at | float(as_timestamp(now()))) %}
                          {% set planned = (section_minutes | int(1)) * 60 %}
                          {% set stop_grace = [120, (planned * 0.08) | int] | max %}
                          {% set valve_stopped_early =
                             states(section_valve) not in valve_active_states
                             and elapsed < (planned - stop_grace) %}
                          {{ weather_interrupted or valve_stopped_early }}
                        section_interruption_reason: >-
                          {% set w = states[current_weather_entity] %}
                          {% set weather_lost = w is none
                             or (w.state in ['unknown', 'unavailable'] and (now() - w.last_changed).total_seconds() > 300) %}
                          {% if (rain_binary_sensor | default('', true) | length > 0) and is_state(rain_binary_sensor, 'on') %}
                            czujnik deszczu {{ rain_binary_sensor }} jest aktywny
                          {% elif states(current_weather_entity) in bad_weather_states %}
                            {% set condition = states(current_weather_entity) | trim %}
                            {% set names = {
                              'hail': 'grad',
                              'lightning': 'burza',
                              'lightning-rainy': 'burza z deszczem',
                              'pouring': 'ulewny deszcz',
                              'rainy': 'deszcz',
                              'snowy': 'śnieg',
                              'snowy-rainy': 'śnieg z deszczem'
                            } %}
                            pogoda zmieniła się na {{ names.get(condition, condition) }}
                          {% elif weather_lost %}
                            dane pogodowe są niedostępne dłużej niż 5 min
                          {% elif states(section_valve) not in valve_active_states %}
                            sterownik zamknął sekcję wyraźnie przed upływem zaplanowanego czasu; aktualny stan: {{ states(section_valve) }}
                          {% else %}
                            deszcz albo zła pogoda
                          {% endif %}
                - alias: Zamknij sekcję i potwierdź zamknięcie
                  repeat:
                    sequence:
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ section_valve in integration_entities('rainbird_rc2') }}"
                            sequence:
                              - action: rainbird_rc2.stop_zone
                                continue_on_error: true
                                data:
                                  station_entity: "{{ section_valve }}"
                          - conditions:
                              - condition: template
                                value_template: "{{ section_valve.split('.')[0] == 'switch' }}"
                            sequence:
                              - action: switch.turn_off
                                continue_on_error: true
                                target:
                                  entity_id: "{{ section_valve }}"
                        default:
                          - action: valve.close_valve
                            continue_on_error: true
                            target:
                              entity_id: "{{ section_valve }}"
                      - wait_template: "{{ states(section_valve) in valve_closed_states }}"
                        timeout: "00:00:30"
                        continue_on_timeout: true
                    until:
                      - condition: template
                        value_template: "{{ states(section_valve) in valve_closed_states or repeat.index >= 3 }}"
                - alias: Alarm gdy sekcja nie potwierdziła zamknięcia
                  if:
                    - condition: template
                      value_template: "{{ states(section_valve) not in valve_closed_states }}"
                  then:
                    - action: persistent_notification.create
                      data:
                        title: Inteligentne podlewanie - ALARM
                        message: |-
                          **Status:** sekcja nie potwierdziła zamknięcia

                          **Sekcja**
                          - Numer: {{ section_number }}
                          - Nazwa: {{ section_name }}
                          - Encja: {{ section_valve }}
                          - Stan: {{ states(section_valve) }}

                          Automatyzacja wysłała polecenie zamknięcia 3 razy co 30 s i nie dostała potwierdzenia. Sprawdź zawór ręcznie. Pozostałe sekcje nie zostaną uruchomione w tym cyklu.
                        notification_id: smart_irrigation_valve_alarm
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ enable_irrigation_logs | bool }}"
                          sequence:
                            - action: logbook.log
                              data:
                                name: "Podlewanie - {{ section_name }}"
                                message: "ALARM: sekcja {{ section_number }} ({{ section_valve }}) nie potwierdziła zamknięcia po 3 próbach, stan {{ states(section_valve) }}. Cykl zatrzymany."
                    - stop: "Sekcja {{ section_number }} nie potwierdziła zamknięcia."
                      error: true
                - alias: Obsłuż brak potwierdzenia otwarcia
                  if:
                    - condition: template
                      value_template: "{{ not (section_started | bool) }}"
                  then:
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ enable_irrigation_logs | bool }}"
                          sequence:
                            - action: logbook.log
                              data:
                                name: "Podlewanie - {{ section_name }}"
                                message: "Nie uruchomiono sekcji {{ section_number }}. Sterownik nie potwierdził otwarcia w ciągu 60 s; wysłano i potwierdzono zamknięcie. Pozostałe sekcje nie zostaną uruchomione w tym cyklu."
                    - variables:
                        cycle_aborted: true
                        cycle_abort_section: "{{ section_number | int }}"
                        cycle_abort_note: >-
                          sekcja {{ section_number }} ({{ section_name }}, {{ section_valve }}) nie potwierdziła otwarcia w ciągu 60 s; została zamknięta, a kolejne sekcje nie były uruchamiane.
                - alias: Obsłuż przerwanie sekcji
                  if:
                    - condition: template
                      value_template: "{{ (section_started | bool) and (section_interrupted | bool) }}"
                  then:
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ (water_balance_enabled | bool) and (water_balance_helper_ok | bool) }}"
                          sequence:
                            - variables:
                                interrupted_balance_payload: |-
                                  {%- set saved = states(water_balance_helper) | from_json({}) -%}
                                  {%- set previous = saved.get('z', water_balance_deficits) if saved is mapping else water_balance_deficits -%}
                                  {%- set elapsed_minutes = ((as_timestamp(now()) - (section_started_at | float(as_timestamp(now())))) / 60) -%}
                                  {%- set actual_minutes = 0 if elapsed_minutes < 0 else (section_minutes | float(0)) if elapsed_minutes > (section_minutes | float(0)) else elapsed_minutes -%}
                                  {%- set effective_rate = (section_rate_mm_h | float(12)) * (irrigation_efficiency_percent | float(75)) / 100 -%}
                                  {%- set applied = actual_minutes * effective_rate / 60 -%}
                                  {%- set ns = namespace(values=[]) -%}
                                  {%- for value in previous -%}
                                    {%- set updated = (value | float(0)) - applied if loop.index == (section_number | int) else value | float(0) -%}
                                    {%- set ns.values = ns.values + [0 if updated < 0 else updated | round(1)] -%}
                                  {%- endfor -%}
                                  {"v":1,"t":{{ saved.get('t', as_timestamp(now())) | int }},"r":{{ saved.get('r', water_balance_rain_total_mm) | float(0) | round(1) }},"z":{{ ns.values | to_json }}{{ '}' }}
                            - action: input_text.set_value
                              target:
                                entity_id: "{{ water_balance_helper }}"
                              data:
                                value: "{{ interrupted_balance_payload | trim }}"
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ enable_irrigation_logs | bool }}"
                          sequence:
                            - action: logbook.log
                              data:
                                name: Inteligentne podlewanie
                                message: "Przerwano sekcję {{ section_number }}: {{ section_name }}. Powód: {{ section_interruption_reason | trim }}. Pozostałe sekcje nie zostaną uruchomione."
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ create_persistent_notification | bool }}"
                          sequence:
                            - action: persistent_notification.create
                              data:
                                title: Inteligentne podlewanie
                                message: |-
                                  **Status:** zakończono podlewanie przed czasem

                                  **Sekcja**
                                  - Numer: {{ section_number }}
                                  - Nazwa: {{ section_name }}
                                  - Encja: {{ section_valve }}

                                  **Powód**
                                  {{ section_interruption_reason | trim }}

                                  **Wynik cyklu**
                                  Sekcja została zamknięta (zamknięcie potwierdzone), a pozostałe sekcje nie zostaną uruchomione w tym cyklu.

                                  **Pogoda**
                                  - Źródło: {{ weather_source_summary | trim }}
                                  - Aktualnie: {{ current_weather_condition_pl }}
                                  - Prognoza: {{ forecast_condition_pl }}
                                  - Czujnik deszczu: {{ states(rain_binary_sensor) if (rain_binary_sensor | default('', true) | length > 0) else 'nie wybrano' }}
                                notification_id: smart_irrigation_last_event
                    - stop: "Podlewanie przerwane: {{ section_interruption_reason | trim }}."
                - alias: Rozlicz zakończoną sekcję
                  if:
                    - condition: template
                      value_template: "{{ section_started | bool }}"
                  then:
                    - alias: Odejmij wykonane podlewanie od bilansu sekcji
                      choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ (water_balance_enabled | bool) and (water_balance_helper_ok | bool) }}"
                          sequence:
                            - variables:
                                section_balance_payload: |-
                                  {%- set saved = states(water_balance_helper) | from_json({}) -%}
                                  {%- set previous = saved.get('z', water_balance_deficits) if saved is mapping else water_balance_deficits -%}
                                  {%- set ns = namespace(values=[]) -%}
                                  {%- for value in previous -%}
                                    {%- set updated = (value | float(0)) - (section_applied_depth_mm | float(0)) if loop.index == (section_number | int) else value | float(0) -%}
                                    {%- set ns.values = ns.values + [0 if updated < 0 else updated | round(1)] -%}
                                  {%- endfor -%}
                                  {"v":1,"t":{{ saved.get('t', as_timestamp(now())) | int }},"r":{{ saved.get('r', water_balance_rain_total_mm) | float(0) | round(1) }},"z":{{ ns.values | to_json }}{{ '}' }}
                            - action: input_text.set_value
                              target:
                                entity_id: "{{ water_balance_helper }}"
                              data:
                                value: "{{ section_balance_payload | trim }}"
                    - alias: Zapamiętaj podlaną sekcję do raportu
                      variables:
                        watered_sections: >-
                          {% set minutes = ((as_timestamp(now()) - (section_started_at | float(as_timestamp(now())))) / 60) | round(1) %}
                          {{ watered_sections + [{'n': section_number | int, 'min': minutes, 'mm': section_applied_depth_mm | float(0) | round(1)}] }}
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ enable_irrigation_logs | bool }}"
                          sequence:
                            - action: logbook.log
                              data:
                                name: "Podlewanie - {{ section_name }}"
                                message: "Zakończono sekcję {{ section_number }} po zaplanowanym czasie {{ section_minutes | int(0) }} min. Zamknięcie potwierdzone, stan {{ states(section_valve) }}."
                    - delay:
                        seconds: "{{ zone_pause_seconds | int(15) }}"
          default:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ section_enabled | bool and (enable_irrigation_logs | bool) and not (cycle_aborted | bool) }}"
                  sequence:
                    - action: logbook.log
                      data:
                        name: "Podlewanie - {{ section_name }}"
                        message: "Pominięto sekcję {{ section_number }}. {{ section_skip_reason | trim }}"

  - alias: Wylicz termin po zakończonym cyklu z bilansu
    variables:
      next_watering_after_cycle_timestamp: |-
        {%- set zones = [
          {'number': 1, 'valve': zone_1_valve, 'soil': zone_1_soil_type, 'plant': zone_1_plant_type},
          {'number': 2, 'valve': zone_2_valve, 'soil': zone_2_soil_type, 'plant': zone_2_plant_type},
          {'number': 3, 'valve': zone_3_valve, 'soil': zone_3_soil_type, 'plant': zone_3_plant_type},
          {'number': 4, 'valve': zone_4_valve, 'soil': zone_4_soil_type, 'plant': zone_4_plant_type},
          {'number': 5, 'valve': zone_5_valve, 'soil': zone_5_soil_type, 'plant': zone_5_plant_type},
          {'number': 6, 'valve': zone_6_valve, 'soil': zone_6_soil_type, 'plant': zone_6_plant_type},
          {'number': 7, 'valve': zone_7_valve, 'soil': zone_7_soil_type, 'plant': zone_7_plant_type},
          {'number': 8, 'valve': zone_8_valve, 'soil': zone_8_soil_type, 'plant': zone_8_plant_type},
          {'number': 9, 'valve': zone_9_valve, 'soil': zone_9_soil_type, 'plant': zone_9_plant_type},
          {'number': 10, 'valve': zone_10_valve, 'soil': zone_10_soil_type, 'plant': zone_10_plant_type},
          {'number': 11, 'valve': zone_11_valve, 'soil': zone_11_soil_type, 'plant': zone_11_plant_type},
          {'number': 12, 'valve': zone_12_valve, 'soil': zone_12_soil_type, 'plant': zone_12_plant_type}
        ] -%}
        {%- set saved = states(water_balance_helper) | from_json({}) if (water_balance_enabled | bool) else {} -%}
        {%- set deficits = saved.get('z', water_balance_deficits) if saved is mapping else water_balance_deficits -%}
        {%- set ns = namespace(days=999, found=false) -%}
        {%- for zone in zones if (zone.number | int) <= (zone_count | int(1)) and (zone.valve | default('', true) | length > 0) -%}
          {%- set available = 55 if zone.soil == 'sand' else 115 if zone.soil == 'sandy_loam' else 170 if zone.soil == 'humus' else 180 if zone.soil == 'chernozem' else 155 if zone.soil == 'clay_loam' else 120 if zone.soil == 'clay' else 150 -%}
          {%- set kc = 0.8 if zone.plant == 'flowers' else 1.0 if zone.plant == 'vegetables' else 0.55 if zone.plant == 'shrubs' else 0.75 -%}
          {%- set root = 0.25 if zone.plant == 'flowers' else 0.35 if zone.plant == 'vegetables' else 0.5 if zone.plant == 'shrubs' else 0.2 -%}
          {%- set depletion = 0.4 if zone.plant == 'flowers' else 0.35 if zone.plant == 'vegetables' else 0.55 if zone.plant == 'shrubs' else 0.45 -%}
          {%- set threshold_raw = available * root * depletion -%}
          {%- set threshold = (min_dose_mm | float(3)) if threshold_raw < (min_dose_mm | float(3)) else threshold_raw -%}
          {%- set deficit = deficits[zone.number - 1] | float(0) if deficits | count >= zone.number else 0 -%}
          {%- set daily = (reference_et_mm | float(3.5)) * kc -%}
          {%- set days = 0 if deficit >= threshold else (threshold - deficit) / daily if daily > 0 else 999 -%}
          {%- if days < ns.days -%}{%- set ns.days = days -%}{%- endif -%}
          {%- set ns.found = true -%}
        {%- endfor -%}
        {%- set candidate = as_timestamp(now()) + (ns.days if ns.found else 1) * 86400 -%}
        {%- if schedule_mode == 'fixed_time' -%}
          {%- set scheduled = as_timestamp(today_at(primary_start_time)) -%}
        {%- else -%}
          {%- set attr = 'next_rising' if schedule_mode == 'sunrise' else 'next_setting' -%}
          {%- set scheduled = as_timestamp(state_attr('sun.sun', attr), as_timestamp(now())) + (sun_event_offset_minutes | int(0)) * 60 -%}
        {%- endif -%}
        {%- set ns_day = namespace(offset=0) -%}
        {%- if scheduled <= as_timestamp(now()) -%}{%- set ns_day.offset = 1 -%}{%- set scheduled = scheduled + 86400 -%}{%- endif -%}
        {%- if scheduled < candidate -%}
          {%- set add_days = ((candidate - scheduled) / 86400) | round(0, 'ceil') | int -%}
          {%- set ns_day.offset = ns_day.offset + add_days -%}
          {%- set scheduled = scheduled + add_days * 86400 -%}
        {%- endif -%}
        {%- if schedule_mode == 'fixed_time' -%}
          {%- set scheduled = as_timestamp(today_at(primary_start_time) + timedelta(days=ns_day.offset)) -%}
        {%- endif -%}
        {{ scheduled | int }}

  - alias: Zapisz termin po zakończonym cyklu
    choose:
      - conditions:
          - condition: template
            value_template: "{{ (water_balance_enabled | bool) and next_watering_datetime | default('', true) | length > 0 }}"
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ next_watering_datetime }}"
            data:
              timestamp: "{{ next_watering_after_cycle_timestamp | int }}"
  - alias: Zaloguj koniec cyklu
    choose:
      - conditions:
          - condition: template
            value_template: "{{ enable_irrigation_logs | bool }}"
        sequence:
          - action: logbook.log
            data:
              name: Inteligentne podlewanie
              message: "Zakończono cykl sprawdzania sekcji podlewania."

  - alias: Wylicz podsumowanie cyklu
    variables:
      irrigation_cycle_summary: |-
        {%- set zones = [
          {'number': 1, 'valve': zone_1_valve, 'name': zone_1_name, 'soil_type': zone_1_soil_type, 'plant_type': zone_1_plant_type, 'sprinkler_profile': zone_1_sprinkler_profile, 'custom_rate_mm_h': zone_1_custom_rate_mm_h, 'runtime_adjustment_percent': zone_1_runtime_adjustment_percent, 'online_sensor': zone_1_online_sensor, 'battery_sensor': zone_1_battery_sensor},
          {'number': 2, 'valve': zone_2_valve, 'name': zone_2_name, 'soil_type': zone_2_soil_type, 'plant_type': zone_2_plant_type, 'sprinkler_profile': zone_2_sprinkler_profile, 'custom_rate_mm_h': zone_2_custom_rate_mm_h, 'runtime_adjustment_percent': zone_2_runtime_adjustment_percent, 'online_sensor': zone_2_online_sensor, 'battery_sensor': zone_2_battery_sensor},
          {'number': 3, 'valve': zone_3_valve, 'name': zone_3_name, 'soil_type': zone_3_soil_type, 'plant_type': zone_3_plant_type, 'sprinkler_profile': zone_3_sprinkler_profile, 'custom_rate_mm_h': zone_3_custom_rate_mm_h, 'runtime_adjustment_percent': zone_3_runtime_adjustment_percent, 'online_sensor': zone_3_online_sensor, 'battery_sensor': zone_3_battery_sensor},
          {'number': 4, 'valve': zone_4_valve, 'name': zone_4_name, 'soil_type': zone_4_soil_type, 'plant_type': zone_4_plant_type, 'sprinkler_profile': zone_4_sprinkler_profile, 'custom_rate_mm_h': zone_4_custom_rate_mm_h, 'runtime_adjustment_percent': zone_4_runtime_adjustment_percent, 'online_sensor': zone_4_online_sensor, 'battery_sensor': zone_4_battery_sensor},
          {'number': 5, 'valve': zone_5_valve, 'name': zone_5_name, 'soil_type': zone_5_soil_type, 'plant_type': zone_5_plant_type, 'sprinkler_profile': zone_5_sprinkler_profile, 'custom_rate_mm_h': zone_5_custom_rate_mm_h, 'runtime_adjustment_percent': zone_5_runtime_adjustment_percent, 'online_sensor': zone_5_online_sensor, 'battery_sensor': zone_5_battery_sensor},
          {'number': 6, 'valve': zone_6_valve, 'name': zone_6_name, 'soil_type': zone_6_soil_type, 'plant_type': zone_6_plant_type, 'sprinkler_profile': zone_6_sprinkler_profile, 'custom_rate_mm_h': zone_6_custom_rate_mm_h, 'runtime_adjustment_percent': zone_6_runtime_adjustment_percent, 'online_sensor': zone_6_online_sensor, 'battery_sensor': zone_6_battery_sensor},
          {'number': 7, 'valve': zone_7_valve, 'name': zone_7_name, 'soil_type': zone_7_soil_type, 'plant_type': zone_7_plant_type, 'sprinkler_profile': zone_7_sprinkler_profile, 'custom_rate_mm_h': zone_7_custom_rate_mm_h, 'runtime_adjustment_percent': zone_7_runtime_adjustment_percent, 'online_sensor': zone_7_online_sensor, 'battery_sensor': zone_7_battery_sensor},
          {'number': 8, 'valve': zone_8_valve, 'name': zone_8_name, 'soil_type': zone_8_soil_type, 'plant_type': zone_8_plant_type, 'sprinkler_profile': zone_8_sprinkler_profile, 'custom_rate_mm_h': zone_8_custom_rate_mm_h, 'runtime_adjustment_percent': zone_8_runtime_adjustment_percent, 'online_sensor': zone_8_online_sensor, 'battery_sensor': zone_8_battery_sensor},
          {'number': 9, 'valve': zone_9_valve, 'name': zone_9_name, 'soil_type': zone_9_soil_type, 'plant_type': zone_9_plant_type, 'sprinkler_profile': zone_9_sprinkler_profile, 'custom_rate_mm_h': zone_9_custom_rate_mm_h, 'runtime_adjustment_percent': zone_9_runtime_adjustment_percent, 'online_sensor': zone_9_online_sensor, 'battery_sensor': zone_9_battery_sensor},
          {'number': 10, 'valve': zone_10_valve, 'name': zone_10_name, 'soil_type': zone_10_soil_type, 'plant_type': zone_10_plant_type, 'sprinkler_profile': zone_10_sprinkler_profile, 'custom_rate_mm_h': zone_10_custom_rate_mm_h, 'runtime_adjustment_percent': zone_10_runtime_adjustment_percent, 'online_sensor': zone_10_online_sensor, 'battery_sensor': zone_10_battery_sensor},
          {'number': 11, 'valve': zone_11_valve, 'name': zone_11_name, 'soil_type': zone_11_soil_type, 'plant_type': zone_11_plant_type, 'sprinkler_profile': zone_11_sprinkler_profile, 'custom_rate_mm_h': zone_11_custom_rate_mm_h, 'runtime_adjustment_percent': zone_11_runtime_adjustment_percent, 'online_sensor': zone_11_online_sensor, 'battery_sensor': zone_11_battery_sensor},
          {'number': 12, 'valve': zone_12_valve, 'name': zone_12_name, 'soil_type': zone_12_soil_type, 'plant_type': zone_12_plant_type, 'sprinkler_profile': zone_12_sprinkler_profile, 'custom_rate_mm_h': zone_12_custom_rate_mm_h, 'runtime_adjustment_percent': zone_12_runtime_adjustment_percent, 'online_sensor': zone_12_online_sensor, 'battery_sensor': zone_12_battery_sensor}
        ] -%}
        {%- set ns = namespace(lines=[], watered=0, skipped=0, total=0) -%}
        {%- for zone in zones if (zone.number | int) <= (zone_count | int(1)) -%}
          {%- set soil = zone.soil_type -%}
          {%- set available_water_mm_m = 55 if soil == 'sand' else 115 if soil == 'sandy_loam' else 170 if soil == 'humus' else 180 if soil == 'chernozem' else 155 if soil == 'clay_loam' else 120 if soil == 'clay' else 150 -%}
          {%- set plant = zone.plant_type -%}
          {%- set crop_coefficient = 0.8 if plant == 'flowers' else 1.0 if plant == 'vegetables' else 0.55 if plant == 'shrubs' else 0.75 -%}
          {%- set root_depth_m = 0.25 if plant == 'flowers' else 0.35 if plant == 'vegetables' else 0.5 if plant == 'shrubs' else 0.2 -%}
          {%- set allowed_depletion = 0.4 if plant == 'flowers' else 0.35 if plant == 'vegetables' else 0.55 if plant == 'shrubs' else 0.45 -%}
          {%- set profile = zone.sprinkler_profile -%}
          {%- set rate = 12 if profile in ['rainbird_rotor', 'rainbird_5000_rotor'] else 38 if profile in ['rainbird_spray', 'rainbird_1800_spray'] else 15 if profile == 'rainbird_rvan' else 8 if profile in ['rainbird_drip', 'rainbird_xf_drip'] else 11 if profile == 'hunter_rotor' else 10 if profile == 'hunter_mp_rotator' else 40 if profile == 'hunter_spray' else 8 if profile == 'hunter_drip' else (zone.custom_rate_mm_h | float(12)) -%}
          {%- set valve = zone.valve | default('', true) -%}
          {%- set last_completed = state_attr(valve, 'last_run_completed') | default('', true) -%}
          {%- set last_ts = as_timestamp(last_completed, 0) -%}
          {%- set elapsed_days = ((as_timestamp(now()) - last_ts) / 86400) if last_ts > 0 else 0 -%}
          {%- set target_raw = available_water_mm_m * root_depth_m * allowed_depletion -%}
          {%- set target = (min_dose_mm | float(3)) if target_raw < (min_dose_mm | float(3)) else target_raw -%}
          {%- set effective_rate = (rate | float(12)) * (irrigation_efficiency_percent | float(75)) / 100 -%}
          {%- set previous_duration = state_attr(valve, 'last_duration_minutes') -%}
          {%- set delivered = (previous_duration | float(0)) * effective_rate / 60 if last_ts > 0 and previous_duration | is_number else target -%}
          {%- set carryover = target - delivered if last_ts > 0 and delivered < target else 0 -%}
          {%- set fallback_raw = carryover + (reference_et_mm | float(3.5)) * crop_coefficient * elapsed_days - (rain_credit_mm | float(0)) -%}
          {%- set fallback_deficit = 0 if fallback_raw < 0 else fallback_raw -%}
          {%- set current_balance = states(water_balance_helper) | from_json({}) if (water_balance_enabled | bool) else {} -%}
          {%- set current_deficits = current_balance.get('z', water_balance_deficits) if current_balance is mapping else water_balance_deficits -%}
          {%- set deficit = (current_deficits[zone.number - 1] | float(0)) if (water_balance_enabled | bool) else fallback_deficit -%}
          {%- set planned_depth = deficit if deficit > target else target -%}
          {%- set depth = 0 if not (irrigation_cycle_needed | bool) else (max_dose_mm | float(10)) if planned_depth > (max_dose_mm | float(10)) else (planned_depth | round(1)) -%}
          {%- set raw_minutes = ((depth | float(0)) / (effective_rate if effective_rate > 0 else 1)) * 60 * (zone.runtime_adjustment_percent | float(100)) / 100 -%}
          {%- set rounded_minutes = raw_minutes | round(0) | int -%}
          {%- set minutes = 0 if (depth | float(0)) < (min_dose_mm | float(3)) else (min_runtime_minutes | int(8)) if rounded_minutes < (min_runtime_minutes | int(8)) else (max_runtime_minutes | int(45)) if rounded_minutes > (max_runtime_minutes | int(45)) else rounded_minutes -%}
          {%- set record = watered_sections | selectattr('n', 'eq', zone.number | int) | list | first | default(none) -%}
          {%- set completed_this_cycle = record is not none -%}
          {%- set actual_minutes = record.min | float(minutes) if completed_this_cycle else 0 -%}
          {%- set actual_depth = record.mm | float(0) if completed_this_cycle else 0 -%}
          {%- set conn = namespace(entity='') -%}
          {%- if valve in integration_entities('rainbird_rc2') -%}
            {%- set entry_id = config_entry_id(valve) -%}
            {%- for entity in integration_entities('rainbird_rc2') -%}
              {%- if entity.startswith('binary_sensor.') and config_entry_id(entity) == entry_id and state_attr(entity, 'device_class') == 'connectivity' -%}
                {%- set conn.entity = entity -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {%- set controller_ready = (conn.entity | length == 0) or is_state(conn.entity, 'on') -%}
          {%- set online = zone.online_sensor | default('', true) -%}
          {%- set battery = zone.battery_sensor | default('', true) -%}
          {%- set rain_active = not (rain_sensor_ok | bool) -%}
          {%- set weather_bad = states(current_weather_entity) in bad_weather_states or states(current_weather_entity) in ['unknown', 'unavailable'] -%}
          {%- set ready = valve | length > 0 and controller_ready and not rain_active and not weather_bad and states(valve) in ['closed', 'off', 'idle'] and (online | length == 0 or is_state(online, 'on')) and (battery | length == 0 or (states(battery) | float(0)) >= (min_battery_percent | float(20))) -%}
          {%- if completed_this_cycle -%}
            {%- set ns.watered = ns.watered + 1 -%}
            {%- set ns.total = ns.total + (actual_minutes | round(0) | int) -%}
            {%- set ns.lines = ns.lines + ['| Sekcja ' ~ zone.number ~ ' (' ~ (zone.name | replace('|', '/')) ~ ') | Podlano | ' ~ (actual_minutes | round(1)) ~ ' min, ok. ' ~ (actual_depth | round(1)) ~ ' mm |'] -%}
          {%- else -%}
            {%- if (cycle_aborted | bool) and (zone.number | int) == (cycle_abort_section | int) -%}
              {%- set reason = 'sterownik nie potwierdził otwarcia w ciągu 60 s; sekcja została zamknięta' -%}
            {%- elif (cycle_aborted | bool) and (zone.number | int) > (cycle_abort_section | int) -%}
              {%- set reason = 'nie uruchomiono, bo cykl przerwano po błędzie startu sekcji ' ~ cycle_abort_section -%}
            {%- elif valve | length == 0 -%}
              {%- set reason = 'brak encji sekcji' -%}
            {%- elif not controller_ready -%}
              {%- set reason = 'sterownik Rain Bird RC2 offline/shutdown, ' ~ conn.entity ~ ' ma stan ' ~ states(conn.entity) -%}
            {%- elif rain_active -%}
              {%- if (rain_binary_sensor | default('', true) | length > 0) and is_state(rain_binary_sensor, 'on') -%}
                {%- set reason = 'czujnik deszczu jest aktywny: ' ~ rain_binary_sensor ~ ' ma stan ' ~ states(rain_binary_sensor) -%}
              {%- else -%}
                {%- set reason = 'czujnik deszczu ' ~ rain_binary_sensor ~ ' jest niedostępny: ' ~ states(rain_binary_sensor) -%}
              {%- endif -%}
            {%- elif states(current_weather_entity) in bad_weather_states -%}
              {%- set reason = 'pogoda blokuje podlewanie: ' ~ current_weather_condition_pl -%}
            {%- elif states(current_weather_entity) in ['unknown', 'unavailable'] -%}
              {%- set reason = 'dane pogodowe są niedostępne: ' ~ states(current_weather_entity) -%}
            {%- elif states(valve) not in ['closed', 'off', 'idle'] -%}
              {%- set reason = 'sekcja nie była gotowa, stan: ' ~ states(valve) -%}
            {%- elif online | length > 0 and not is_state(online, 'on') -%}
              {%- set reason = 'sensor online ma stan ' ~ states(online) -%}
            {%- elif battery | length > 0 and (states(battery) | float(0)) < (min_battery_percent | float(20)) -%}
              {%- set reason = 'bateria ' ~ states(battery) ~ '%, minimum ' ~ min_battery_percent ~ '%' -%}
            {%- elif (minutes | int(0)) <= 0 -%}
              {%- set reason = 'brak wyliczonego czasu pracy sekcji mimo zaplanowanego cyklu' -%}
            {%- elif ready -%}
              {%- set reason = 'sekcja wymagała podlewania, ale cykl nie został potwierdzony' -%}
            {%- else -%}
              {%- set reason = 'warunki sekcji nie pozwoliły na start' -%}
            {%- endif -%}
            {%- set ns.skipped = ns.skipped + 1 -%}
            {%- set ns.lines = ns.lines + ['| Sekcja ' ~ zone.number ~ ' (' ~ (zone.name | replace('|', '/')) ~ ') | Pominięto | ' ~ (reason | replace('|', '/')) ~ ' |'] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- if (cycle_aborted | bool) and ns.watered > 0 -%}
          {%- set status = 'zakończono podlewanie przed czasem' -%}
        {%- elif cycle_aborted | bool -%}
          {%- set status = 'nie udało się rozpocząć podlewania' -%}
        {%- elif ns.watered > 0 -%}
          {%- set status = 'zakończono podlewanie' -%}
        {%- else -%}
          {%- set status = 'pominięto podlewanie' -%}
        {%- endif %}
        **Status:** {{ status }}
        {%- if cycle_aborted | bool %}

        **Uwaga**
        Cykl przerwano: {{ cycle_abort_note | trim }}
        {%- endif %}

        **Podsumowanie**
        - Podlano sekcji: {{ ns.watered }}
        - Pominięto sekcji: {{ ns.skipped }}
        - Łączny czas: {{ ns.total }} min

        **Pogoda**
        - Źródło: {{ weather_source_summary | trim }}
        - Aktualnie: {{ current_weather_condition_pl }}
        - Prognoza: {{ forecast_condition_pl }}
        - {{ rain_summary_line | trim }}
        {% if rain_measurement_warning | trim | length > 0 %}- Uwaga: {{ rain_measurement_warning | trim }}{% endif %}
        - Opad ({{ forecast_window_label }}): {{ forecast_precipitation | float(0) | round(1) }} mm
        - Szansa deszczu: {{ forecast_precipitation_probability | int(0) }}%
        - Temperatura: {{ temp_c | float(0) | round(1) }} C
        - Wiatr: {{ wind_value | float(0) | round(1) }}

        **Sekcje**

        | Sekcja | Wynik | Szczegóły |
        | --- | --- | --- |
        {{ ns.lines | join('\n') }}

  - alias: Powiadom o końcu cyklu
    choose:
      - conditions:
          - condition: template
            value_template: "{{ create_persistent_notification | bool }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: Inteligentne podlewanie
              message: |-
                {{ irrigation_cycle_summary | trim }}
              notification_id: smart_irrigation_last_event
