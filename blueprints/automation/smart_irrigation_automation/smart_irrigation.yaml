          default: loam
          selector:
            select:
              mode: dropdown
              options:
                - label: Piaszczysta / bardzo lekka
                  value: sand
                - label: Lekka ogrodowa
                  value: sandy_loam
                - label: Zwykła ziemia ogrodowa
                  value: loam
                - label: Humusowa / próchniczna
                  value: humus
                - label: Czarnoziem / czarna ziemia
                  value: chernozem
                - label: Gliniasta / ciężka
                  value: clay_loam
                - label: Bardzo ciężka / zbita glina
                  value: clay
        zone_9_plant_type:
          name: Sekcja 9 - co rośnie
          description: Określa bazowe zapotrzebowanie na wodę. Warzywa najwięcej, trawa średnio, krzewy zwykle mniej.
          default: grass
          selector:
            select:
              mode: dropdown
              options:
                - label: Trawa
                  value: grass
                - label: Kwiaty
                  value: flowers
                - label: Warzywa
                  value: vegetables
                - label: Krzewy
                  value: shrubs
        zone_9_sprinkler_profile:
          name: Sekcja 9 - zraszacze
          description: Profil ustawia opad instalacji w mm/h. Im większy opad zraszaczy, tym krótszy wyliczony czas podlewania.
          default: rainbird_rotor
          selector:
            select:
              mode: dropdown
              options:
                - label: Rain Bird 5000/3500 - rotory
                  value: rainbird_5000_rotor
                - label: Rain Bird 1800 - spray/statyczne
                  value: rainbird_1800_spray
                - label: Rain Bird R-VAN - dysze rotacyjne
                  value: rainbird_rvan
                - label: Rain Bird XF - linia kroplująca
                  value: rainbird_xf_drip
                - label: Rain Bird - rotory ogólne
                  value: rainbird_rotor
                - label: Rain Bird - spray ogólny
                  value: rainbird_spray
                - label: Rain Bird - linia kroplująca ogólna
                  value: rainbird_drip
                - label: Hunter - rotory
                  value: hunter_rotor
                - label: Hunter - MP Rotator
                  value: hunter_mp_rotator
                - label: Hunter - spray/statyczne
                  value: hunter_spray
                - label: Hunter - linia kroplująca
                  value: hunter_drip
                - label: Własny opad zraszaczy
                  value: custom
        zone_9_custom_rate_mm_h:
          name: Sekcja 9 - własny opad zraszaczy
          description: Używane tylko przy profilu "Własny opad zraszaczy". Wpisz rzeczywisty opad sekcji w mm/h, jeżeli znasz go z testu kubeczkowego albo dokumentacji.
          default: 12
          selector:
            number:
              min: 1
              max: 80
              step: 0.5
              unit_of_measurement: mm/h
              mode: box
        zone_9_runtime_adjustment_percent:
          name: Sekcja 9 - korekta czasu
          description: Ręczna korekta czasu pracy tej sekcji. 100% = bez zmian, więcej wydłuża podlewanie, mniej skraca. Bilans wody odejmuje wodę faktycznie podaną, więc korekta zmienia ilość wody w jednym podlewaniu, a nie łączną ilość wody - krótsze podlewanie będzie częstsze, dłuższe rzadsze.
          default: 100
          selector:
            number:
              min: 50
              max: 180
              step: 5
              unit_of_measurement: "%"
              mode: slider
