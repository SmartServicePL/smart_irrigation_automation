blueprint:
  name: Inteligentne podlewanie ogrodu - 1 do 12 sekcji
  description: >
    Wersja 1.10.0. Uniwersalny blueprint podlewania od 1 do 12 sekcji. Obsługuje instalacje
    Rain Bird RC2 oraz układy mieszane z dodatkowymi zaworami lub przekaźnikami
    Sonoff, Shelly i ESPHome. Pogoda pochodzi z prognozy Home Assistant, a stacja
    pogodowa jest opcjonalna. Dla każdej sekcji osobno ustawiasz nazwę, encję sekcji, rodzaj
    gleby, co rośnie, typ zraszaczy Rain Bird/Hunter, korektę czasu oraz
    opcjonalne sensory online/baterii. Zamknięcie każdej sekcji jest potwierdzane
    i ponawiane, a po restarcie HA otwarte sekcje switch/valve są zamykane.
    Zwykłe przekaźniki warto dodatkowo zabezpieczyć sprzętowym limitem czasu
    (Shelly "Auto OFF", Sonoff "Inching", ESPHome on_turn_on + delay).
  domain: automation
  author: Smart Service
  homeassistant:
    min_version: 2025.4.0
  source_url: https://github.com/SmartServicePL/smart_irrigation_automation/blob/main/blueprints/automation/smart_irrigation_automation/smart_irrigation.yaml
  input:
    weather_section:
      name: Wspólne encje pogody i sensory
      icon: mdi:weather-partly-rainy
      input:
        forecast_weather_entity:
          name: Encja pogody do prognozy
          description: Encja pogody z Home Assistant z prognozą dzienną (np. Met.no, OpenWeatherMap). Daje prognozę opadu, szansę deszczu i warunki pogodowe, a bez stacji pogodowej także aktualną temperaturę, wiatr i UV.
          selector:
            entity:
              filter:
                - domain: weather

    local_weather_overrides_section:
      name: Stacja pogodowa i czujniki (opcjonalnie)
      icon: mdi:weather-partly-rainy
      input:
        current_weather_entity:
          name: Lokalna encja pogody
          description: Opcjonalne nadpisanie aktualnego stanu pogody. Puste = użyj głównej encji prognozy.
          default: ""
          selector:
            entity:
              filter:
                - domain: weather
        rain_binary_sensor:
          name: Czujnik deszczu
          description: Opcjonalny czujnik fizycznego deszczu. Gdy ma stan on, podlewanie nie wystartuje albo zostanie przerwane. Gdy jest niedostępny, podlewanie jest wstrzymane dla bezpieczeństwa.
          default: ""
          selector:
            entity:
              filter:
                - domain: binary_sensor
        rain_amount_sensor:
          name: Opad zmierzony - najlepiej ostatnie 24 h
          description: Sensor opadu w mm. Najlepszy jest opad kroczący z ostatnich 24 h albo suma trwającego zdarzenia deszczowego; sensor tylko dzienny może pominąć deszcz po północy. Wartość jest odejmowana od bilansu. Bez tego sensora opad do bilansu jest szacowany z prognozy dziennej encji pogody (raz na dobę, oznaczony w powiadomieniach jako szacunek z prognozy). Gdy sensor jest chwilowo niedostępny, bilans nie zmienia zapamiętanego opadu.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        temperature_source_entity:
          name: Temperatura ogrodu
          description: Opcjonalny sensor temperatury w ogrodzie albo encja weather. Puste = użyj głównej encji pogody. Niska temperatura blokuje podlewanie, upał zwiększa dawkę. Gdy wybrany sensor jest niedostępny, używana jest aktualna temperatura z encji pogody; bez żadnej aktualnej temperatury podlewanie jest wstrzymane. Temperatura w °F jest automatycznie przeliczana na °C.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        wind_source_entity:
          name: Wiatr
          description: Opcjonalny sensor wiatru albo encja weather. Puste = użyj głównej encji pogody. Zbyt mocny wiatr blokuje podlewanie, bo zraszacze traciłyby równomierność. Gdy wybrany sensor jest niedostępny, używany jest wiatr z encji pogody; jeśli i tam go brakuje, podlewanie jest wstrzymane.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        sunlight_source_entity:
          name: UV / słońce
          description: Opcjonalny sensor UV/słońca albo weather z uv_index. Puste = użyj głównej encji weather. Używany do awaryjnego szacowania ewapotranspiracji, gdy ET0 nie jest dostępne.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        reference_et_sensor:
          name: Dzienne ET0 / ewapotranspiracja
          description: Opcjonalny sensor dziennej referencyjnej ewapotranspiracji w mm. Puste = ET0 jest szacowane z temperatury, UV i wiatru.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        soil_moisture_sensor:
          name: Wilgotność gleby
          description: Opcjonalny, reprezentatywny sensor wilgotności gleby w procentach. Działa jako bezpośrednia blokada podlewania po osiągnięciu progu ustawionego w sekcji blokad pogodowych.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    general_section:
      name: Ustawienia ogólne
      icon: mdi:tune
      input:
        zone_count:
          name: Liczba sekcji
          description: Ile sekcji ma obsługiwać ta automatyzacja. Sekcje powyżej tej liczby zostają w konfiguracji, ale są ignorowane.
          default: 1
          selector:
            number:
              min: 1
              max: 12
              step: 1
              mode: slider
        send_runtime_to_switch:
          name: Przekazuj wyliczony czas do sterownika Rain Bird
          description: Dla Rain Bird RC2 automatyzacja zawsze używa rainbird_rc2.start_zone. To ustawienie włącza przekazywanie czasu do starszej integracji Rain Bird przez rainbird.start_irrigation. Nie zmienia obsługi Sonoff, Shelly, ESPHome ani innych zwykłych encji switch/valve.
          default: true
          selector:
            boolean:
        valve_runtime_watchdog:
          name: Nadzór czasu pracy sekcji
          description: Zalecane. Zamyka sekcję switch/valve tej automatyzacji (poza Rain Bird RC2 i Rain Bird, które mają własny limit czasu w sterowniku), jeśli jest włączona dłużej niż maksymalny czas sekcji + 5 min, niezależnie od tego, kto ją włączył. Chroni przed zalaniem po przerwanym przebiegu. Wyłącz tylko wtedy, gdy celowo podlewasz ręcznie dłużej niż ten limit.
          default: true
          selector:
            boolean:

    zone_1_section:
      name: Sekcja 1
      icon: mdi:sprinkler-variant
      input:
        zone_1_valve:
          name: Sekcja 1 - encja
          description: "Encja sekcji Rain Bird RC2 albo dowolna encja valve/switch, np. Sonoff, Shelly lub ESPHome. Automatyzacja uruchomi sekcję na wyliczony czas i zatrzyma ją po zakończeniu."
          selector:
            entity:
              filter:
                - domain: valve
                - domain: switch
        zone_1_name:
          name: Sekcja 1 - nazwa
          description: Czytelna nazwa sekcji widoczna w śladach automatyzacji i ułatwiająca rozpoznanie obszaru podlewania.
          default: Sekcja 1
          selector:
            text:
        zone_1_soil_type:
          name: Sekcja 1 - rodzaj gleby
          description: Wybierz najbliższy opis ziemi w ogrodzie. Lekkie gleby szybciej tracą wodę, a humus i czarnoziem dłużej ją magazynują.
          default: loam
          selector:
            select:
              mode: dropdown
              options:
                - label: Piaszczysta / bardzo lekka
                  value: sand
                - label: Lekka ogrodowa
                  value: sandy_loam
                - label: Zwykła ziemia ogrodowa
                  value: loam
                - label: Humusowa / próchniczna
                  value: humus
                - label: Czarnoziem / czarna ziemia
                  value: chernozem
                - label: Gliniasta / ciężka
                  value: clay_loam
                - label: Bardzo ciężka / zbita glina
                  value: clay
        zone_1_plant_type:
          name: Sekcja 1 - co rośnie
          description: Określa bazowe zapotrzebowanie na wodę. Warzywa najwięcej, trawa średnio, krzewy zwykle mniej.
          default: grass
          selector:
            select:
              mode: dropdown
              options:
                - label: Trawa
                  value: grass
                - label: Kwiaty
                  value: flowers
                - label: Warzywa
                  value: vegetables
                - label: Krzewy
                  value: shrubs
        zone_1_sprinkler_profile:
          name: Sekcja 1 - zraszacze
          description: Profil ustawia opad instalacji w mm/h. Im większy opad zraszaczy, tym krótszy wyliczony czas podlewania.
          default: rainbird_rotor
          selector:
            select:
              mode: dropdown
              options:
                - label: Rain Bird 5000/3500 - rotory
                  value: rainbird_5000_rotor
                - label: Rain Bird 1800 - spray/statyczne
                  value: rainbird_1800_spray
                - label: Rain Bird R-VAN - dysze rotacyjne
                  value: rainbird_rvan
                - label: Rain Bird XF - linia kroplująca
                  value: rainbird_xf_drip
                - label: Rain Bird - rotory ogólne
                  value: rainbird_rotor
                - label: Rain Bird - spray ogólny
                  value: rainbird_spray
                - label: Rain Bird - linia kroplująca ogólna
                  value: rainbird_drip
                - label: Hunter - rotory
                  value: hunter_rotor
                - label: Hunter - MP Rotator
                  value: hunter_mp_rotator
                - label: Hunter - spray/statyczne
                  value: hunter_spray
                - label: Hunter - linia kroplująca
                  value: hunter_drip
                - label: Własny opad zraszaczy
                  value: custom
        zone_1_custom_rate_mm_h:
          name: Sekcja 1 - własny opad zraszaczy
          description: Używane tylko przy profilu "Własny opad zraszaczy". Wpisz rzeczywisty opad sekcji w mm/h, jeżeli znasz go z testu kubeczkowego albo dokumentacji.
          default: 12
          selector:
            number:
              min: 1
              max: 80
              step: 0.5
              unit_of_measurement: mm/h
              mode: box
        zone_1_runtime_adjustment_percent:
          name: Sekcja 1 - korekta czasu
          description: Ręczna korekta czasu pracy tej sekcji. 100% = bez zmian, więcej wydłuża podlewanie, mniej skraca. Bilans wody odejmuje wodę faktycznie podaną, więc korekta zmienia ilość wody w jednym podlewaniu, a nie łączną ilość wody - krótsze podlewanie będzie częstsze, dłuższe rzadsze.
          default: 100
          selector:
            number:
              min: 50
              max: 180
              step: 5
              unit_of_measurement: "%"
              mode: slider
        zone_1_online_sensor:
          name: Sekcja 1 - online
          description: Opcjonalny binary_sensor online. Jeśli jest ustawiony i ma stan off, sekcja zostanie pominięta.
          default: ""
          selector:
            entity:
              filter:
                - domain: binary_sensor
        zone_1_battery_sensor:
          name: Sekcja 1 - bateria
          description: Opcjonalny sensor baterii sekcji. Sekcja zostanie pominięta, gdy bateria spadnie poniżej progu z blokad pogodowych.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

