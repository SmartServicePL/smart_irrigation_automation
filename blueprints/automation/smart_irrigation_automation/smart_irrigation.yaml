    schedule_section:
      name: Harmonogram, sezon i progi
      icon: mdi:calendar-clock
      input:
        schedule_mode:
          name: Start podlewania
          description: Stała godzina używa godzin poniżej. Tryb słońca startuje podlewanie względem wschodu albo zachodu.
          default: fixed_time
          selector:
            select:
              mode: dropdown
              options:
                - label: Stała godzina
                  value: fixed_time
                - label: Względem wschodu słońca
                  value: sunrise
                - label: Względem zachodu słońca
                  value: sunset
        sun_event_offset_minutes:
          name: Przesunięcie względem słońca
          description: Minuty względem wschodu/zachodu. Wartość ujemna = przed, dodatnia = po.
          default: -30
          selector:
            number:
              min: -180
              max: 180
              step: 5
              unit_of_measurement: min
              mode: slider
        primary_start_time:
          name: Główna godzina podlewania
          description: Używana tylko przy trybie "Stała godzina".
          default: "04:30:00"
          selector:
            time:
        backup_start_time:
          name: Awaryjny start po pominiętej godzinie
          description: Używany tylko przy stałej godzinie, gdy HA nie wykonał głównego startu. Wymaga helpera następnego podlewania. Nie wykonuje drugiej decyzji po prawidłowej głównej próbie.
          default: "05:30:00"
          selector:
            time:
        enable_backup_time:
          name: Włącz awaryjny start
          description: Dotyczy tylko stałej godziny i wymaga helpera następnego podlewania. Zapobiega utracie cyklu po restarcie HA, ale nie tworzy drugiego komunikatu tego samego dnia.
          default: false
          selector:
            boolean:
        enable_condition_checks:
          name: Włącz dodatkowe przeliczenia
          description: O tych godzinach automatyzacja realnie pobiera pogodę i przelicza potrzebę podlewania, ale nie otwiera sekcji. Aktualizuje helper następnego podlewania i opcjonalnie Logbook, bez powiadomień HA.
          default: true
          selector:
            boolean:
        condition_check_time_1:
          name: Sprawdzenie 1
          description: Godzina kontrolnego przeliczenia bez uruchamiania podlewania.
          default: "12:00:00"
          selector:
            time:
        condition_check_time_2:
          name: Sprawdzenie 2
          description: Godzina kontrolnego przeliczenia bez uruchamiania podlewania.
          default: "18:00:00"
          selector:
            time:
        condition_check_time_3:
          name: Sprawdzenie 3
          description: Godzina kontrolnego przeliczenia bez uruchamiania podlewania.
          default: "00:00:00"
          selector:
            time:
        condition_check_time_4:
          name: Sprawdzenie 4
          description: Godzina kontrolnego przeliczenia bez uruchamiania podlewania.
          default: "03:00:00"
          selector:
            time:
        season_start_month:
          name: Miesiąc startu sezonu
          description: Pierwszy miesiąc, w którym automatyzacja może podlewać. Poza sezonem sekcje nie są uruchamiane.
          default: 4
          selector:
            number:
              min: 1
              max: 12
              step: 1
              mode: slider
        season_end_month:
          name: Miesiąc końca sezonu
          description: Ostatni miesiąc sezonu podlewania. Przykład 4-10 oznacza podlewanie od kwietnia do października.
          default: 10
          selector:
            number:
              min: 1
              max: 12
              step: 1
              mode: slider
        min_dose_mm:
          name: Minimalna dawka do startu
          description: Jeśli wyliczona dawka dla sekcji jest mniejsza, sekcja zostanie pominięta. Chroni przed bezsensownymi, bardzo krótkimi cyklami.
          default: 3
          selector:
            number:
              min: 0.5
              max: 15
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        max_dose_mm:
          name: Maksymalna dawka jednego podlewania
          description: Górny limit wody na jedno podlewanie sekcji. Chroni przed przelaniem i zbyt długą pracą po kilku suchych dniach.
          default: 10
          selector:
            number:
              min: 3
              max: 30
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        min_runtime_minutes:
          name: Minimalny czas sekcji
          description: Najkrótszy czas pracy sekcji, jeśli podlewanie już wystartuje. Pomaga utrzymać stabilną pracę sekcji i instalacji.
          default: 8
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
              mode: slider
        max_runtime_minutes:
          name: Maksymalny czas sekcji
          description: Najdłuższy dopuszczalny czas pracy jednej sekcji w jednym cyklu. Ogranicza ryzyko zbyt długiego podlewania.
          default: 45
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
              mode: slider
        zone_pause_seconds:
          name: Przerwa między sekcjami
          description: Odstęp po zamknięciu jednej sekcji przed startem kolejnej. Daje instalacji czas na ustabilizowanie ciśnienia.
          default: 15
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: s
              mode: slider

    safety_section:
      name: Blokady pogodowe
      icon: mdi:shield-check
      collapsed: true
      input:
        max_forecast_rain_mm:
          name: Prognozowany deszcz blokujący
          description: Jeśli prognoza pokazuje co najmniej tyle mm deszczu, podlewanie zostanie pominięte.
          default: 4
          selector:
            number:
              min: 0
              max: 30
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        max_rain_probability_percent:
          name: Prawdopodobieństwo deszczu blokujące
          description: Podlewanie zostanie zablokowane, gdy szansa deszczu przekroczy ten próg i prognoza pokazuje co najmniej 1 mm opadu.
          default: 80
          selector:
            number:
              min: 30
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        rain_credit_percent:
          name: Ile deszczu odjąć od dawki
          description: Ile procent nowego deszczu zapisać jako wodę dostarczoną glebie - zmierzonego przez stację albo, bez stacji, szacowanego z prognozy na miniony dzień. Prognoza na dziś i jutro tylko odkłada start. 80% uwzględnia typowe straty.
          default: 80
          selector:
            number:
              min: 0
              max: 120
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_temperature_c:
          name: Minimalna temperatura
          description: Poniżej tej temperatury podlewanie nie wystartuje. Chroni rośliny i instalacje przy zimnych porankach.
          default: 8
          selector:
            number:
              min: -5
              max: 20
              step: 0.5
              unit_of_measurement: C
              mode: slider
        hot_temperature_c:
          name: Temperatura upału
          description: Od tej temperatury automatyzacja lekko zwiększa dawkę wody, bo parowanie jest większe.
          default: 28
          selector:
            number:
              min: 20
              max: 40
              step: 0.5
              unit_of_measurement: C
              mode: slider
        max_wind:
          name: Maksymalny wiatr
          description: Limit w km/h. Prędkość z encji w m/s, mph lub węzłach jest automatycznie przeliczana. Powyżej limitu podlewanie zostanie pominięte, żeby woda nie była znoszona poza sekcje.
          default: 35
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: km/h
              mode: slider
        min_battery_percent:
          name: Minimalna bateria sekcji
          description: Jeśli sekcja ma sensor baterii i bateria jest poniżej tego progu, sekcja zostanie pominięta.
          default: 20
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        soil_moisture_block_percent:
          name: Wilgotność gleby blokująca podlewanie
          description: Używane tylko po wybraniu sensora wilgotności gleby. Po osiągnięciu tego progu czujnik bezpośrednio blokuje cykl, tak jak profesjonalny sterownik oparty na wilgotności. Próg ustaw zgodnie z kalibracją swojego sensora.
          default: 70
          selector:
            number:
              min: 20
              max: 95
              step: 1
              unit_of_measurement: "%"
              mode: slider
        irrigation_efficiency_percent:
          name: Sprawność instalacji
          description: Uwzględnia straty instalacji, nierówny opad i parowanie. Niższa wartość wydłuża podlewanie; 70-85% jest typowe.
          default: 75
          selector:
            number:
              min: 40
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

    log_section:
      name: Logi podlewania
      icon: mdi:text-box-search
      collapsed: true
      input:
        enable_irrigation_logs:
          name: Włącz logbook.log
          description: Dodaje wpisy do Logbooka HA. Obejmuje start cyklu, pomijanie z powodem, start/koniec sekcji oraz przerwanie przez deszcz.
          default: false
          selector:
            boolean:
        create_persistent_notification:
          name: Twórz powiadomienie persistent_notification
          description: Pokazuje powiadomienia tylko przy starcie podlewania, końcu z czasem sekcji, pominięciu albo przerwaniu z krótkim powodem.
          default: false
          selector:
            boolean:
        next_watering_datetime:
          name: Helper - następne podlewanie
          description: Opcjonalny input_datetime z datą i godziną. Automatyzacja zapisze w nim szacowany termin następnego podlewania po każdym sprawdzeniu cyklu.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_datetime
        water_balance_helper:
          name: Helper - trwały bilans wody
          description: Zalecany input_text zapisujący bilans ET, deszczu (ze stacji albo szacunku z prognozy) i wykonanego podlewania osobno dla wszystkich sekcji. Utwórz helper Tekst z maksymalną długością 255 znaków. Gdy zapis nie mieściłby się w limicie helpera, podlewanie jest wstrzymane z czytelnym powodem. Bez helpera działa tryb zgodności oparty na historii pracy sekcji, która raportuje tylko Rain Bird RC2; przy sekcjach switch/valve helper jest wymagany.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_text

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  trigger_schedule_mode: !input schedule_mode
  trigger_sun_offset_minutes: !input sun_event_offset_minutes
  trigger_zone_count: !input zone_count
  trigger_max_runtime_minutes: !input max_runtime_minutes
  trigger_valve_watchdog: !input valve_runtime_watchdog
  trigger_valves:
    - !input zone_1_valve
    - !input zone_2_valve
    - !input zone_3_valve
    - !input zone_4_valve
    - !input zone_5_valve
    - !input zone_6_valve
    - !input zone_7_valve
    - !input zone_8_valve
    - !input zone_9_valve
    - !input zone_10_valve
    - !input zone_11_valve
    - !input zone_12_valve

triggers:
  - trigger: time
    id: primary
    at: !input primary_start_time
  - trigger: time
    id: backup
    at: !input backup_start_time
  - trigger: template
    id: sun_check
    value_template: >-
      {% if trigger_schedule_mode in ['sunrise', 'sunset'] %}
        {% set attr = 'next_rising' if trigger_schedule_mode == 'sunrise' else 'next_setting' %}
        {% set next_event = state_attr('sun.sun', attr) %}
        {% set next_ts = as_timestamp(next_event) if next_event is not none else 0 %}
        {% set now_ts = as_timestamp(now()) %}
        {% set offset = (trigger_sun_offset_minutes | int(0)) * 60 %}
        {% set window = 300 %}
        {% set target_next = next_ts + offset %}
        {% set target_previous = next_ts - 86400 + offset %}
        {{ next_ts > 0
           and ((now_ts >= target_next and now_ts < target_next + window)
                or (now_ts >= target_previous and now_ts < target_previous + window)) }}
      {% else %}
        false
      {% endif %}
  - trigger: time
    id: condition_check_1
    at: !input condition_check_time_1
  - trigger: time
    id: condition_check_2
    at: !input condition_check_time_2
  - trigger: time
    id: condition_check_3
    at: !input condition_check_time_3
  - trigger: time
    id: condition_check_4
    at: !input condition_check_time_4
  - trigger: homeassistant
    id: ha_start
    event: start
  - trigger: template
    id: valve_watchdog
    value_template: >-
      {% if trigger_valve_watchdog | bool %}
        {% set controller_timed = integration_entities('rainbird_rc2') + integration_entities('rainbird') %}
        {% set limit = ((trigger_max_runtime_minutes | int(45)) + 5) * 60 %}
        {% set watched = trigger_valves[:(trigger_zone_count | int(1))]
             | select('string') | reject('eq', '') | reject('in', controller_timed) | list %}
        {{ expand(watched)
           | selectattr('state', 'in', ['on', 'open', 'opening'])
           | selectattr('last_changed', 'lt', now() - timedelta(seconds=limit))
           | list | count > 0 }}
      {% else %}
        false
      {% endif %}

