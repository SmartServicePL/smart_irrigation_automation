    {% set now_ts = as_timestamp(now()) %}
    {% if schedule_mode == 'fixed_time' %}
      {% set first = as_timestamp(today_at(primary_start_time)) %}
      {% if first <= now_ts %}
        {% set first = as_timestamp(today_at(primary_start_time) + timedelta(days=1)) %}
      {% endif %}
      {{ first | int }}
    {% else %}
      {% set attr = 'next_rising' if schedule_mode == 'sunrise' else 'next_setting' %}
      {% set event = state_attr('sun.sun', attr) %}
      {% set first = (as_timestamp(event, now_ts) + (sun_event_offset_minutes | int(0)) * 60) %}
