          name: Sekcja 9 - online
          description: Opcjonalny binary_sensor online. Jeśli jest ustawiony i ma stan off, sekcja zostanie pominięta.
          default: ""
          selector:
            entity:
              filter:
                - domain: binary_sensor
        zone_9_battery_sensor:
          name: Sekcja 9 - bateria
          description: Opcjonalny sensor baterii sekcji. Sekcja zostanie pominięta, gdy bateria spadnie poniżej progu z blokad pogodowych.
