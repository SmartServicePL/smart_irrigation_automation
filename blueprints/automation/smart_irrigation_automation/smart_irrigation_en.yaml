          description: Optional online binary_sensor. If it is set and off, the section is skipped.
          default: ""
          selector:
            entity:
              filter:
                - domain: binary_sensor
        zone_11_battery_sensor:
          name: Section 11 - battery
          description: Optional battery sensor of the section. The section is skipped when the battery drops below the threshold from the weather blocks.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    zone_12_section:
      name: Section 12
      icon: mdi:sprinkler-variant
      collapsed: true
      input:
        zone_12_valve:
          name: Section 12 - entity
          description: "Rain Bird RC2 section entity or any valve/switch entity, e.g. Sonoff, Shelly or ESPHome. The automation runs the section for the calculated time and stops it afterwards."
          default: ""
          selector:
            entity:
              filter:
                - domain: valve
                - domain: switch
        zone_12_name:
          name: Section 12 - name
          description: Readable section name shown in automation traces that helps to recognise the watered area.
          default: Section 12
          selector:
            text:
        zone_12_soil_type:
          name: Section 12 - soil type
          description: Choose the closest description of the garden soil. Light soils lose water faster, humus and black soil store it longer.
          default: loam
          selector:
            select:
              mode: dropdown
              options:
                - label: Sandy / very light
                  value: sand
                - label: Light garden soil
                  value: sandy_loam
                - label: Normal garden soil
                  value: loam
                - label: Humus-rich / compost-rich
                  value: humus
                - label: Black soil / chernozem
                  value: chernozem
                - label: Clay loam / heavy
                  value: clay_loam
                - label: Very heavy / compacted clay
                  value: clay
        zone_12_plant_type:
          name: Section 12 - plants
          description: Sets the base water demand. Vegetables need the most, grass is average, shrubs usually need less.
          default: grass
          selector:
            select:
              mode: dropdown
              options:
                - label: Grass
                  value: grass
                - label: Flowers
                  value: flowers
                - label: Vegetables
                  value: vegetables
                - label: Shrubs
                  value: shrubs
        zone_12_sprinkler_profile:
          name: Section 12 - sprinklers
          description: The profile sets the precipitation rate of the installation in mm/h. The higher the sprinkler rate, the shorter the calculated runtime.
          default: rainbird_rotor
          selector:
            select:
              mode: dropdown
              options:
                - label: Rain Bird 5000/3500 - rotors
                  value: rainbird_5000_rotor
                - label: Rain Bird 1800 - spray/fixed
                  value: rainbird_1800_spray
                - label: Rain Bird R-VAN - rotary nozzles
                  value: rainbird_rvan
                - label: Rain Bird XF - dripline
                  value: rainbird_xf_drip
                - label: Rain Bird - generic rotors
                  value: rainbird_rotor
                - label: Rain Bird - generic spray
                  value: rainbird_spray
                - label: Rain Bird - generic dripline
                  value: rainbird_drip
                - label: Hunter - rotors
                  value: hunter_rotor
                - label: Hunter - MP Rotator
                  value: hunter_mp_rotator
                - label: Hunter - spray/fixed
                  value: hunter_spray
                - label: Hunter - dripline
                  value: hunter_drip
                - label: Custom sprinkler rate
                  value: custom
        zone_12_custom_rate_mm_h:
          name: Section 12 - custom sprinkler rate
          description: Used only with the "Custom sprinkler rate" profile. Enter the real precipitation rate of the section in mm/h if you know it from a catch-cup test or the documentation.
          default: 12
          selector:
            number:
              min: 1
              max: 80
              step: 0.5
              unit_of_measurement: mm/h
              mode: box
        zone_12_runtime_adjustment_percent:
          name: Section 12 - runtime adjustment
          description: Manual runtime adjustment for this section. 100% = no change, more makes watering longer, less makes it shorter. The water balance subtracts the water actually applied, so the adjustment changes the amount per watering, not the total amount of water - shorter runs will be more frequent, longer runs less frequent.
          default: 100
          selector:
            number:
              min: 50
              max: 180
              step: 5
              unit_of_measurement: "%"
              mode: slider
        zone_12_online_sensor:
          name: Section 12 - online
          description: Optional online binary_sensor. If it is set and off, the section is skipped.
          default: ""
          selector:
            entity:
              filter:
                - domain: binary_sensor
        zone_12_battery_sensor:
          name: Section 12 - battery
          description: Optional battery sensor of the section. The section is skipped when the battery drops below the threshold from the weather blocks.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    schedule_section:
      name: Schedule, season and thresholds
      icon: mdi:calendar-clock
      input:
        schedule_mode:
          name: Watering start
          description: Fixed time uses the times below. Sun mode starts watering relative to sunrise or sunset.
          default: fixed_time
          selector:
            select:
              mode: dropdown
              options:
                - label: Fixed time
                  value: fixed_time
                - label: Relative to sunrise
                  value: sunrise
                - label: Relative to sunset
                  value: sunset
        sun_event_offset_minutes:
          name: Sun offset
          description: Minutes relative to sunrise/sunset. Negative = before, positive = after.
          default: -30
          selector:
            number:
              min: -180
              max: 180
              step: 5
              unit_of_measurement: min
              mode: slider
        primary_start_time:
          name: Main watering time
          description: Used only with the "Fixed time" mode.
          default: "04:30:00"
          selector:
            time:
        backup_start_time:
          name: Recovery start after a missed main time
          description: Used only with a fixed time when HA missed the main start. Requires the next watering helper. It does not make a second decision after a successful main run.
          default: "05:30:00"
          selector:
            time:
        enable_backup_time:
          name: Enable recovery start
          description: Applies only to a fixed time and requires the next watering helper. Prevents losing a cycle after an HA restart but does not create a second message on the same day.
          default: false
          selector:
            boolean:
        enable_condition_checks:
          name: Enable additional recalculations
          description: At these times the automation fetches the weather and recalculates the watering need but does not open any section. It updates the next watering helper and optionally the Logbook, without HA notifications.
          default: true
          selector:
            boolean:
        condition_check_time_1:
          name: Check 1
          description: Time of a check recalculation without starting watering.
          default: "12:00:00"
          selector:
            time:
        condition_check_time_2:
          name: Check 2
          description: Time of a check recalculation without starting watering.
          default: "18:00:00"
          selector:
            time:
        condition_check_time_3:
          name: Check 3
          description: Time of a check recalculation without starting watering.
          default: "00:00:00"
          selector:
            time:
        condition_check_time_4:
          name: Check 4
          description: Time of a check recalculation without starting watering.
          default: "03:00:00"
          selector:
            time:
        season_start_month:
          name: Season start month
          description: First month in which the automation may water. Outside the season no section is started.
          default: 4
          selector:
            number:
              min: 1
              max: 12
              step: 1
              mode: slider
        season_end_month:
          name: Season end month
          description: Last month of the watering season. Example 4-10 means watering from April to October.
          default: 10
          selector:
            number:
              min: 1
              max: 12
              step: 1
              mode: slider
        min_dose_mm:
          name: Minimum dose to start
          description: If the calculated dose of a section is smaller, the section is skipped. Protects against pointless, very short cycles.
          default: 3
          selector:
            number:
              min: 0.5
              max: 15
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        max_dose_mm:
          name: Maximum dose per watering
          description: Upper limit of water for one watering of a section. Protects against overwatering and overly long runs after several dry days.
          default: 10
          selector:
            number:
              min: 3
              max: 30
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        min_runtime_minutes:
          name: Minimum section runtime
          description: Shortest runtime of a section once watering starts. Helps to keep the section and the installation running steadily.
          default: 8
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
              mode: slider
        max_runtime_minutes:
          name: Maximum section runtime
          description: Longest allowed runtime of one section in one cycle. Limits the risk of watering for too long.
          default: 45
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
              mode: slider
        zone_pause_seconds:
          name: Pause between sections
          description: Gap after closing one section before the next one starts. Gives the installation time to stabilise the pressure.
          default: 15
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: s
              mode: slider

    cooperation_section:
      name: Quiet night and lawn mower (optional)
      icon: mdi:robot-mower
      collapsed: true
      input:
        cisza_nocna:
          name: Quiet night
          description: Optional switch (input_boolean) that is on during the quiet night. A watering start before sunrise does NOT wait for the end of the quiet night, because valves are silent and the time before sunrise is the best time. When the quiet night is on and a start falls at another time (for example in the evening), watering is postponed to the next scheduled time. Empty = no restriction.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_boolean
        kosiarka:
          name: Together with the lawn mower
          description: Optional lawn mower entity (lawn_mower). While the mower is mowing (state mowing), watering does not start and does not open further sections but is postponed to the next scheduled time. A section that is already running finishes normally. The mower waits before leaving after watering on its own; that is handled by its own automation. Empty = no cooperation.
          default: ""
          selector:
            entity:
              filter:
                - domain: lawn_mower

    safety_section:
      name: Weather blocks
      icon: mdi:shield-check
      collapsed: true
      input:
        max_forecast_rain_mm:
          name: Forecast rain that blocks watering
          description: If the forecast shows at least this many mm of rain, watering is skipped.
          default: 4
          selector:
            number:
              min: 0
              max: 30
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        max_rain_probability_percent:
          name: Rain probability that blocks watering
          description: Watering is blocked when the chance of rain exceeds this threshold and the forecast shows at least 1 mm of rain.
          default: 80
          selector:
            number:
              min: 30
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        rain_credit_percent:
          name: Share of rain credited
          description: Percentage of new rain booked as water delivered to the soil - measured by the station or, without a station, estimated from the forecast for the past day. The forecast for today and tomorrow only delays the start. 80% accounts for typical losses.
          default: 80
          selector:
            number:
              min: 0
              max: 120
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_temperature_c:
          name: Minimum temperature
          description: Below this temperature watering does not start. Protects plants and the installation on cold mornings.
          default: 8
          selector:
            number:
              min: -5
              max: 20
              step: 0.5
              unit_of_measurement: C
              mode: slider
        hot_temperature_c:
          name: Hot-weather temperature
          description: From this temperature the automation slightly increases the water dose because evaporation is higher.
          default: 28
          selector:
            number:
              min: 20
              max: 40
              step: 0.5
              unit_of_measurement: C
              mode: slider
        max_wind:
          name: Maximum wind
          description: Limit in km/h. Speeds reported in m/s, mph or knots are converted automatically. Above the limit watering is skipped so that the water is not blown outside the sections.
          default: 35
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: km/h
              mode: slider
        min_battery_percent:
          name: Minimum section battery
          description: If a section has a battery sensor and the battery is below this threshold, the section is skipped.
          default: 20
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        soil_moisture_block_percent:
          name: Soil moisture that blocks watering
          description: Used only when a soil moisture sensor is selected. Once this threshold is reached the sensor blocks the cycle directly, like a professional moisture-based controller. Set the threshold according to the calibration of your sensor.
          default: 70
          selector:
            number:
              min: 20
              max: 95
              step: 1
              unit_of_measurement: "%"
              mode: slider
        irrigation_efficiency_percent:
          name: Irrigation efficiency
          description: Accounts for installation losses, uneven distribution and evaporation. A lower value makes watering longer; 70-85% is typical.
          default: 75
          selector:
            number:
              min: 40
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

    log_section:
      name: Irrigation logs
      icon: mdi:text-box-search
      collapsed: true
      input:
        enable_irrigation_logs:
          name: Enable logbook.log
          description: Adds entries to the HA Logbook for the cycle start, skips with a reason, section start/end and interruption by rain.
          default: false
          selector:
            boolean:
        create_persistent_notification:
          name: Create persistent_notification
          description: Shows notifications only when watering starts, when it ends with the section times, or when it is skipped or interrupted, with a short reason.
          default: false
          selector:
            boolean:
        next_watering_datetime:
          name: Helper - next watering
          description: Optional input_datetime with date and time. After every cycle check the automation stores the estimated next watering time in it.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_datetime
        water_balance_helper:
          name: Helper - persistent water balance
          description: Recommended input_text that stores the balance of ET, rain (from the station or the forecast estimate) and applied watering separately for every section. Create a Text helper with a maximum length of 255 characters. If the stored value would not fit the helper limit, watering is held with a readable reason. Without the helper a compatibility mode based on the section run history is used, which only Rain Bird RC2 reports; with switch/valve sections the helper is required.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_text
        pomocnik_powod:
          name: Helper - reason for the last decision
          description: Optional input_text (max. 255 characters). The automation writes the last decision or reason in it, briefly and in Polish, e.g. "Podlewam jutro o 5:40 - gleba potrzebuje wody". It also always writes when the rain comes from the fallback ("Measured rain") or the weather is unknown.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_text

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  trigger_schedule_mode: !input schedule_mode
  trigger_sun_offset_minutes: !input sun_event_offset_minutes
  trigger_zone_count: !input zone_count
  trigger_max_runtime_minutes: !input max_runtime_minutes
  trigger_valve_watchdog: !input valve_runtime_watchdog
  trigger_valves:
    - !input zone_1_valve
    - !input zone_2_valve
    - !input zone_3_valve
    - !input zone_4_valve
    - !input zone_5_valve
    - !input zone_6_valve
    - !input zone_7_valve
    - !input zone_8_valve
    - !input zone_9_valve
    - !input zone_10_valve
    - !input zone_11_valve
    - !input zone_12_valve

triggers:
  - trigger: time
    id: primary
    at: !input primary_start_time
  - trigger: time
    id: backup
    at: !input backup_start_time
  - trigger: template
    id: sun_check
    value_template: >-
      {% if trigger_schedule_mode in ['sunrise', 'sunset'] %}
        {% set attr = 'next_rising' if trigger_schedule_mode == 'sunrise' else 'next_setting' %}
        {% set next_event = state_attr('sun.sun', attr) %}
        {% set next_ts = as_timestamp(next_event) if next_event is not none else 0 %}
        {% set now_ts = as_timestamp(now()) %}
        {% set offset = (trigger_sun_offset_minutes | int(0)) * 60 %}
        {% set window = 300 %}
        {% set target_next = next_ts + offset %}
        {% set target_previous = next_ts - 86400 + offset %}
        {{ next_ts > 0
           and ((now_ts >= target_next and now_ts < target_next + window)
                or (now_ts >= target_previous and now_ts < target_previous + window)) }}
      {% else %}
        false
      {% endif %}
  - trigger: time
    id: condition_check_1
    at: !input condition_check_time_1
  - trigger: time
    id: condition_check_2
    at: !input condition_check_time_2
  - trigger: time
    id: condition_check_3
    at: !input condition_check_time_3
  - trigger: time
    id: condition_check_4
    at: !input condition_check_time_4
  - trigger: homeassistant
    id: ha_start
    event: start
  - trigger: template
    id: valve_watchdog
    value_template: >-
      {% if trigger_valve_watchdog | bool %}
        {% set controller_timed = integration_entities('rainbird_rc2') + integration_entities('rainbird') %}
        {% set limit = ((trigger_max_runtime_minutes | int(45)) + 5) * 60 %}
        {% set watched = trigger_valves[:(trigger_zone_count | int(1))]
             | select('string') | reject('eq', '') | reject('in', controller_timed) | list %}
        {{ expand(watched)
           | selectattr('state', 'in', ['on', 'open', 'opening'])
           | selectattr('last_changed', 'lt', now() - timedelta(seconds=limit))
           | list | count > 0 }}
      {% else %}
        false
      {% endif %}

variables:
  forecast_weather_entity: !input forecast_weather_entity
  current_weather_entity_input: !input current_weather_entity
  rain_binary_sensor: !input rain_binary_sensor
  pogoda_opad_24h_wstecz: !input pogoda_opad_24h_wstecz
  rain_amount_sensor_fallback: !input rain_amount_sensor
  cisza_nocna: !input cisza_nocna
  kosiarka: !input kosiarka
  pomocnik_powod: !input pomocnik_powod
  # Rain source: main (pogoda_opad_24h_wstecz) -> fallback (rain_amount_sensor) -> unknown.
  rain_source_mode: >-
    {% set main = pogoda_opad_24h_wstecz | default('', true) %}
    {% set own = rain_amount_sensor_fallback | default('', true) %}
    {% if main | length > 0 and states(main) | is_number %}glowne
    {% elif own | length > 0 and states(own) | is_number %}{{ 'rezerwa' if main | length > 0 else 'wlasny' }}
    {% elif main | length > 0 %}nieznane
    {% elif own | length > 0 %}wlasny
    {% else %}prognoza
    {% endif %}
  # Effective rain source used by the water balance; the name is kept for the remaining templates.
  rain_amount_sensor: >-
    {% set main = pogoda_opad_24h_wstecz | default('', true) %}
    {% set own = rain_amount_sensor_fallback | default('', true) %}
    {{ main if rain_source_mode in ['glowne', 'nieznane'] else own if rain_source_mode in ['rezerwa', 'wlasny'] else '' }}
