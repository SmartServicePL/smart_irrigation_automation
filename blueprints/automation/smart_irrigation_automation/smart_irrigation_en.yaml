  zone_10_custom_rate_mm_h: !input zone_10_custom_rate_mm_h
  zone_10_runtime_adjustment_percent: !input zone_10_runtime_adjustment_percent
  zone_10_online_sensor: !input zone_10_online_sensor
  zone_10_battery_sensor: !input zone_10_battery_sensor

  zone_11_valve: !input zone_11_valve
  zone_11_name: !input zone_11_name
  zone_11_soil_type: !input zone_11_soil_type
  zone_11_plant_type: !input zone_11_plant_type
  zone_11_sprinkler_profile: !input zone_11_sprinkler_profile
  zone_11_custom_rate_mm_h: !input zone_11_custom_rate_mm_h
  zone_11_runtime_adjustment_percent: !input zone_11_runtime_adjustment_percent
  zone_11_online_sensor: !input zone_11_online_sensor
  zone_11_battery_sensor: !input zone_11_battery_sensor

  zone_12_valve: !input zone_12_valve
  zone_12_name: !input zone_12_name
  zone_12_soil_type: !input zone_12_soil_type
  zone_12_plant_type: !input zone_12_plant_type
  zone_12_sprinkler_profile: !input zone_12_sprinkler_profile
  zone_12_custom_rate_mm_h: !input zone_12_custom_rate_mm_h
  zone_12_runtime_adjustment_percent: !input zone_12_runtime_adjustment_percent
  zone_12_online_sensor: !input zone_12_online_sensor
  zone_12_battery_sensor: !input zone_12_battery_sensor

  schedule_mode: !input schedule_mode
  sun_event_offset_minutes: !input sun_event_offset_minutes
  primary_start_time: !input primary_start_time
  enable_condition_checks: !input enable_condition_checks
  enable_backup_time: !input enable_backup_time
  season_start_month: !input season_start_month
  season_end_month: !input season_end_month
  min_dose_mm: !input min_dose_mm
  max_dose_mm: !input max_dose_mm
  min_runtime_minutes: !input min_runtime_minutes
  max_runtime_minutes: !input max_runtime_minutes
  zone_pause_seconds: !input zone_pause_seconds
  max_forecast_rain_mm: !input max_forecast_rain_mm
  max_rain_probability_percent: !input max_rain_probability_percent
  rain_credit_percent: !input rain_credit_percent
  min_temperature_c: !input min_temperature_c
  hot_temperature_c: !input hot_temperature_c
  max_wind: !input max_wind
  min_battery_percent: !input min_battery_percent
  soil_moisture_block_percent: !input soil_moisture_block_percent
  irrigation_efficiency_percent: !input irrigation_efficiency_percent
  enable_irrigation_logs: !input enable_irrigation_logs
  create_persistent_notification: !input create_persistent_notification
  next_watering_datetime: !input next_watering_datetime
  water_balance_helper: !input water_balance_helper
  valve_runtime_watchdog: !input valve_runtime_watchdog
  valve_active_states:
    - "on"
    - open
    - opening
    - running
  valve_closed_states:
    - "off"
    - closed
    - idle
  safety_trigger_ids:
    - ha_start
    - valve_watchdog
  bad_weather_states:
    - rainy
    - pouring
    - lightning
    - lightning-rainy
    - hail
    - snowy
    - snowy-rainy
  severe_forecast_states:
    - pouring
    - lightning
    - lightning-rainy
    - hail
    - snowy
    - snowy-rainy
  current_weather_entity: >-
    {% set e = current_weather_entity_input | default('', true) %}
    {{ forecast_weather_entity if e | length == 0 else e }}
  trigger_id: "{{ trigger.id | default('manual', true) }}"
  condition_check_trigger_ids:
    - condition_check_1
    - condition_check_2
    - condition_check_3
    - condition_check_4
  trigger_is_condition_check: "{{ trigger_id in condition_check_trigger_ids }}"
  next_schedule_timestamp: >-
    {% set now_ts = as_timestamp(now()) %}
    {% if schedule_mode == 'fixed_time' %}
      {% set first = as_timestamp(today_at(primary_start_time)) %}
      {% if first <= now_ts %}
        {% set first = as_timestamp(today_at(primary_start_time) + timedelta(days=1)) %}
      {% endif %}
      {{ first | int }}
    {% else %}
      {% set attr = 'next_rising' if schedule_mode == 'sunrise' else 'next_setting' %}
      {% set event = state_attr('sun.sun', attr) %}
      {% set first = (as_timestamp(event, now_ts) + (sun_event_offset_minutes | int(0)) * 60) %}
      {% if first <= now_ts %}
        {% set first = first + 86400 %}
      {% endif %}
      {{ first | int }}
    {% endif %}
  irrigation_start_trigger_ok: >-
    {% if schedule_mode == 'fixed_time' %}
      {% set helper = next_watering_datetime | default('', true) %}
      {% set helper_ts = as_timestamp(states(helper), 0) if helper | length > 0 else 0 %}
      {% set missed_primary = trigger_id == 'backup'
           and (enable_backup_time | bool)
           and helper | length > 0
           and helper_ts > 0
           and helper_ts <= as_timestamp(now()) %}
      {{ trigger_id == 'primary' or missed_primary }}
    {% elif trigger_id == 'sun_check' and schedule_mode in ['sunrise', 'sunset'] %}
      true
    {% else %}
      false
    {% endif %}
  schedule_trigger_ok: >-
    {{ (irrigation_start_trigger_ok | bool)
       or ((trigger_is_condition_check | bool) and (enable_condition_checks | bool)) }}

actions:
  - alias: Valve safety check
    if:
      - condition: template
        value_template: "{{ trigger_id in safety_trigger_ids }}"
    then:
      - alias: Find switch/valve sections without a time limit in the controller
        variables:
          safety_sections: >-
            {% set controller_timed = integration_entities('rainbird_rc2') + integration_entities('rainbird') %}
            {{ [zone_1_valve, zone_2_valve, zone_3_valve, zone_4_valve, zone_5_valve, zone_6_valve,
                zone_7_valve, zone_8_valve, zone_9_valve, zone_10_valve, zone_11_valve, zone_12_valve][:(zone_count | int(1))]
               | select('string') | reject('eq', '') | reject('in', controller_timed) | list }}
      - alias: After an HA start wait until the sections are available
        if:
          - condition: template
            value_template: "{{ trigger_id == 'ha_start' and safety_sections | count > 0 }}"
        then:
          - wait_template: "{{ safety_sections | select('is_state', 'unavailable') | list | count == 0 }}"
            timeout: "00:03:00"
            continue_on_timeout: true
      - alias: Select the sections to close
        variables:
          safety_watchdog_limit_minutes: "{{ (max_runtime_minutes | int(45)) + 5 }}"
          safety_close_now: >-
            {% if trigger_id == 'valve_watchdog' %}
              {{ expand(safety_sections)
                 | selectattr('state', 'in', valve_active_states)
                 | selectattr('last_changed', 'lt', now() - timedelta(minutes=safety_watchdog_limit_minutes | int(50)))
                 | map(attribute='entity_id') | list }}
            {% else %}
              {{ expand(safety_sections) | selectattr('state', 'in', valve_active_states) | map(attribute='entity_id') | list }}
            {% endif %}
          safety_unknown: >-
            {% if trigger_id == 'ha_start' %}
              {{ safety_sections | select('is_state', 'unknown') | list }}
            {% else %}
              []
            {% endif %}
          safety_unavailable: "{{ safety_sections | select('is_state', 'unavailable') | list }}"
      - alias: Close the sections and confirm closing
        if:
          - condition: template
            value_template: "{{ (safety_close_now | count) + (safety_unknown | count) > 0 }}"
        then:
          - repeat:
              sequence:
                - variables:
                    safety_targets: >-
                      {{ (safety_close_now | reject('is_state', valve_closed_states) | list)
                         + (safety_unknown if repeat.index == 1 else []) }}
                - if:
                    - condition: template
                      value_template: "{{ safety_targets | select('match', 'switch\\.') | list | count > 0 }}"
                  then:
                    - action: switch.turn_off
                      continue_on_error: true
                      target:
                        entity_id: "{{ safety_targets | select('match', 'switch\\.') | list }}"
                - if:
                    - condition: template
                      value_template: "{{ safety_targets | select('match', 'valve\\.') | list | count > 0 }}"
                  then:
                    - action: valve.close_valve
                      continue_on_error: true
                      target:
                        entity_id: "{{ safety_targets | select('match', 'valve\\.') | list }}"
                - wait_template: >-
                    {{ safety_close_now | reject('is_state', valve_closed_states) | list | count == 0 }}
                  timeout: "00:00:30"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: >-
                    {{ safety_close_now | reject('is_state', valve_closed_states) | list | count == 0
                       or repeat.index >= 3 }}
          - variables:
              safety_not_closed: "{{ safety_close_now | reject('is_state', valve_closed_states) | list }}"
              safety_closed: "{{ safety_close_now | select('is_state', valve_closed_states) | list }}"
              safety_event_text: >-
                {% if trigger_id == 'ha_start' %}
                  After the Home Assistant start
                {% else %}
                  Runtime watchdog: the section was on longer than {{ safety_watchdog_limit_minutes }} min (maximum section runtime + 5 min), so
                {% endif %}
          - alias: Notify about closed sections
            if:
              - condition: template
                value_template: "{{ (safety_closed | count) + (safety_not_closed | count) > 0 }}"
            then:
              - action: persistent_notification.create
                data:
                  title: >-
                    {{ 'Smart irrigation - ALARM' if safety_not_closed | count > 0 else 'Smart irrigation - sections closed' }}
                  message: |-
                    {%- if safety_not_closed | count > 0 %}
                    **Status:** sections did not confirm closing

                    {{ safety_event_text | trim }} the automation tried to close the open sections 3 times but got no confirmation.

                    **Check manually**
                    {%- for e in safety_not_closed %}
                    - {{ e }}: state {{ states(e) }}
                    {%- endfor %}
                    {%- else %}
                    **Status:** open sections closed

                    {{ safety_event_text | trim }} the automation closed the sections that were left open.
                    {%- endif %}
                    {%- if safety_closed | count > 0 %}

                    **Closed**
                    {%- for e in safety_closed %}
                    - {{ e }}
                    {%- endfor %}
                    {%- endif %}
                    {%- if safety_unavailable | count > 0 %}

                    **Unavailable - cannot be checked**
                    {%- for e in safety_unavailable %}
                    - {{ e }}
                    {%- endfor %}
                    {%- endif %}

                    If a running cycle was interrupted, the water balance of that section was not reduced; watering resumes with the next planned cycle.
                  notification_id: smart_irrigation_valve_alarm
              - if:
                  - condition: template
                    value_template: >-
                      {{ pomocnik_powod | default('', true) | length > 0 and states[pomocnik_powod] is not none }}
                then:
                  - action: input_text.set_value
                    continue_on_error: true
                    target:
                      entity_id: "{{ pomocnik_powod }}"
                    data:
                      value: >-
                        {{ ('ALARM - valves did not confirm closing: ' ~ (safety_not_closed | join(', '))
                            if safety_not_closed | count > 0
                            else 'Open valves closed (' ~ (safety_closed | join(', ')) ~ ') - '
                                 ~ ('Home Assistant start' if trigger_id == 'ha_start' else 'runtime watchdog'))[:255] }}
          - alias: Log the valve check
            if:
              - condition: template
                value_template: "{{ enable_irrigation_logs | bool }}"
            then:
              - action: logbook.log
                data:
                  name: Smart irrigation
                  message: >-
                    Valve check ({{ trigger_id }}).
                    Closed: {{ safety_closed | join(', ') if safety_closed | count > 0 else 'no section' }}.
                    Without close confirmation: {{ safety_not_closed | join(', ') if safety_not_closed | count > 0 else 'no section' }}.
                    OFF sent to sections in the unknown state: {{ safety_unknown | join(', ') if safety_unknown | count > 0 else 'no section' }}.
                    Unavailable: {{ safety_unavailable | join(', ') if safety_unavailable | count > 0 else 'no section' }}.
      - stop: "Valve safety check finished."

  - alias: Start schedule matches
    condition: template
    value_template: "{{ schedule_trigger_ok | bool }}"

  - alias: Get the daily forecast
    action: weather.get_forecasts
    continue_on_error: true
    target:
      entity_id: !input forecast_weather_entity
    data:
      type: daily
    response_variable: daily_forecast

  - alias: Guard against a missing forecast response
    variables:
      daily_forecast: "{{ daily_forecast if daily_forecast is defined and daily_forecast is mapping else {} }}"
      daily_forecast_available: >-
        {% set fc = daily_forecast if daily_forecast is defined and daily_forecast is mapping else {} %}
        {{ fc.get(forecast_weather_entity, {}).get('forecast', []) | count > 0 }}

  - alias: Calculate weather and shared conditions
    variables:
      forecast_condition: >-
        {% set fc = daily_forecast.get(forecast_weather_entity, {}).get('forecast', []) %}
        {{ fc[0].condition | default(states(forecast_weather_entity), true) if fc | count > 0 else states(forecast_weather_entity) }}
      current_weather_condition_pl: >-
        {% set condition = states(current_weather_entity) | trim %}
        {% set names = {
          'clear-night': 'clear night',
          'cloudy': 'cloudy',
          'exceptional': 'exceptional conditions',
          'fog': 'fog',
          'hail': 'hail',
          'lightning': 'thunderstorm',
          'lightning-rainy': 'thunderstorm with rain',
          'partlycloudy': 'partly cloudy',
          'pouring': 'heavy rain',
          'rainy': 'rain',
          'snowy': 'snow',
          'snowy-rainy': 'sleet',
          'sunny': 'sunny',
          'windy': 'windy',
          'windy-variant': 'windy and cloudy',
          'unknown': 'unknown',
          'unavailable': 'unavailable'
        } %}
        {{ names.get(condition, condition) }}
      forecast_condition_pl: >-
        {% set condition = forecast_condition | trim %}
        {% set names = {
          'clear-night': 'clear night',
          'cloudy': 'cloudy',
          'exceptional': 'exceptional conditions',
          'fog': 'fog',
          'hail': 'hail',
          'lightning': 'thunderstorm',
          'lightning-rainy': 'thunderstorm with rain',
          'partlycloudy': 'partly cloudy',
          'pouring': 'heavy rain',
          'rainy': 'rain',
          'snowy': 'snow',
          'snowy-rainy': 'sleet',
          'sunny': 'sunny',
          'windy': 'windy',
          'windy-variant': 'windy and cloudy',
          'unknown': 'unknown',
          'unavailable': 'unavailable'
        } %}
        {{ names.get(condition, condition) }}
      forecast_temperature: >-
        {% set fc = daily_forecast.get(forecast_weather_entity, {}).get('forecast', []) %}
        {% set fallback = state_attr(forecast_weather_entity, 'temperature') | float(0) %}
        {% set raw = fc[0].temperature | default(fallback, true) | float(fallback) if fc | count > 0 else fallback %}
        {% set unit = state_attr(forecast_weather_entity, 'temperature_unit') | default('°C', true) | lower %}
        {{ ((raw - 32) * 5 / 9) | round(1) if unit in ['°f', 'f'] else raw }}
      forecast_precipitation: >-
        {% set fc = daily_forecast.get(forecast_weather_entity, {}).get('forecast', []) %}
        {% set fallback = state_attr(forecast_weather_entity, 'precipitation') | float(0) %}
        {% set raw = fc[0].precipitation | default(fallback, true) | float(fallback) if fc | count > 0 else fallback %}
        {% set unit = state_attr(forecast_weather_entity, 'precipitation_unit') | default('mm', true) | lower %}
        {{ (raw * 25.4) | round(2) if unit in ['in', 'inch', 'inches'] else raw }}
      forecast_precipitation_probability: >-
        {% set fc = daily_forecast.get(forecast_weather_entity, {}).get('forecast', []) %}
        {{ fc[0].precipitation_probability | default(0, true) | int(0) if fc | count > 0 else 0 }}
      forecast_window_label: daily forecast
      current_rain_mm: >-
        {% set e = rain_amount_sensor | default('', true) %}
        {% if e | length > 0 and states(e) | is_number %}
          {% set raw = states(e) | float(0) %}
          {% set unit = state_attr(e, 'unit_of_measurement') | default('mm', true) | lower %}
          {{ (raw * 25.4) | round(2) if unit in ['in', 'inch', 'inches'] else raw }}
        {% else %}
          {% set raw = state_attr(current_weather_entity, 'precipitation') | float(0) %}
          {% set unit = state_attr(current_weather_entity, 'precipitation_unit') | default('mm', true) | lower %}
          {{ (raw * 25.4) | round(2) if unit in ['in', 'inch', 'inches'] else raw }}
        {% endif %}
      temp_c: >-
        {% set e = temperature_source_entity | default('', true) %}
        {% set fahrenheit = ['°f', 'f'] %}
        {% set w_raw = state_attr(current_weather_entity, 'temperature') | float(none) %}
        {% set w_unit = state_attr(current_weather_entity, 'temperature_unit') | default('°C', true) | lower %}
        {% set weather_now = -99 if w_raw is none else ((w_raw - 32) * 5 / 9) | round(1) if w_unit in fahrenheit else w_raw %}
        {% if e | length == 0 %}
          {{ weather_now }}
        {% else %}
          {% set is_weather = e.split('.')[0] == 'weather' %}
          {% set raw = (state_attr(e, 'temperature') if is_weather else states(e)) | float(none) %}
          {% set unit = (state_attr(e, 'temperature_unit') if is_weather else state_attr(e, 'unit_of_measurement')) | default('°C', true) | lower %}
          {{ weather_now if raw is none else ((raw - 32) * 5 / 9) | round(1) if unit in fahrenheit else raw }}
        {% endif %}
      temp_available: "{{ (temp_c | float(-99)) > -99 }}"
      wind_value: >-
        {% set e = wind_source_entity | default('', true) %}
        {% set w_raw = state_attr(current_weather_entity, 'wind_speed') %}
        {% set w_unit = state_attr(current_weather_entity, 'wind_speed_unit') | default('km/h', true) | lower %}
        {% if w_raw | is_number %}
          {% set raw = w_raw | float(0) %}
          {% set weather_now = (raw * 3.6) | round(2) if w_unit in ['m/s', 'mps'] else (raw * 1.609344) | round(2) if w_unit in ['mph', 'mi/h'] else (raw * 1.852) | round(2) if w_unit in ['kn', 'kt', 'knot', 'knots'] else raw %}
        {% else %}
          {% set weather_now = none %}
        {% endif %}
        {% if e | length == 0 %}
          {{ weather_now if weather_now is not none else 0 }}
        {% elif e.split('.')[0] == 'weather' and state_attr(e, 'wind_speed') | is_number %}
          {% set raw = state_attr(e, 'wind_speed') | float(0) %}
          {% set unit = state_attr(e, 'wind_speed_unit') | default('km/h', true) | lower %}
          {{ (raw * 3.6) | round(2) if unit in ['m/s', 'mps'] else (raw * 1.609344) | round(2) if unit in ['mph', 'mi/h'] else (raw * 1.852) | round(2) if unit in ['kn', 'kt', 'knot', 'knots'] else raw }}
        {% elif e.split('.')[0] != 'weather' and states(e) | is_number %}
          {% set raw = states(e) | float(0) %}
          {% set unit = state_attr(e, 'unit_of_measurement') | default('km/h', true) | lower %}
          {{ (raw * 3.6) | round(2) if unit in ['m/s', 'mps'] else (raw * 1.609344) | round(2) if unit in ['mph', 'mi/h'] else (raw * 1.852) | round(2) if unit in ['kn', 'kt', 'knot', 'knots'] else raw }}
        {% else %}
          {{ weather_now if weather_now is not none else 999 }}
        {% endif %}
      wind_available: "{{ (wind_value | float(999)) < 999 }}"
      sunlight_index: >-
        {% set e = sunlight_source_entity | default('', true) %}
        {% if e | length == 0 %}
          {{ state_attr(current_weather_entity, 'uv_index') | float(5) }}
        {% elif e.split('.')[0] == 'weather' %}
          {{ state_attr(e, 'uv_index') | float(5) }}
        {% else %}
          {{ states(e) | float(5) }}
        {% endif %}
      soil_moisture_percent: >-
        {% set e = soil_moisture_sensor | default('', true) %}
        {% if e | length > 0 and states(e) | is_number %}
          {{ states(e) | float(0) }}
        {% else %}
          -1
        {% endif %}
      soil_moisture_factor: >-
        1
      soil_moisture_ok: >-
        {% set m = soil_moisture_percent | float(-1) %}
        {{ m < 0 or m < (soil_moisture_block_percent | float(70)) }}
      season_resume_ts: >-
        {% set start = season_start_month | int(4) %}
        {% set n = now() %}
        {% set first = n.replace(month=start, day=1, hour=0, minute=0, second=0, microsecond=0) %}
        {% set first = first if first > n else first.replace(year=n.year + 1) %}
        {{ as_timestamp(first) | int }}
      season_ok: >-
        {% set start = season_start_month | int(4) %}
        {% set end = season_end_month | int(10) %}
        {% set month = now().month %}
        {% if start <= end %}
          {{ month >= start and month <= end }}
        {% else %}
          {{ month >= start or month <= end }}
        {% endif %}
      weather_ok: >-
        {{ states(current_weather_entity) not in bad_weather_states
           and forecast_condition not in severe_forecast_states }}
      weather_data_ok: >-
        {{ states(current_weather_entity) | trim not in ['unknown', 'unavailable', 'none', '']
           and forecast_condition | trim not in ['unknown', 'unavailable', 'none', ''] }}
      rain_sensor_ok: >-
        {{ rain_binary_sensor | default('', true) | length == 0
           or is_state(rain_binary_sensor, 'off') }}
      forecast_rain_ok: >-
        {{ (forecast_precipitation | float(0) | round(1)) < (max_forecast_rain_mm | float(4))
           and not ((forecast_precipitation_probability | int(0)) >= (max_rain_probability_percent | int(80))
                     and (forecast_precipitation | float(0)) >= 1) }}
      temp_ok: "{{ (temp_c | float(0)) >= (min_temperature_c | float(8)) }}"
      wind_ok: "{{ (wind_value | float(0)) <= (max_wind | float(35)) }}"
      temp_factor: >-
        {% set t = temp_c | float(0) %}
        {% if t < 12 %}0.6
        {% elif t < 20 %}0.85
        {% elif t < (hot_temperature_c | float(28)) %}1
        {% else %}1.25
        {% endif %}
      sun_factor: >-
        {% set u = sunlight_index | float(5) %}
        {% if u < 2 %}0.9{% elif u <= 7 %}1{% else %}1.1{% endif %}
      solar_radiation_mean_w_m2: >-
        {% set e = solar_radiation_mean_sensor | default('', true) %}
        {% set unit = (state_attr(e, 'unit_of_measurement') | default('W/m²', true) | string | lower | replace(' ', '')) if e | length > 0 else '' %}
        {% if e | length == 0 or not (states(e) | is_number) %}
          -1
        {% elif unit in ['w/m²', 'w/m2'] %}
          {{ states(e) | float(0) }}
        {% elif unit in ['kw/m²', 'kw/m2'] %}
          {{ states(e) | float(0) * 1000 }}
        {% else %}
          -1
        {% endif %}
      reference_et_method: >-
        {% set e = reference_et_sensor | default('', true) %}
        {% if e | length > 0 and states(e) | is_number %}
          ET0 sensor
        {% elif (solar_radiation_mean_w_m2 | float(-1)) >= 0 %}
          from radiation
        {% else %}
          fallback estimate
        {% endif %}
      reference_et_mm: >-
        {% set e = reference_et_sensor | default('', true) %}
        {% if e | length > 0 and states(e) | is_number %}
          {{ states(e) | float(0) }}
        {% elif (solar_radiation_mean_w_m2 | float(-1)) >= 0 %}
          {% set rs = (solar_radiation_mean_w_m2 | float(0)) * 0.0864 %}
          {% set et0 = 0.0135 * ((temp_c | float(0)) + 17.8) * rs / 2.45 %}
          {{ 0 if et0 < 0 else 10 if et0 > 10 else et0 | round(2) }}
        {% else %}
          {% set t = temp_c | float(0) %}
          {% set u = sunlight_index | float(5) %}
          {% set w = wind_value | float(0) %}
          {% set hot = hot_temperature_c | float(28) %}
          {% set base = 1.2 + ([t - 8, 0] | max) * 0.13 + u * 0.28 + w * 0.015 %}
          {% set adjusted = base * (0.85 if t < 15 else 1.15 if t >= hot else 1) %}
          {{ 0.5 if adjusted < 0.5 else 7.5 if adjusted > 7.5 else adjusted | round(2) }}
        {% endif %}
      weather_source_summary: >-
        {{ state_attr(forecast_weather_entity, 'friendly_name') | default(forecast_weather_entity, true) }}, ET0 {{ reference_et_mm | float(0) | round(2) }} mm/d ({{ reference_et_method | trim }})
      rain_credit_mm: >-
        {% set raw_credit = rain_credit_percent | float(80) / 100 %}
        {% set credit = 0 if raw_credit < 0 else 1 if raw_credit > 1 else raw_credit %}
        {{ ((current_rain_mm | float(0)) * credit) | round(1) }}

  - alias: Update the persistent water balance
    variables:
      water_balance_enabled: >-
        {{ water_balance_helper | default('', true) | length > 0 }}
      water_balance_saved: >-
        {% set raw = states(water_balance_helper) if (water_balance_enabled | bool) else '' %}
        {{ raw if raw.startswith('{') else '{}' }}
      water_balance_saved_valid: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {{ (water_balance_enabled | bool)
           and saved is mapping
           and saved.get('v', 0) | int(0) == 1
           and saved.get('t', 0) | float(0) > 0
           and saved.get('z', []) is list
           and saved.get('z', []) | count >= 12 }}
      water_balance_raw_elapsed_days: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {% set elapsed = (as_timestamp(now()) - (saved.get('t', 0) | float(0))) / 86400 if (water_balance_saved_valid | bool) else 0 %}
        {{ 0 if elapsed < 0 else elapsed | round(5) }}
      water_balance_season_start_ts: >-
        {% set start = season_start_month | int(4) %}
        {% set end = season_end_month | int(10) %}
        {% set n = now() %}
        {% set year = n.year if (start <= end or n.month >= start) else n.year - 1 %}
        {{ as_timestamp(n.replace(year=year, month=start, day=1, hour=0, minute=0, second=0, microsecond=0)) | int }}
      water_balance_new_season: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {{ (water_balance_saved_valid | bool) and (season_ok | bool)
           and (saved.get('t', 0) | float(0)) < (water_balance_season_start_ts | float(0)) }}
      water_balance_elapsed_days: >-
        {% if not (season_ok | bool) %}
          0
        {% else %}
          {% set since_season = (as_timestamp(now()) - (water_balance_season_start_ts | float(0))) / 86400 %}
          {% set elapsed = since_season if (water_balance_new_season | bool) else water_balance_raw_elapsed_days | float(0) %}
          {{ 0 if elapsed < 0 else 7 if elapsed > 7 else elapsed | round(5) }}
        {% endif %}
      water_balance_rain_from_forecast: >-
        {{ (water_balance_enabled | bool) and rain_amount_sensor | default('', true) | length == 0 }}
      water_balance_day: "{{ now().strftime('%j') | int }}"
      water_balance_saved_day: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {{ (saved.get('t', 0) | float(0) | timestamp_custom('%j')) | int if (water_balance_saved_valid | bool) else 0 }}
      water_balance_forecast_today_mm: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {% set fc = daily_forecast.get(forecast_weather_entity, {}).get('forecast', []) %}
        {% set today = now().strftime('%Y-%m-%d') %}
        {% set ns = namespace(value=none) %}
        {% for item in fc %}
          {% if ns.value is none and (as_timestamp(item.get('datetime'), 0) | timestamp_custom('%Y-%m-%d')) == today %}
            {% set ns.value = item.get('precipitation', 0) | float(0) %}
          {% endif %}
        {% endfor %}
        {% set unit = state_attr(forecast_weather_entity, 'precipitation_unit') | default('mm', true) | lower %}
        {% if ns.value is not none %}
          {{ (ns.value * 25.4) | round(1) if unit in ['in', 'inch', 'inches'] else ns.value | round(1) }}
        {% elif (water_balance_saved_valid | bool) and water_balance_saved_day | int(0) == water_balance_day | int(0) %}
          {{ saved.get('p', 0) | float(0) | round(1) }}
        {% else %}
          0
        {% endif %}
      water_balance_source_tag: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {% if rain_source_mode == 'glowne' %}1
        {% elif rain_source_mode in ['rezerwa', 'wlasny'] %}0
        {% else %}{{ saved.get('s', 0) | int(0) if (water_balance_saved_valid | bool) else 0 }}
        {% endif %}
      water_balance_rain_source_ok: >-
        {% set e = rain_amount_sensor | default('', true) %}
        {% if e | length > 0 %}
          {{ states(e) | is_number }}
        {% else %}
          {{ water_balance_rain_from_forecast | bool }}
        {% endif %}
      water_balance_rain_total_mm: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {% set previous = saved.get('r', 0) | float(0) if (water_balance_saved_valid | bool) else 0 %}
        {% if (water_balance_rain_source_ok | bool) and not (water_balance_rain_from_forecast | bool) %}
          {{ current_rain_mm | float(0) | round(1) }}
        {% else %}
          {{ previous | round(1) }}
        {% endif %}
      water_balance_rain_increment_mm: >-
        {% set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) %}
        {% if water_balance_rain_from_forecast | bool %}
          {% set stored_day = water_balance_saved_day | int(0) %}
          {{ saved.get('p', 0) | float(0) | round(2) if stored_day > 0 and stored_day != water_balance_day | int(0) else 0 }}
        {% else %}
          {% set current = water_balance_rain_total_mm | float(0) %}
          {% set previous = saved.get('r', current) | float(current) if (water_balance_saved_valid | bool) else current %}
          {% set same_source = (saved.get('s', 0) | int(0) if (water_balance_saved_valid | bool) else water_balance_source_tag | default(0, true) | int(0)) == (water_balance_source_tag | default(0, true) | int(0)) %}
          {% set delta = current - previous %}
          {{ delta | round(2) if delta > 0 and (water_balance_rain_source_ok | bool) and same_source else 0 }}
        {% endif %}
      effective_rain_increment_mm: >-
        {% set raw_credit = rain_credit_percent | float(80) / 100 %}
        {% set credit = 0 if raw_credit < 0 else 1 if raw_credit > 1 else raw_credit %}
        {{ ((water_balance_rain_increment_mm | float(0)) * credit) | round(2) }}
      water_balance_deficits_json: |-
        {%- set zones = [
          {'soil': zone_1_soil_type, 'plant': zone_1_plant_type},
          {'soil': zone_2_soil_type, 'plant': zone_2_plant_type},
          {'soil': zone_3_soil_type, 'plant': zone_3_plant_type},
          {'soil': zone_4_soil_type, 'plant': zone_4_plant_type},
          {'soil': zone_5_soil_type, 'plant': zone_5_plant_type},
          {'soil': zone_6_soil_type, 'plant': zone_6_plant_type},
          {'soil': zone_7_soil_type, 'plant': zone_7_plant_type},
          {'soil': zone_8_soil_type, 'plant': zone_8_plant_type},
          {'soil': zone_9_soil_type, 'plant': zone_9_plant_type},
          {'soil': zone_10_soil_type, 'plant': zone_10_plant_type},
          {'soil': zone_11_soil_type, 'plant': zone_11_plant_type},
          {'soil': zone_12_soil_type, 'plant': zone_12_plant_type}
        ] -%}
        {%- set saved = (water_balance_saved if water_balance_saved is mapping else water_balance_saved | from_json({})) -%}
        {%- set previous = saved.get('z', []) if (water_balance_saved_valid | bool) else [] -%}
        {%- set ns = namespace(values=[]) -%}
        {%- for zone in zones -%}
          {%- set soil = zone.soil -%}
          {%- set available = 55 if soil == 'sand' else 115 if soil == 'sandy_loam' else 170 if soil == 'humus' else 180 if soil == 'chernozem' else 155 if soil == 'clay_loam' else 120 if soil == 'clay' else 150 -%}
          {%- set plant = zone.plant -%}
          {%- set kc = 0.8 if plant == 'flowers' else 1.0 if plant == 'vegetables' else 0.55 if plant == 'shrubs' else 0.75 -%}
          {%- set root = 0.25 if plant == 'flowers' else 0.35 if plant == 'vegetables' else 0.5 if plant == 'shrubs' else 0.2 -%}
          {%- set cap = available * root -%}
          {%- set old = previous[loop.index0] | float(0) if previous | count > loop.index0 and not (water_balance_new_season | bool) else 0 -%}
          {%- set raw = old + (reference_et_mm | float(3.5)) * kc * (water_balance_elapsed_days | float(0)) - (effective_rain_increment_mm | float(0)) if (water_balance_saved_valid | bool) and (season_ok | bool) else 0 -%}
          {%- set value = 0 if raw < 0 else cap if raw > cap else raw -%}
          {%- set ns.values = ns.values + [value | round(1)] -%}
        {%- endfor -%}
        {{ ns.values | to_json }}
      water_balance_deficits: >-
        {{ water_balance_deficits_json if water_balance_deficits_json is list else water_balance_deficits_json | from_json([]) }}
      water_balance_payload: >-
        {"v":1,"t":{{ as_timestamp(now()) | int }},{% if water_balance_rain_from_forecast | bool %}"p":{{ water_balance_forecast_today_mm | float(0) | round(1) }}{% else %}"r":{{ water_balance_rain_total_mm | float(0) | round(1) }}{% if water_balance_source_tag | default(0, true) | int(0) == 1 %},"s":1{% endif %}{% endif %},"z":{{ water_balance_deficits_json }}{{ "}" }}
      water_balance_payload_length: "{{ water_balance_payload | string | trim | length }}"
      water_balance_helper_max: >-
        {{ state_attr(water_balance_helper, 'max') | int(0) if (water_balance_enabled | bool) else 0 }}
      water_balance_helper_ok: >-
        {{ not (water_balance_enabled | bool)
           or (states[water_balance_helper] is not none
               and states(water_balance_helper) != 'unavailable'
               and (water_balance_payload_length | int(0)) <= (water_balance_helper_max | int(0))) }}

  - alias: Store the persistent balance in the helper
    choose:
      - conditions:
          - condition: template
            value_template: "{{ (water_balance_enabled | bool) and (water_balance_helper_ok | bool) }}"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: "{{ water_balance_helper }}"
            data:
              value: "{{ water_balance_payload | trim }}"

  - alias: Log a gap in balance updates
    if:
      - condition: template
        value_template: >-
          {{ (enable_irrigation_logs | bool) and (water_balance_enabled | bool)
             and (season_ok | bool)
             and ((water_balance_new_season | bool) or (water_balance_raw_elapsed_days | float(0)) > 7) }}
    then:
      - action: logbook.log
        data:
          name: Smart irrigation
          message: >-
            {% if water_balance_new_season | bool %}
              New watering season: the water balance starts from zero at the beginning of the season (month {{ season_start_month }}).
            {% else %}
              The water balance was not updated for {{ water_balance_raw_elapsed_days | float(0) | round(1) }} days
              (automation disabled or Home Assistant not running). Evapotranspiration was added for 7 days only.
            {% endif %}

  - alias: Build the rain description and the rain source warning
    variables:
      rain_measurement_warning: >-
        {% if rain_amount_sensor | default('', true) | length > 0 and (water_balance_enabled | bool)
              and not (water_balance_rain_source_ok | bool) %}
          {% if rain_source_mode == 'nieznane' %}
            Rain is unknown: the main source {{ pogoda_opad_24h_wstecz }} and the fallback are unavailable - the balance kept the previous rain total and did not subtract new rain.
          {% else %}
            The rain source is currently unavailable - the balance kept the previous rain total and did not subtract new rain.
          {% endif %}
        {% endif %}
      rain_summary_line: >-
        {% if (water_balance_rain_from_forecast | bool) %}
          Rain for the balance: estimate from the forecast (today {{ water_balance_forecast_today_mm | float(0) | round(1) }} mm, booked once per day)
        {% else %}
          Measured rain: {{ current_rain_mm | float(0) | round(1) }} mm
        {% endif %}

