blueprint:
  name: Smart garden irrigation - 1 to 12 sections
  description: >
    Version 1.12.1. Universal irrigation blueprint for 1 to 12 sections. Supports
    Rain Bird RC2 installations and mixed setups with additional valves or relays
    from Sonoff, Shelly and ESPHome. The weather comes from the Home Assistant forecast, and a
    weather station is optional. For each section you set its name, section entity, soil
    type, plants, Rain Bird/Hunter sprinkler type, runtime adjustment and
    optional online/battery sensors. Closing of every section is confirmed
    and retried, and open switch/valve sections are closed after an HA restart.
    Ordinary relays should additionally be protected by a hardware time limit
    (Shelly "Auto OFF", Sonoff "Inching", ESPHome on_turn_on + delay).
  domain: automation
  author: Smart Service
  homeassistant:
    min_version: 2025.4.0
  source_url: https://github.com/SmartServicePL/smart_irrigation_automation/blob/main/blueprints/automation/smart_irrigation_automation/smart_irrigation_en.yaml
  input:
    weather_section:
      name: Shared weather entities and sensors
      icon: mdi:weather-partly-rainy
      input:
        forecast_weather_entity:
          name: Forecast weather entity
          description: Home Assistant weather entity with a daily forecast (e.g. Met.no, OpenWeatherMap). It provides the rain forecast, chance of rain and weather conditions, and without a weather station also the current temperature, wind and UV.
          selector:
            entity:
              filter:
                - domain: weather

    local_weather_overrides_section:
      name: Weather station and sensors (optional)
      icon: mdi:weather-partly-rainy
      input:
        current_weather_entity:
          name: Local weather entity
          description: Optional override for the current weather condition. Empty = use the main forecast entity.
          default: ""
          selector:
            entity:
              filter:
                - domain: weather
        rain_binary_sensor:
          name: Rain sensor
          description: Optional physical rain sensor. When it is on, watering does not start or is interrupted. When it is unavailable, watering is held for safety.
          default: ""
          selector:
            entity:
              filter:
                - domain: binary_sensor
        pogoda_opad_24h_wstecz:
          name: Rain from the last 24 hours - main source
          description: Optional rain sensor in mm for the last 24 hours (rolling). The Smart Service panel fills it with sensor.migiels_pogoda_opad_24h_wstecz. When it is selected and reports a number, it takes priority over the "Measured rain" field below. When it is unavailable, "Measured rain" is used as the fallback, and if that does not work either, the rain is treated as unknown. Every switch to the fallback or to unknown rain is written to the reason helper.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        rain_amount_sensor:
          name: Measured rain - preferably the last 24 h (fallback)
          description: Your own rain sensor in mm; the fallback when the main source (rain from the last 24 hours) is not selected or does not report a number. A rolling 24-hour total or the total of the current rain event is best; a daily-only sensor may miss rain after midnight. The value is subtracted from the balance. Without any rain sensor the rain for the balance is estimated from the daily forecast of the weather entity (once per day, marked in notifications as an estimate from the forecast). When the sensor is temporarily unavailable, the balance keeps the stored rain.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        temperature_source_entity:
          name: Garden temperature
          description: Optional garden temperature sensor or weather entity. Empty = use the main weather entity. Low temperature blocks watering, heat increases the dose. When the selected sensor is unavailable, the current temperature of the weather entity is used; without any current temperature watering is held. Temperatures in °F are converted to °C automatically.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        wind_source_entity:
          name: Wind
          description: Optional wind sensor or weather entity. Empty = use the main weather entity. Too strong wind blocks watering because the sprinklers would lose uniformity. When the selected sensor is unavailable, the wind of the weather entity is used; if it is missing there as well, watering is held.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        sunlight_source_entity:
          name: UV / sun
          description: Optional UV/sun sensor or weather entity with uv_index. Empty = use the main weather entity. Used for the fallback evapotranspiration estimate when ET0 is not available.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        reference_et_sensor:
          name: Daily ET0 / evapotranspiration
          description: Optional sensor of daily reference evapotranspiration in mm. Empty = ET0 is estimated from temperature, UV and wind.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        solar_radiation_mean_sensor:
          name: Solar radiation - 24 h mean
          description: >-
            Optional. Mean solar radiation of the last 24 hours in W/m², calculated
            from the weather station sensor. When selected, ET0 is calculated with the Hargreaves
            radiation method, which is more accurate than the estimate from temperature, UV and wind.
            How to create it - 1) Settings, Devices & services, Helpers, Create helper,
            Statistics. 2) Select the solar radiation sensor of the station in W/m². 3) Characteristic -
            time-weighted linear average (average_linear), not the plain mean, because at night
            the sensor rarely changes state. 4) Max age 24 hours, leave the sampling size
            empty. 5) Select the created sensor here. The daily ET0 sensor above has
            priority. When this sensor is unavailable, the fallback estimate is used.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        soil_moisture_sensor:
          name: Soil moisture
          description: Optional representative soil moisture sensor in percent. It blocks watering directly once the threshold set in the weather blocks section is reached.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    general_section:
      name: General settings
      icon: mdi:tune
      input:
        zone_count:
          name: Number of sections
          description: How many sections this automation controls. Sections above this number stay in the configuration but are ignored.
          default: 1
          selector:
            number:
              min: 1
              max: 12
              step: 1
              mode: slider
        send_runtime_to_switch:
          name: Send the calculated runtime to the Rain Bird controller
          description: For Rain Bird RC2 the automation always uses rainbird_rc2.start_zone. This setting sends the runtime to the older Rain Bird integration through rainbird.start_irrigation. It does not change how Sonoff, Shelly, ESPHome or other ordinary switch/valve entities are handled.
          default: true
          selector:
            boolean:
        valve_runtime_watchdog:
          name: Section runtime watchdog
          description: Recommended. Closes a switch/valve section of this automation (except Rain Bird RC2 and Rain Bird, which have their own time limit in the controller) when it stays on longer than the maximum section runtime + 5 min, no matter who turned it on. Protects against flooding after an interrupted run. Disable it only if you deliberately water manually for longer than this limit.
          default: true
          selector:
            boolean:

    zone_1_section:
      name: Section 1
      icon: mdi:sprinkler-variant
      input:
        zone_1_valve:
          name: Section 1 - entity
          description: "Rain Bird RC2 section entity or any valve/switch entity, e.g. Sonoff, Shelly or ESPHome. The automation runs the section for the calculated time and stops it afterwards."
          selector:
            entity:
              filter:
                - domain: valve
                - domain: switch
        zone_1_name:
          name: Section 1 - name
          description: Readable section name shown in automation traces that helps to recognise the watered area.
          default: Section 1
          selector:
            text:
        zone_1_soil_type:
          name: Section 1 - soil type
          description: Choose the closest description of the garden soil. Light soils lose water faster, humus and black soil store it longer.
          default: loam
          selector:
            select:
              mode: dropdown
              options:
                - label: Sandy / very light
                  value: sand
                - label: Light garden soil
                  value: sandy_loam
                - label: Normal garden soil
                  value: loam
                - label: Humus-rich / compost-rich
                  value: humus
                - label: Black soil / chernozem
                  value: chernozem
                - label: Clay loam / heavy
                  value: clay_loam
                - label: Very heavy / compacted clay
                  value: clay
        zone_1_plant_type:
          name: Section 1 - plants
          description: Sets the base water demand. Vegetables need the most, grass is average, shrubs usually need less.
          default: grass
          selector:
            select:
              mode: dropdown
              options:
                - label: Grass
                  value: grass
                - label: Flowers
                  value: flowers
                - label: Vegetables
                  value: vegetables
                - label: Shrubs
                  value: shrubs
        zone_1_sprinkler_profile:
          name: Section 1 - sprinklers
          description: The profile sets the precipitation rate of the installation in mm/h. The higher the sprinkler rate, the shorter the calculated runtime.
          default: rainbird_rotor
          selector:
            select:
              mode: dropdown
              options:
                - label: Rain Bird 5000/3500 - rotors
                  value: rainbird_5000_rotor
                - label: Rain Bird 1800 - spray/fixed
                  value: rainbird_1800_spray
                - label: Rain Bird R-VAN - rotary nozzles
                  value: rainbird_rvan
                - label: Rain Bird XF - dripline
                  value: rainbird_xf_drip
                - label: Rain Bird - generic rotors
                  value: rainbird_rotor
                - label: Rain Bird - generic spray
                  value: rainbird_spray
                - label: Rain Bird - generic dripline
                  value: rainbird_drip
                - label: Hunter - rotors
                  value: hunter_rotor
                - label: Hunter - MP Rotator
                  value: hunter_mp_rotator
                - label: Hunter - spray/fixed
                  value: hunter_spray
                - label: Hunter - dripline
                  value: hunter_drip
                - label: Custom sprinkler rate
                  value: custom
        zone_1_custom_rate_mm_h:
          name: Section 1 - custom sprinkler rate
          description: Used only with the "Custom sprinkler rate" profile. Enter the real precipitation rate of the section in mm/h if you know it from a catch-cup test or the documentation.
          default: 12
          selector:
            number:
              min: 1
              max: 80
              step: 0.5
              unit_of_measurement: mm/h
              mode: box
        zone_1_runtime_adjustment_percent:
          name: Section 1 - runtime adjustment
          description: Manual runtime adjustment for this section. 100% = no change, more makes watering longer, less makes it shorter. The water balance subtracts the water actually applied, so the adjustment changes the amount per watering, not the total amount of water - shorter runs will be more frequent, longer runs less frequent.
          default: 100
          selector:
            number:
              min: 50
              max: 180
              step: 5
              unit_of_measurement: "%"
              mode: slider
        zone_1_online_sensor:
          name: Section 1 - online
          description: Optional online binary_sensor. If it is set and off, the section is skipped.
          default: ""
          selector:
            entity:
              filter:
                - domain: binary_sensor
        zone_1_battery_sensor:
          name: Section 1 - battery
          description: Optional battery sensor of the section. The section is skipped when the battery drops below the threshold from the weather blocks.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

