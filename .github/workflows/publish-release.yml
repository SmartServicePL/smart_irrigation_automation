name: Publish Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-release.yml"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read automation version
        id: version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import re
          from pathlib import Path
          # Only a released semantic version may become a tag; "## Unreleased" is skipped.
          for line in Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines():
              if re.match(r"^## \d+\.\d+\.\d+\s*$", line):
                  print(line[3:].strip())
                  break
          PY
          )"
          if [ -z "$version" ]; then
            echo "No released version heading in CHANGELOG.md" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          version = "${{ steps.version.outputs.version }}"
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          capture = False
          notes = []
          for line in lines:
              if line.startswith("## "):
                  heading = line[3:].strip()
                  if capture:
                      break
                  capture = heading == version
                  continue
              if capture:
                  notes.append(line)
          text = "\n".join(notes).strip() or f"Smart Irrigation Automation {version}"
          Path("RELEASE_NOTES.md").write_text(text + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG_NAME="v${VERSION}"
          # Existing tags are never moved; a published version stays where it was released.
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "Tag $TAG_NAME already exists, nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG_NAME"
          gh release create "$TAG_NAME" --target "$GITHUB_SHA" --title "$TAG_NAME" --notes-file RELEASE_NOTES.md --latest
